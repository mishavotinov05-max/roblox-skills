  {h:"Строгий режим: --!strict"},
  "Если первой строкой скрипта написать [[--!strict]], Studio будет проверять типы особенно тщательно и подчёркивать подозрительные места красным.",
  {c:'--!strict\nlocal coins: number = 0\ncoins = "много"   -- красное подчёркивание: string нельзя в number'},
  {tip:"Типы — это подсказки для редактора. На то, как работает игра, они не влияют: программа выполняется так же, но ты видишь ошибки заранее."}],
 ex:[
  C("Как указать тип переменной?",null,["local hp: number = 100","local number hp = 100","local hp = number(100)","local hp :: = 100"],0,"Тип пишут после имени через двоеточие: local имя: тип = значение. Запись «тип перед именем» — из C и Java, в Luau она не работает."),
  C("Какая строка включает строгую проверку типов?",null,["--!strict","--strict","#strict","use strict"],0,"Нужна именно --!strict (с восклицательным знаком) в самой первой строке. --strict без ! — просто обычный комментарий."),
  I("Укажи тип для текста",'local name: ___ = "Миша"',"string","Текст в Luau имеет тип string, поэтому аннотация — name: string."),
  C("Как указать тип результата функции?",null,["function f(a: number): number","function f(a: number) -> number","function f(a: number) => number","function number f(a)"],0,"Тип результата пишут после закрывающей скобки через двоеточие: (a: number): number."),
  C("Влияют ли аннотации типов на выполнение кода?",null,["Нет, их проверяет только анализатор","Да, код ускоряется вдвое","Да, без них код не запустится","Только в LocalScript"],0,"Типы — это подсказки для анализатора в редакторе. Код с ними и без них работает одинаково, просто с типами ты видишь ошибки до запуска."),
  O("Объяви скорость с типом number",["local","speed",":","number","=","16"],["::","->"],"Порядок: local, имя, двоеточие, тип, знак =, значение. :: и -> используются для других вещей.")]},
 {title:"Опциональные и составные типы",theory:[
  {h:"Значение может отсутствовать: ?"},
  "Часто переменная то содержит что-то, то равна [[nil]]. Например, цель для атаки: её может и не быть. Для этого после типа ставят знак вопроса.",
  {c:'local target: Player? = nil   -- Player ИЛИ nil\n\n-- позже:\ntarget = somePlayer           -- можно\ntarget = nil                  -- тоже можно'},
  "[[Player?]] читается как «Player или ничего». Без вопроса редактор ругался бы на [[nil]].",
  {h:"Одно из нескольких: |"},
  "Вертикальная черта [[|]] значит «или». Так указывают, что значение может быть одного из нескольких типов.",
  {c:'local id: number | string = 42\nid = "player_42"   -- тоже можно\nid = true          -- ошибка: boolean тут не разрешён'},
  "На самом деле [[string?]] — это короткая запись для [[string | nil]].",
  {h:"any — без проверки"},
  "Тип [[any]] значит «тут может быть что угодно, не проверяй». Используй его редко: он отключает защиту от ошибок.",
  {c:'local data: any = "текст"\ndata = 5         -- редактор молчит\ndata = {}        -- и тут молчит'},
  {h:"Проверка перед использованием"},
  "Если значение может быть nil, сначала проверь его через [[if]]. Тогда внутри проверки редактор поймёт, что там точно не nil.",
  {c:'local weapon: Tool? = character:FindFirstChildOfClass("Tool")\nif weapon then\n    print(weapon.Name)   -- здесь weapon точно не nil\nend'}],
 ex:[
  C("Что означает тип «string?» (со знаком вопроса)?",null,["string или nil","Строка с ошибкой","Пустая строка","Любой тип"],0,"Знак ? после типа значит «или nil». string? — это строка или ничего."),
  C("Что означает number | string?",null,["Число или строка","Число и строка вместе","Число, превращённое в строку","Ошибка"],0,"Вертикальная черта | — это «или». В такую переменную можно положить либо число, либо строку."),
  I("Сделай тип «Tool или nil»","local weapon: Tool___ = nil","?","Чтобы разрешить nil, после типа ставят знак вопроса: Tool?."),
  C("Какое значение подходит под number | boolean?",null,["true","\"5\"","{}","nil"],0,"true — это boolean, он есть в списке. \"5\" — строка (в кавычках), {} — таблица, nil — тоже нельзя, потому что вопросика нет."),
  C("Что делает тип any?",null,["Отключает проверку для значения","Разрешает только числа","Делает значение nil","Запрещает изменение"],0,"any говорит анализатору: «здесь может быть что угодно, не проверяй». Удобно, но ошибки больше не ловятся, поэтому используй его редко."),
  C("Что будет с local n: number = \"5\" под --!strict?",null,["Анализатор покажет ошибку типа","Строка станет числом","Ничего","Скрипт удалится"],0,"\"5\" в кавычках — это string, а переменная объявлена как number. Редактор подчеркнёт ошибку. Сам Luau строку в число автоматически не превратит.")]},
 {title:"Свои типы",theory:[
  {h:"Свой тип для своей таблицы"},
  "Когда в игре есть данные игрока с полями name, coins и level, удобно один раз описать их «форму» и дальше ссылаться на неё по имени. Для этого есть [[type]].",
  {c:'type PlayerData = {\n    name: string,\n    coins: number,\n    level: number,\n}\n\nlocal data: PlayerData = {\n    name = "Миша",\n    coins = 0,\n    level = 1,\n}'},
  "Теперь, если забыть поле или написать [[coins = \"сто\"]], редактор сразу подскажет.",
  {h:"Типы для массивов и словарей"},
  {c:'type Inventory = {string}              -- массив строк: {"Меч", "Щит"}\ntype Prices = {[string]: number}       -- словарь: { Меч = 100 }\n\nlocal inv: Inventory = {"Меч", "Щит"}\nlocal prices: Prices = { Меч = 100, Щит = 60 }'},
  "• [[{string}]] — массив, где каждый элемент строка.\n• [[{[string]: number}]] — словарь: ключи-строки, значения-числа.",
  {h:"Тип для функции"},
  "Тип функции записывается как «(параметры) -> результат»:",
  {c:'type Check = (number) -> boolean\n-- функция, которая принимает число и возвращает true/false\n\nlocal isPositive: Check = function(n)\n    return n > 0\nend'},
  {h:"Поделиться типом: export type"},
  "Если тип объявлен в ModuleScript, другие скрипты увидят его, только если написать [[export type]]. Про модули мы поговорим в разделе 11.",
  {c:'-- внутри ModuleScript\nexport type PlayerData = { name: string, coins: number }'}],
 ex:[
  C("Каким словом объявляют свой тип?",null,["type","typedef","interface","class"],0,"В Luau свой тип объявляют словом type: type Имя = описание. typedef — из C, interface — из TypeScript и Java."),
  C("Что будет, если в data: PlayerData не указать coins (под --!strict)?",null,["Предупреждение анализатора","coins станет 0","Ничего","Ошибка при запуске игры"],0,"Тип PlayerData требует поле coins. Анализатор заметит, что его нет, и подчеркнёт. Само значение не появится: coins будет nil."),
  C("Как отдать тип из ModuleScript?",null,["export type","public type","return type","module type"],0,"Чтобы другие скрипты могли использовать тип из модуля, его объявляют через export type."),
  I("Объяви тип для точки",'___ Vector2D = { x: number, y: number }',"type","Новый тип объявляется словом type, дальше имя и описание формы таблицы."),
  C("Как записать тип «массив чисел»?",null,["{number}","[number]","number[]","Array<number>"],0,"В Luau массив — это тип элементов в фигурных скобках: {number}. Записи number[] и Array<number> — из TypeScript."),
  C("Что означает (number) -> boolean?",null,["Функция: принимает число, возвращает boolean","Таблица чисел","Число или boolean","Приведение типа"],0,"В скобках — что функция принимает (число), после стрелки -> — что возвращает (boolean).")]}
 ]},
{title:"Объекты Roblox",desc:"Иерархия, Instance.new, свойства, Vector3 и CFrame",
 practice:{min:45,tasks:["В ServerScriptService создай Script.","Через цикл for i = 1, 10 создай 10 частей: Instance.new(\"Part\").","Каждой задай Size = Vector3.new(6, 1, 4) и Position = Vector3.new(0, i * 2, i * 4), чтобы получилась лестница.","Покрась ступеньки: part.Color = Color3.fromHSV(i / 10, 1, 1). Включи Anchored = true и задай Parent = workspace.","Через TweenService сделай так, чтобы верхняя ступенька плавно поднималась на 10 единиц за 2 секунды."]},
 lessons:[
 {title:"Иерархия игры",theory:[
  {h:"Всё в игре — объекты"},
  "Каждая часть, модель, скрипт, звук и кнопка в Roblox — это объект (по-английски Instance). Объекты вложены друг в друга, как папки на компьютере. Это дерево ты видишь в окне Explorer.",
  {c:'game                      -- корень, вся игра\n├── Workspace             -- 3D-мир: всё, что видно\n│   ├── Baseplate\n│   └── Door\n├── Players               -- игроки на сервере\n├── ReplicatedStorage     -- общее хранилище\n├── ServerScriptService   -- серверные скрипты\n└── StarterGui            -- интерфейс'},
  {h:"Родитель и потомки"},
  "У каждого объекта есть [[Parent]] — родитель, внутри которого он лежит. У Door родитель — Workspace. У каждого объекта есть и имя — [[Name]].",
  {h:"Как добраться до объекта"},
  {c:'-- через точку (если точно знаешь, что объект есть):\nlocal door = workspace.Door\n\n-- безопасный поиск: вернёт nil, если не найдёт\nlocal door = workspace:FindFirstChild("Door")\nif door then\n    print("Дверь найдена")\nend\n\n-- ждать, пока объект появится (нужно на стороне игрока):\nlocal gui = player:WaitForChild("PlayerGui")'},
  "• [[workspace.Door]] — если Door нет, будет ошибка.\n• [[FindFirstChild]] — найти сразу. Если нет — nil, без ошибки.\n• [[WaitForChild]] — подождать, пока объект загрузится.",
  {h:"Сервисы"},
  "Главные контейнеры (Players, ReplicatedStorage и другие) называются сервисами. Правильный способ получить сервис — [[game:GetService]]:",
  {c:'local Players = game:GetService("Players")\nlocal ReplicatedStorage = game:GetService("ReplicatedStorage")'},
  {tip:"У методов объектов (FindFirstChild, GetService, Destroy) ставится двоеточие, а у свойств (Name, Parent) — точка."}],
 ex:[
  C("Какой объект — корень всей игры?",null,["game","workspace","script","Players"],0,"game — самый верхний объект. Все остальные (Workspace, Players и так далее) лежат внутри него."),
  C("Где находятся объекты 3D-мира?",null,["Workspace","ServerStorage","StarterGui","Lighting"],0,"Всё, что игрок видит в мире (части, модели, персонажи), лежит в Workspace. Объекты в ServerStorage не видны и не участвуют в физике."),
  I("Получи сервис Players",'local Players = game:___("Players")',"GetService","Сервисы получают методом game:GetService(\"ИмяСервиса\"). Это надёжнее, чем game.Players."),
  C("Что вернёт FindFirstChild, если объекта нет?",null,["nil","Ошибку","Пустой объект","false"],0,"FindFirstChild не ломает скрипт, а возвращает nil. Поэтому после него проверяют результат: if door then … end."),
  C("Чем WaitForChild отличается от FindFirstChild?",null,["Ждёт, пока объект появится","Ищет быстрее","Создаёт объект","Ничем"],0,"FindFirstChild ищет только один раз, прямо сейчас. WaitForChild ждёт, пока объект загрузится. Это важно в LocalScript, где объекты подгружаются не сразу."),
  O("Найди дверь в Workspace",["local","door","=","workspace",":FindFirstChild(","\"Door\"",")"],[".FindFirstChild(","game"],"FindFirstChild — это метод, поэтому вызывается через двоеточие, а имя объекта пишется в кавычках.")]},
 {title:"Создание объектов и свойства",theory:[
  {h:"Создать объект кодом"},
  "Объекты можно не только ставить руками в Studio, но и создавать скриптом. Так делают спавн монет, пуль и врагов.",
  {c:'local part = Instance.new("Part")   -- создать часть'},
  "В кавычках — класс объекта: [[\"Part\"]], [[\"Model\"]], [[\"Folder\"]], [[\"IntValue\"]] и так далее.",
  {h:"Свойства"},
  "У каждого объекта есть свойства — его настройки. Это то же самое, что ты видишь в окне Properties. Меняются они через точку:",
  {c:'part.Name = "MyPart"\npart.Size = Vector3.new(4, 1, 4)        -- ширина, высота, глубина\npart.Position = Vector3.new(0, 10, 0)   -- X, Y (высота), Z\npart.Color = Color3.fromRGB(255, 0, 0)  -- красный\npart.Anchored = true                    -- закрепить\npart.Transparency = 0.5                 -- полупрозрачная\npart.Parent = workspace                 -- поместить в мир'},
  {h:"Что значат новые штуки"},
  "• [[Vector3.new(x, y, z)]] — три числа для 3D: X влево-вправо, Y вверх-вниз, Z вперёд-назад. Используется для позиции и размера.\n• [[Color3.fromRGB(r, g, b)]] — цвет из красного, зелёного и синего, каждый от 0 до 255.\n• [[Anchored = true]] — часть закреплена, физика её не двигает и она не упадёт.",
  {h:"Parent — самое важное"},
  "Пока у объекта нет [[Parent]], он существует только в памяти, и в игре его нет. Как только написал [[part.Parent = workspace]], часть появляется в мире.",
  {tip:"Ставь Parent последней строкой, после всех свойств. Так Roblox не будет пересчитывать объект после каждой настройки, и это быстрее."},
  {h:"Удалить объект"},
  {c:'part:Destroy()   -- удалить часть и всё, что внутри неё'}],
 ex:[
  C("Где появится Instance.new(\"Part\") без Parent?",null,["Нигде, пока не задан Parent","В Workspace","В ServerStorage","В руках игрока"],0,"Новый объект висит в памяти «без дома». Чтобы он появился в мире, нужно задать part.Parent = workspace."),
  C("Что делает Anchored = true?",null,["Часть не двигается физикой","Часть становится прозрачной","Часть нельзя удалить","Часть светится"],0,"Anchored — «закреплено». Такую часть не двигают гравитация и толчки, она висит на месте. Без этого часть упадёт на землю."),
  I("Помести часть в мир","part.___ = workspace","Parent","Свойство Parent задаёт, внутри какого объекта лежит часть. Workspace — это 3D-мир."),
  C("Что такое Vector3.new(4, 1, 4)?",null,["Трёхмерный вектор X, Y, Z","Цвет","Поворот","Массив"],0,"Vector3 — три числа для трёх осей. Для размера это ширина 4, высота 1, глубина 4 — получается плоская плита."),
  C("Какой цвет у Color3.fromRGB(255, 0, 0)?",null,["Красный","Зелёный","Синий","Белый"],0,"RGB — это Red, Green, Blue. Здесь красный на максимуме (255), а зелёного и синего нет (0), поэтому цвет красный."),
  C("Как удалить объект?",null,["part:Destroy()","part = nil","delete part","part.Remove"],0,"Destroy удаляет объект из игры вместе со всем, что внутри него. part = nil только очищает переменную, а сама часть остаётся в мире.")]},
 {title:"CFrame и движение",theory:[
  {h:"Position и CFrame"},
  "[[Position]] хранит только место, где находится часть. [[CFrame]] (Coordinate Frame) хранит и место, и поворот: куда часть смотрит.",
  {c:'part.CFrame = CFrame.new(0, 5, 0)   -- поставить в точку (0, 5, 0)'},
  {h:"Повороты"},
  "Поворот задаётся через [[CFrame.Angles(x, y, z)]] — углы вокруг трёх осей. Важно: углы задаются не в градусах, а в радианах. Переводит градусы в радианы [[math.rad]].",
  {c:'-- повернуть часть на 90° вокруг вертикальной оси\npart.CFrame = part.CFrame * CFrame.Angles(0, math.rad(90), 0)'},
  "Знак [[*]] между CFrame значит «применить поворот к текущему положению».",
  {h:"Сложение векторов"},
  "Чтобы сдвинуть часть, к её позиции прибавляют вектор:",
  {c:'part.Position = part.Position + Vector3.new(0, 5, 0)   -- поднять на 5\n\nprint(Vector3.new(1, 2, 3) + Vector3.new(1, 1, 1))\n--> 2, 3, 4  (каждая координата складывается отдельно)'},
  {h:"Плавное движение: TweenService"},
  "Если просто поменять Position, часть мгновенно телепортируется. Чтобы она плавно поехала, используют TweenService (tween — «переход»).",
  {c:'local TweenService = game:GetService("TweenService")\n\nlocal info = TweenInfo.new(2)   -- длительность 2 секунды\nlocal goal = { Position = Vector3.new(0, 20, 0) }   -- куда приехать\n\nlocal tween = TweenService:Create(part, info, goal)\ntween:Play()   -- запустить!'},
  "Три шага: настроить время ([[TweenInfo]]), сказать, какие свойства и к чему изменить ([[goal]]), создать твин и запустить [[:Play()]]. Так делают двери, лифты и анимации кнопок.",
  {tip:"Анимировать твином можно не только Position, но и Color, Transparency, Size — почти любое числовое свойство."}],
 ex:[
  C("Что хранит CFrame?",null,["Позицию и поворот","Только цвет","Только размер","Скорость"],0,"CFrame — это положение в пространстве плюс направление, куда смотрит объект. Position хранит только положение."),
  C("В чём задаются углы в CFrame.Angles?",null,["В радианах","В градусах","В процентах","В оборотах"],0,"Углы задаются в радианах: полный оборот — около 6.28, а не 360. Градусы переводят функцией math.rad(градусы)."),
  I("Переведи 90 градусов в радианы","CFrame.Angles(0, math.___(90), 0)","rad","math.rad (от radians) переводит градусы в радианы: math.rad(90) ≈ 1.57."),
  C("Чему равно Vector3.new(1, 2, 3) + Vector3.new(1, 1, 1)?",null,["2, 3, 4","1, 2, 3","3, 3, 3","Ошибка"],0,"Векторы складываются по координатам: X: 1 + 1 = 2, Y: 2 + 1 = 3, Z: 3 + 1 = 4."),
  C("Что делает TweenService?",null,["Плавно меняет свойства объекта","Сохраняет данные","Создаёт части","Проигрывает звуки"],0,"TweenService плавно переводит свойства из текущего значения в целевое за заданное время. Так получается анимация без рывков."),
  C("Что запускает созданный твин?",null,[":Play()",":Start()",":Run()",":Fire()"],0,"TweenService:Create только создаёт твин, но не запускает его. Анимация начнётся после вызова :Play().")]}
 ]},
{title:"События",desc:"Connect, Touched, игроки и библиотека task",
 practice:{min:60,tasks:["Сделай красную закреплённую часть Lava. Добавь в неё Script: при касании ищи Humanoid в hit.Parent и ставь Health = 0.","В ServerScriptService сделай Script с PlayerAdded: создай папку leaderstats и IntValue «Coins» для каждого игрока.","Сделай жёлтую монетку (Part). При касании игроком +1 к Coins.","После сбора монетка становится невидимой (Transparency = 1, CanTouch = false) на 5 секунд и возвращается.","Добавь debounce и проверь: одно касание должно давать ровно одну монету."]},
 lessons:[
 {title:"Подписка на события",theory:[
  {h:"Что такое событие"},
  "Событие — это сигнал «что-то произошло»: игрок коснулся части, нажал кнопку, зашёл в игру. Твой код может «подписаться» на событие, то есть сказать: «когда это случится, выполни мою функцию».",
  {h:"Как подписаться: :Connect"},
  {c:'local part = workspace.Button\n\nlocal function onTouched(hit)\n    print("Кто-то коснулся: " .. hit.Name)\nend\n\npart.Touched:Connect(onTouched)'},
  "Читается так: «у part есть событие Touched (касание). Подключи к нему функцию onTouched». Теперь при каждом касании Roblox сам вызовет эту функцию и передаст в неё [[hit]] — часть, которая коснулась.",
  "Чаще функцию пишут прямо внутри [[Connect]], без отдельного имени:",
  {c:'part.Touched:Connect(function(hit)\n    print("Касание!")\nend)'},
  "Обрати внимание: в конце стоит [[end)]] — [[end]] закрывает функцию, а [[)]] закрывает скобку Connect.",
  {h:"Пример: лава"},
  {c:'local lava = workspace.Lava\n\nlava.Touched:Connect(function(hit)\n    -- hit — часть тела, например LeftFoot\n    -- hit.Parent — модель персонажа\n    local humanoid = hit.Parent:FindFirstChild("Humanoid")\n    if humanoid then           -- это точно игрок или NPC?\n        humanoid.Health = 0    -- обнулить здоровье\n    end\nend)'},
  "Зачем проверка [[if humanoid]]? Лаву может задеть не только игрок, но и упавший кубик. У кубика нет Humanoid, и без проверки скрипт выдал бы ошибку.",
  {h:"Отписаться"},
  {c:'local connection = part.Touched:Connect(onTouched)\n-- … позже:\nconnection:Disconnect()   -- больше не реагировать'}],
 ex:[
  C("Каким методом подписаться на событие?",null,[":Connect",":Listen",":On",":Subscribe"],0,"В Roblox подписка всегда делается через :Connect: событие:Connect(функция)."),
  C("Что Touched передаёт в функцию?",null,["Часть, которая коснулась","Игрока","Позицию касания","Ничего"],0,"Touched передаёт часть (BasePart), которая коснулась: ногу, руку, другой кубик. Не игрока! Игрока ещё нужно найти через эту часть."),
  C("Если коснулась нога персонажа, что такое hit.Parent?",null,["Модель персонажа","Игрок (Player)","Workspace","Humanoid"],0,"Части тела (нога, рука, голова) лежат внутри модели персонажа. Значит родитель ноги — сама модель, а в ней уже лежит Humanoid."),
  I("Подпиши функцию onTouch","part.Touched:___(onTouch)","Connect","Чтобы функция вызывалась при каждом касании, её подключают к событию методом :Connect."),
  C("Как отписаться от события?",null,["connection:Disconnect()","connection:Destroy()","event:Stop()","connection = nil"],0,"Connect возвращает объект соединения. Его метод :Disconnect() отключает функцию от события."),
  C("Зачем проверять, есть ли Humanoid?",null,["Коснуться может не игрок, а любая часть","Чтобы было быстрее","Так требует Roblox","Незачем"],0,"Touched срабатывает на касание любой части: кубика, мяча, другой стены. У них нет Humanoid, и без проверки обращение к humanoid.Health вызвало бы ошибку.")]},
 {title:"Игроки и leaderstats",theory:[
  {h:"Когда игрок заходит"},
  "Сервис [[Players]] следит за игроками. Его событие [[PlayerAdded]] срабатывает каждый раз, когда кто-то заходит в игру, и передаёт объект этого игрока.",
  {c:'local Players = game:GetService("Players")\n\nPlayers.PlayerAdded:Connect(function(player)\n    print(player.Name .. " зашёл в игру")\nend)'},
  {h:"Таблица лидеров: leaderstats"},
  "Чтобы справа вверху появилась таблица с монетами, внутри игрока создают папку с точным именем [[leaderstats]], а в ней — значения.",
  {c:'Players.PlayerAdded:Connect(function(player)\n    -- 1. Папка leaderstats\n    local stats = Instance.new("Folder")\n    stats.Name = "leaderstats"       -- имя строго такое!\n    stats.Parent = player\n\n    -- 2. Счётчик монет\n    local coins = Instance.new("IntValue")\n    coins.Name = "Coins"             -- название колонки\n    coins.Value = 0\n    coins.Parent = stats\nend)'},
  "[[IntValue]] — объект, который хранит целое число в свойстве [[Value]]. Чтобы дать монету: [[coins.Value += 1]].",
  {h:"Персонаж появляется заново"},
  "Игрок ([[Player]]) и его персонаж ([[Character]], модель с телом) — разные вещи. Игрок существует всё время, а персонаж создаётся заново после каждой смерти. Для этого есть событие [[CharacterAdded]]:",
  {c:'player.CharacterAdded:Connect(function(character)\n    local humanoid = character:WaitForChild("Humanoid")\n    humanoid.WalkSpeed = 24   -- ускорить при каждом появлении\nend)'},
  {h:"Как найти игрока по части тела"},
  {c:'part.Touched:Connect(function(hit)\n    local player = Players:GetPlayerFromCharacter(hit.Parent)\n    if player then\n        player.leaderstats.Coins.Value += 1\n    end\nend)'}],
 ex:[
  C("Когда срабатывает Players.PlayerAdded?",null,["Когда игрок заходит в игру","Когда игрок прыгает","Когда игрок выходит","Каждую секунду"],0,"PlayerAdded — «игрок добавлен», то есть зашёл на сервер. Для выхода есть отдельное событие PlayerRemoving."),
  C("Как должна называться папка для таблицы лидеров?",null,["leaderstats","Leaderboard","stats","LeaderStats"],0,"Roblox показывает таблицу лидеров, только если папка называется ровно leaderstats, маленькими буквами. Любая другая запись не сработает."),
  I("Допиши параметр события",'Players.PlayerAdded:Connect(function(___)\n    print(player.Name)\nend)',"player","PlayerAdded передаёт в функцию объект зашедшего игрока. Внутри используется имя player, значит и параметр должен называться player."),
  C("Какой объект хранит целое число монет?",null,["IntValue","NumberText","Folder","Script"],0,"IntValue хранит целое число в свойстве .Value. Folder — просто папка, а NumberText не существует."),
  C("Когда срабатывает CharacterAdded?",null,["При каждом появлении персонажа","Один раз за игру","При выходе","При покупке"],0,"После каждой смерти Roblox создаёт персонажа заново, и CharacterAdded срабатывает каждый раз. Поэтому настройки персонажа (скорость и так далее) делают именно в нём."),
  O("Создай папку",["local","stats","=","Instance.new(",'"Folder"',")"],["new Folder","Folder.new("],"Любой объект Roblox создаётся одинаково: Instance.new(\"ИмяКласса\").")]},
 {title:"task и debounce",theory:[
  {h:"Работа со временем: task"},
  "Библиотека [[task]] управляет тем, когда выполняется код.",
  {c:'print("Раз")\ntask.wait(2)          -- подождать 2 секунды\nprint("Два")          -- выведется через 2 секунды'},
  "• [[task.wait(сек)]] — пауза в этом месте кода.\n• [[task.delay(сек, функция)]] — вызвать функцию через N секунд, а код ниже продолжит работать сразу.\n• [[task.spawn(функция)]] — запустить функцию «параллельно», не дожидаясь её конца.",
  {c:'task.delay(3, function()\n    print("Прошло 3 секунды")\nend)\nprint("Это выведется сразу")\n\ntask.spawn(function()\n    while true do\n        print("тик")\n        task.wait(1)\n    end\nend)\nprint("Цикл не мешает этому коду")'},
  {tip:"Старые wait(), spawn() и delay() без task. устарели. Пиши всегда с task."},
  {h:"Проблема: Touched срабатывает много раз"},
  "Когда игрок наступает на монетку, Touched срабатывает не один раз, а десятки: каждая часть тела касается её по нескольку раз. Без защиты игрок получит 20 монет за одно касание.",
  {h:"Решение: debounce («антидребезг»)"},
  "Это переменная-флаг «занято». Пока флаг включён, новые касания игнорируются.",
  {c:'local debounce = false\n\ncoin.Touched:Connect(function(hit)\n    if debounce then return end   -- 1. занято? выходим\n    debounce = true               -- 2. ставим «занято»\n\n    print("Монета собрана!")      -- 3. делаем дело\n\n    task.wait(1)                  -- 4. ждём секунду\n    debounce = false              -- 5. снова свободно\nend)'},
  "[[return]] внутри функции означает «закончить её прямо сейчас». Пока прошлое касание обрабатывается, все новые сразу выходят на первой строке."],
 ex:[
  C("Что делает task.wait(2)?",null,["Пауза на 2 секунды","Ждёт 2 кадра","Ждёт 2 игроков","Повторяет код 2 раза"],0,"task.wait(2) останавливает выполнение в этом месте на 2 секунды, потом код продолжается со следующей строки."),
  C("Что использовать вместо устаревшего wait()?",null,["task.wait()","sleep()","os.wait()","game:Wait()"],0,"Roblox рекомендует task.wait(): он точнее и лучше работает. Старый wait() ещё работает, но в новом коде его не пишут."),
  C("Что делает task.spawn(f)?",null,["Запускает f сразу, не дожидаясь её конца","Создаёт часть","Вызывает f через секунду","Удаляет f"],0,"task.spawn запускает функцию отдельным потоком. Даже если внутри неё бесконечный цикл, код после task.spawn продолжит выполняться."),
  C("Зачем нужен debounce?",null,["Чтобы событие не срабатывало много раз подряд","Для ускорения","Для сохранения данных","Для анимации"],0,"Touched и другие события срабатывают по многу раз подряд. Debounce — флаг «занято», который пропускает только первое срабатывание, пока идёт обработка."),
  I("Выйди из функции, если debounce включён","if debounce then ___ end","return","return сразу завершает функцию. Если флаг «занято» включён, дальше не идём."),
  C("Что делает task.delay(3, f)?",null,["Вызовет f через 3 секунды","Вызовет f 3 раза","Остановит f на 3 секунды","Удалит f через 3 секунды"],0,"task.delay откладывает вызов: функция f выполнится через 3 секунды. Код после task.delay при этом не ждёт и выполняется сразу.")]}
 ]},
{title:"Клиент и сервер",desc:"Script и LocalScript, RemoteEvent, ModuleScript",
 practice:{min:60,tasks:["В ReplicatedStorage создай RemoteEvent и назови его GiveCoin.","В StarterGui создай ScreenGui → TextButton с текстом «Получить монету», а в кнопке — LocalScript.","В LocalScript: при button.MouseButton1Click вызывай GiveCoin:FireServer().","В ServerScriptService в Script: GiveCoin.OnServerEvent:Connect(function(player) …) — добавь монету в leaderstats.","Добавь на сервере кулдаун: храни время последнего нажатия для каждого игрока и не выдавай монету чаще раза в 2 секунды.","Вынеси награду и кулдаун в ModuleScript Config в ReplicatedStorage и подключи его через require."]},
 lessons:[
 {title:"Script и LocalScript",theory:[
  {h:"Две стороны игры"},
  "Игра в Roblox работает на двух сторонах одновременно:",
  "• Сервер — компьютер Roblox, где хранится «настоящая» игра. Он один на всех игроков.\n• Клиент — устройство каждого игрока (телефон, ПК). У каждого игрока свой клиент.",
  {h:"Два вида скриптов"},
  "• [[Script]] (обычный) работает на сервере. Там правила игры: монеты, урон, покупки, сохранение. Кладут в [[ServerScriptService]].\n• [[LocalScript]] работает на клиенте. Там всё, что касается одного игрока: интерфейс, кнопки, камера, нажатия клавиш. Кладут в [[StarterPlayerScripts]], [[StarterGui]] или [[StarterCharacterScripts]].",
  {c:'-- LocalScript: узнать, кто я\nlocal Players = game:GetService("Players")\nlocal player = Players.LocalPlayer\nprint("Я — " .. player.Name)'},
  "[[LocalPlayer]] есть только в LocalScript. У сервера нет «своего» игрока: он обслуживает всех сразу.",
  {h:"Главное правило безопасности"},
  "Читеры могут менять всё, что происходит на их клиенте: LocalScript, интерфейс, скорость персонажа. Поэтому:",
  "• Монеты, урон, покупки и предметы — только на сервере.\n• Клиент может лишь «попросить» сервер, а сервер проверяет, можно ли.",
  {tip:"Если давать монеты из LocalScript, их увидит только сам игрок, на сервере их не будет. А если бы это работало, читеры дали бы себе миллион."}],
 ex:[
  C("Где выполняется обычный Script?",null,["На сервере","У игрока","В Studio только","Везде одновременно"],0,"Обычный Script — серверный. Он работает на сервере Roblox и управляет игрой для всех."),
  C("Где выполняется LocalScript?",null,["На устройстве игрока","На сервере","В облаке Roblox","Нигде"],0,"LocalScript — клиентский скрипт. Он работает на компьютере или телефоне конкретного игрока, отсюда и слово Local."),
  C("Где LocalScript точно запустится?",null,["StarterPlayerScripts","ServerScriptService","ServerStorage","Lighting"],0,"LocalScript работает только в местах, связанных с игроком: StarterPlayerScripts, StarterGui, StarterCharacterScripts. В ServerScriptService он просто не запустится."),
  C("Где доступен Players.LocalPlayer?",null,["Только в LocalScript","Только в Script","В обоих","Нигде"],0,"LocalPlayer — «тот игрок, на чьём устройстве работает скрипт». Это имеет смысл только на клиенте. На сервере LocalPlayer равен nil."),
  C("Почему нельзя доверять клиенту выдачу монет?",null,["Читер может изменить клиентский код","Клиент медленный","Клиент не видит монет","Так быстрее"],0,"Всё, что на устройстве игрока, читер может подменить. Поэтому сервер — единственный, кто решает про монеты и предметы."),
  C("Куда класть серверные скрипты?",null,["ServerScriptService","StarterGui","ReplicatedFirst","Workspace.Camera"],0,"ServerScriptService — место для серверных скриптов. Его содержимое не отправляется игрокам, поэтому читеры не могут прочитать этот код.")]},
 {title:"RemoteEvent",theory:[
  {h:"Как клиенту поговорить с сервером"},
  "Игрок нажал кнопку «Купить» (это LocalScript), но покупку должен провести сервер. Как передать сообщение? Через [[RemoteEvent]] — «удалённое событие», как телефонная линия между клиентом и сервером.",
  {h:"Шаг 1. Создать RemoteEvent"},
  "Положи RemoteEvent в [[ReplicatedStorage]] и назови, например, BuyItem. ReplicatedStorage видят и клиент, и сервер.",
  {h:"Шаг 2. Клиент отправляет: FireServer"},
  {c:'-- LocalScript (в кнопке)\nlocal ReplicatedStorage = game:GetService("ReplicatedStorage")\nlocal remote = ReplicatedStorage:WaitForChild("BuyItem")\n\nbutton.MouseButton1Click:Connect(function()\n    remote:FireServer("Меч")   -- «сервер, хочу купить Меч»\nend)'},
  {h:"Шаг 3. Сервер принимает: OnServerEvent"},
  {c:'-- Script в ServerScriptService\nlocal remote = game.ReplicatedStorage.BuyItem\n\nremote.OnServerEvent:Connect(function(player, itemName)\n    -- player — кто отправил (Roblox подставил сам!)\n    -- itemName — "Меч" (то, что передал клиент)\n    local coins = player.leaderstats.Coins\n    if coins.Value >= 100 then      -- ПРОВЕРКА на сервере\n        coins.Value -= 100\n        print(player.Name .. " купил " .. itemName)\n    end\nend)'},
  "Важно: клиент вызвал [[FireServer(\"Меч\")]] с одним аргументом, а сервер получил два: первым Roblox сам подставляет [[player]]. Подделать его нельзя, поэтому сервер всегда знает, кто прислал запрос.",
  {h:"Обратно: сервер → клиент"},
  {c:'remote:FireClient(player, "Покупка успешна")   -- одному игроку\nremote:FireAllClients("Начался раунд!")      -- всем\n-- на клиенте: remote.OnClientEvent:Connect(function(msg) … end)'},
  {tip:"Если клиенту нужен ответ сразу («получилось или нет?»), используют RemoteFunction: клиент вызывает InvokeServer и ждёт результат."}],
 ex:[
  C("Куда положить RemoteEvent?",null,["ReplicatedStorage","ServerStorage","ServerScriptService","StarterPack"],0,"RemoteEvent должны видеть обе стороны. ReplicatedStorage виден и серверу, и клиентам, а ServerStorage и ServerScriptService клиент не видит."),
  C("Каким методом клиент отправляет сообщение серверу?",null,[":FireServer()",":FireClient()",":Send()",":InvokeClient()"],0,"FireServer — «выстрелить в сервер», то есть отправить сообщение от клиента к серверу. FireClient работает в обратную сторону."),
  C("Какой первый аргумент получает OnServerEvent?",null,["Игрок, который отправил","Первый аргумент FireServer","Сам RemoteEvent","Время"],0,"Roblox сам добавляет первым аргументом игрока-отправителя. Аргументы из FireServer идут уже после него."),
  I("Подпишись на сообщения от клиентов","remote.___:Connect(function(player, item)\nend)","OnServerEvent","На сервере сообщения от клиентов приходят через событие OnServerEvent («когда пришло на сервер»)."),
  C("Как сервер отправит сообщение одному игроку?",null,["remote:FireClient(player, …)","remote:FireServer(player)","remote:Fire(player)","player:Fire()"],0,"FireClient отправляет от сервера конкретному клиенту, поэтому первым указывают, какому игроку. Всем сразу — FireAllClients."),
  C("Чем RemoteFunction отличается от RemoteEvent?",null,["Возвращает ответ вызывающему","Работает быстрее","Только для сервера","Ничем"],0,"RemoteEvent — «отправил и забыл». RemoteFunction — «спросил и ждёшь ответ»: InvokeServer возвращает то, что вернул сервер.")]},
 {title:"ModuleScript",theory:[
  {h:"Зачем нужны модули"},
  "Представь, что награда за монету (5) записана в десяти скриптах. Захочешь поменять на 10 — придётся править все десять. ModuleScript решает это: общий код и настройки хранятся в одном месте, а остальные скрипты их подключают.",
  {h:"Как устроен модуль"},
  "ModuleScript — это скрипт, который создаёт таблицу, складывает в неё данные и функции и в конце возвращает её через [[return]].",
  {c:'-- ModuleScript "Config" в ReplicatedStorage\nlocal Config = {}\n\nConfig.COIN_REWARD = 5\nConfig.COOLDOWN = 2\n\nfunction Config.formatCoins(n)\n    return `{n} монет`\nend\n\nreturn Config   -- обязательно в конце!'},
  {h:"Как подключить: require"},
  {c:'-- любой Script или LocalScript\nlocal ReplicatedStorage = game:GetService("ReplicatedStorage")\nlocal Config = require(ReplicatedStorage.Config)\n\nprint(Config.COIN_REWARD)               --> 5\nprint(Config.formatCoins(10))           --> 10 монет'},
  "[[require]] выполняет модуль и возвращает то, что модуль вернул через [[return]]. В нашем случае — таблицу Config.",
  {h:"Модуль выполняется один раз"},
  "Если пять скриптов сделают [[require]] одного модуля, его код выполнится только в первый раз. Остальные получат ту же самую таблицу. Значит, через модуль скрипты могут делиться общими данными.",
  {h:"Где хранить модули"},
  "• Нужен и клиенту, и серверу → [[ReplicatedStorage]].\n• Только серверу (секретная логика) → [[ServerScriptService]] или [[ServerStorage]].",
  {tip:"Модуль должен вернуть ровно одно значение. Забудешь return — require выдаст ошибку."}],
 ex:[
  C("Что должен делать ModuleScript в конце?",null,["Вернуть ровно одно значение (return)","Вызвать print","Ничего","Вызвать require"],0,"Модуль обязан закончиться return и одним значением, обычно таблицей. Именно его получат скрипты, которые сделают require."),
  C("Как подключить модуль?",null,["require(модуль)","import модуль","include(модуль)","load(модуль)"],0,"В Luau модули подключают функцией require, а в скобках указывают сам объект ModuleScript. import и include — из других языков."),
  I("Подключи модуль",'local M = ___(script.Parent.Module)',"require","require выполняет модуль и возвращает то, что тот вернул через return."),
  C("Что будет при втором require того же модуля?",null,["Вернётся та же таблица, код не выполнится снова","Модуль выполнится заново","Ошибка","nil"],0,"Roblox запоминает результат первого require. Повторные вызовы сразу возвращают ту же самую таблицу, и код модуля заново не выполняется."),
  C("Какая строка должна стоять последней в модуле Utils?",null,["return Utils","end Utils","export Utils","Utils()"],0,"Модуль собирает всё в таблицу Utils и отдаёт её наружу строкой return Utils."),
  C("Куда класть модуль, нужный и клиенту, и серверу?",null,["ReplicatedStorage","ServerScriptService","ServerStorage","StarterGui"],0,"ReplicatedStorage доступен обеим сторонам. Модуль в ServerScriptService или ServerStorage клиент не увидит.")]}
 ]},
{title:"ООП и надёжный код",desc:"Метатаблицы, классы, pcall",
 practice:{min:60,tasks:["В ModuleScript сделай класс Pet: Pet.__index = Pet, конструктор Pet.new(name) с полями name и hunger = 100.","Добавь метод Pet:feed(), который уменьшает hunger на 20 (не ниже 0, используй math.max), и метод Pet:describe(), который выводит имя и голод.","Создай двух питомцев, покорми одного и убедись, что у второго голод не изменился.","В Game Settings → Security включи Enable Studio Access to API Services.","Через DataStoreService сохраняй Coins игрока в PlayerRemoving и загружай в PlayerAdded. Каждый запрос оборачивай в pcall и выводи warn при ошибке."]},
 lessons:[
 {title:"Метатаблицы",theory:[
  {h:"Что такое метатаблица"},
  "Метатаблица — это «таблица настроек» для другой таблицы. Она меняет её поведение: что делать, если ключа нет, как складывать две таблицы и так далее. Это продвинутая тема, но на ней строятся классы, поэтому разберём её.",
  {h:"Главное поле: __index"},
  "Обычно, если в таблице нет ключа, получаешь nil. Но если у таблицы есть метатаблица с полем [[__index]], Luau сначала заглянет туда.",
  {c:'local defaults = { hp = 100, speed = 16 }\n\nlocal player = {}                          -- пустая таблица\nsetmetatable(player, { __index = defaults })\n\nprint(player.hp)      --> 100\n-- в player нет hp → Luau смотрит в __index (defaults) → находит 100\n\nplayer.hp = 50        -- записываем в САМ player\nprint(player.hp)      --> 50 (теперь своё значение есть)\nprint(defaults.hp)    --> 100 (defaults не изменился)'},
  "Аналогия: [[__index]] — это «запасная книга». Если ответа нет в своей тетради, смотришь в учебник.",
  {h:"Функции"},
  "• [[setmetatable(таблица, мета)]] — назначить метатаблицу (и вернуть саму таблицу).\n• [[getmetatable(таблица)]] — узнать метатаблицу.",
  {h:"Другие «магические» поля"},
  "Поля, которые начинаются с двух подчёркиваний, называются метаметодами:",
  "• [[__add]] — что делать при [[a + b]]\n• [[__eq]] — при [[a == b]]\n• [[__tostring]] — что показать в print",
  {c:'local mt = {}\nmt.__add = function(a, b)\n    return { value = a.value + b.value }\nend\n\nlocal x = setmetatable({ value = 2 }, mt)\nlocal y = setmetatable({ value = 3 }, mt)\nprint((x + y).value)   --> 5'}],
 ex:[
  C("Какая функция задаёт метатаблицу?",null,["setmetatable","metatable","setmeta","table.meta"],0,"setmetatable(таблица, метатаблица) назначает метатаблицу и возвращает саму таблицу."),
  C("Когда срабатывает __index?",null,["Когда ключа нет в таблице","При каждом чтении","При записи","При удалении"],0,"Если ключ есть в таблице, он берётся сразу, и __index не нужен. Только когда ключа нет, Luau заглядывает в __index."),
  C("Что выведет код?","local defaults = { hp = 100 }\nlocal p = setmetatable({}, { __index = defaults })\nprint(p.hp)",["100","nil","Ошибку","0"],0,"p пустая, ключа hp в ней нет. Но у неё есть __index = defaults, Luau смотрит туда и находит hp = 100."),
  I("Сделай так, чтобы obj искал недостающие ключи в Base","setmetatable(obj, { ___ = Base })","__index","Поле __index (два подчёркивания в начале) говорит, где искать ключи, которых нет в самой таблице."),
  C("Какой метаметод отвечает за оператор +?",null,["__add","__plus","__sum","__index"],0,"__add (от слова add — сложить) вызывается, когда к таблице применяют оператор +."),
  C("Что вернёт getmetatable(t)?",null,["Метатаблицу t","Копию t","Длину t","Ключи t"],0,"getmetatable возвращает метатаблицу, назначенную таблице t, или nil, если её нет.")]},
 {title:"Классы",theory:[
  {h:"Что такое класс"},
  "Класс — это «чертёж» для создания похожих объектов. Например, класс Car описывает, что у любой машины есть скорость и она умеет ехать. По этому чертежу можно сделать сколько угодно машин, и у каждой будет своя скорость.",
  "В Luau нет слова class, но классы собирают из таблицы и [[__index]].",
  {h:"Пошаговая сборка класса"},
  {c:'-- 1. Таблица класса. Она же хранит общие методы.\nlocal Car = {}\nCar.__index = Car   -- объекты будут искать методы в Car\n\n-- 2. Конструктор — функция, создающая новый объект\nfunction Car.new(speed)\n    local self = setmetatable({}, Car)  -- новый пустой объект\n    self.speed = speed                  -- его личные данные\n    return self\nend\n\n-- 3. Метод — функция, которую умеет каждый объект\nfunction Car:drive()\n    print("Еду со скоростью " .. self.speed)\nend'},
  {h:"Использование"},
  {c:'local a = Car.new(50)\nlocal b = Car.new(120)\n\na:drive()   --> Еду со скоростью 50\nb:drive()   --> Еду со скоростью 120'},
  "Как это работает: у объекта [[a]] есть только поле speed. Когда пишем [[a:drive()]], Luau не находит drive в a, идёт в метатаблицу ([[__index = Car]]) и находит [[Car.drive]].",
  {h:"Что такое self и двоеточие"},
  "Двоеточие — это сокращение. [[a:drive()]] — то же самое, что [[a.drive(a)]]: объект сам передаётся первым аргументом. Внутри метода он доступен как [[self]] («я сам»).",
  "А в объявлении [[function Car:drive()]] двоеточие автоматически добавляет скрытый параметр self.",
  {tip:"Частая ошибка: a.drive() через точку. Тогда self не передаётся, равен nil, и self.speed вызывает ошибку."}],
 ex:[
  C("Чему равно c:drive()?",null,["c.drive(c)","Car.drive()","c.drive()","drive(Car)"],0,"Двоеточие — сокращение: объект c сам передаётся первым аргументом. Поэтому c:drive() = c.drive(c), и внутри метода self = c."),
  C("Что выведет код?",'local Car = {}\nCar.__index = Car\nfunction Car.new(s)\n    local self = setmetatable({}, Car)\n    self.speed = s\n    return self\nend\nfunction Car:drive()\n    print("Еду " .. self.speed)\nend\nCar.new(50):drive()',["Еду 50","Еду nil","Ошибку","Еду speed"],0,"Car.new(50) создаёт объект с speed = 50. Метода drive в объекте нет, но через __index = Car он находится в Car. self — это наш объект, self.speed = 50."),
  I("Допиши строку, чтобы объекты находили методы","local Car = {}\nCar.___ = Car","__index","Car.__index = Car значит: «если в объекте нет ключа (например, метода drive), ищи его в Car»."),

/* ================= НАСТРОЙКИ ОЦЕНКИ ВРЕМЕНИ ================= */
const EST={lesson:10, test:10, final:30, review:0.15, project:30*60, confident:100*60};
const TEST_N=10, FINAL_N=30, PASS=0.8, MAX_HEARTS=5, HEART_REGEN_MIN=20;

/* ================= СОСТОЯНИЕ ================= */
const KEY='luau-tropa-v1';
const fresh=()=>({done:{},tests:{},practice:{},final:0,xp:0,hearts:MAX_HEARTS,heartTs:Date.now(),streak:0,lastDay:null,days:{},mistakes:[],goal:45,dpw:7,sound:true,answered:0,correct:0});
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function regenHearts(){
  if(S.hearts>=MAX_HEARTS){S.heartTs=Date.now();return;}
  const gained=Math.floor((Date.now()-S.heartTs)/(HEART_REGEN_MIN*6e4));
  if(gained>0){S.hearts=Math.min(MAX_HEARTS,S.hearts+gained);S.heartTs+=gained*HEART_REGEN_MIN*6e4;if(S.hearts>=MAX_HEARTS)S.heartTs=Date.now();save();}
}
function streakNow(){ if(!S.lastDay)return 0; const d=dayDiff(S.lastDay,today()); return d<=1?S.streak:0; }
function markActivity(minutes){
  const t=today();
  if(S.lastDay!==t){ S.streak=(S.lastDay&&dayDiff(S.lastDay,t)===1)?S.streak+1:1; S.lastDay=t; }
  S.days[t]=(S.days[t]||0)+minutes;
}

/* ================= ЛОГИКА ПРОГРЕССА ================= */
const lk=(u,l)=>u+'-'+l;
const passed=u=>(S.tests[u]||0)>=Math.ceil(TEST_N*PASS);
const unitOpen=u=>u===0||passed(u-1);
const lessonOpen=(u,l)=>unitOpen(u)&&(l===0||!!S.done[lk(u,l-1)]||passed(u));
const lessonsDone=u=>COURSE[u].lessons.every((_,l)=>S.done[lk(u,l)]);
const firstLocked=()=>{for(let u=0;u<COURSE.length;u++)if(!unitOpen(u))return u;return -1;};
const allPassed=()=>COURSE.every((_,u)=>passed(u));
function current(){
  for(let u=0;u<COURSE.length;u++){
    if(!unitOpen(u))return null;
    for(let l=0;l<COURSE[u].lessons.length;l++) if(!S.done[lk(u,l)]&&!passed(u)) return {u,l};
    if(!passed(u))return {u,test:true};
  }
  return allPassed()&&S.final<Math.ceil(FINAL_N*PASS)?{final:true}:null;
}
const exById=id=>{const [u,l,i]=id.split('.').map(Number);return COURSE[u].lessons[l].ex[i];};
const totalLessons=COURSE.reduce((a,u)=>a+u.lessons.length,0);
const totalEx=COURSE.reduce((a,u)=>a+u.lessons.reduce((b,l)=>b+l.ex.length,0),0);

/* ================= УТИЛИТЫ ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' мин';const h=Math.floor(m/60),r=m%60;return h+' ч'+(r?' '+r+' мин':'');};
const fmtHours=m=>{const h=m/60;return (h<10?h.toFixed(1).replace('.',','):Math.round(h))+' ч';};
const KW=new Set('and break continue do else elseif end false for function if in local nil not or repeat return then true until while type export'.split(' '));
const BI=new Set('print warn error pcall assert require typeof type tostring tonumber setmetatable getmetatable pairs ipairs game workspace script task math string table Instance Vector3 CFrame Color3 TweenInfo Enum'.split(' '));
function hl(src){
  let out='',i=0;const n=src.length;
  while(i<n){
    const ch=src[i],rest=src.slice(i);
    let m;
    if(rest.startsWith('--[[')){const e=src.indexOf(']]',i+4);const j=e<0?n:e+2;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(rest.startsWith('--')){const e=src.indexOf('\n',i);const j=e<0?n:e;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(ch==='"'||ch==="'"||ch==='`'){let j=i+1;while(j<n&&src[j]!==ch&&src[j]!=='\n'){if(src[j]==='\\')j++;j++;}j=Math.min(n,j+1);out+='<span class="s">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if((m=rest.match(/^\d+(\.\d+)?/))){out+='<span class="nm">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/))){const w=m[0];out+=KW.has(w)?'<span class="k">'+w+'</span>':BI.has(w)?'<span class="fn">'+w+'</span>':w;i+=w.length;continue;}
    out+=esc(ch);i++;
  }
  return out;
}
const inl=s=>esc(s).replace(/\[\[(.+?)\]\]/g,(_,c)=>'<code class="in">'+c+'</code>');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* звук */
let AC=null;
function beep(ok){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const notes=ok?[660,880]:[300,220];
    notes.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,AC.currentTime+k*.09);g.gain.exponentialRampToValueAtTime(ok?.18:.07,AC.currentTime+k*.09+.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+k*.09+.16);o.connect(g).connect(AC.destination);o.start(AC.currentTime+k*.09);o.stop(AC.currentTime+k*.09+.18);});
  }catch(e){}
}

/* ================= ВЕРХНЯЯ ПАНЕЛЬ ================= */
function renderTop(){
  regenHearts();
  const st=streakNow();
  $('#st-streak').className='stat s-streak'+(S.lastDay===today()?'':' off');
  $('#st-streak').innerHTML=IC.flame+st;
  $('#st-xp').innerHTML=IC.bolt+S.xp;
}

/* ================= ВКЛАДКИ ================= */
let TAB='path';
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{TAB=b.dataset.tab;render();window.scrollTo(0,0);}));
function render(){
  renderTop();
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.tab===TAB)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const v=$('#view');
  v.innerHTML=TAB==='path'?viewPath():TAB==='plan'?viewPlan():TAB==='practice'?viewPractice():viewProfile();
  bindView();
}

function ringSvg(frac,color){
  const r=26,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));
  return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="700" font-size="14" fill="var(--ink)">${Math.round(f*100)}%</text></svg>`;
}

function viewPath(){
  const cur=current();
  const tmin=S.days[today()]||0;
  let h=`<section class="today">${ringSvg(tmin/S.goal,tmin>=S.goal?'var(--good)':'var(--accent)')}<div><h2>${tmin>=S.goal?'Цель на сегодня выполнена':'Цель на сегодня: '+S.goal+' мин'}</h2><p>Сегодня: ${fmtMin(tmin)} · пройдено уроков: ${Object.keys(S.done).length} из ${totalLessons}</p></div></section>`;
  const fl=firstLocked();
  COURSE.forEach((U,u)=>{
    const open=unitOpen(u),comp=passed(u);
    h+=`<section class="unit"><div class="band ${!open?'locked':comp?'complete':''}"><div><div class="eyebrow">Раздел ${u+1}</div><h2>${esc(U.title)}</h2><p>${esc(U.desc)}</p></div><div class="acts"><button class="band-btn" data-ref="${u}">${'Справка'}</button>${(!comp&&(open&&!lessonsDone(u)||u===fl))?`<button class="band-btn" data-test="${u}">Тест досрочно</button>`:''}</div></div><div class="path">`;
    const offs=[0,-70,-100,-60,0,60];
    U.lessons.forEach((L,l)=>{
      const done=!!S.done[lk(u,l)],can=lessonOpen(u,l),isCur=cur&&cur.u===u&&cur.l===l;
      const x=offs[(l)%offs.length];
      h+=`<div class="node-wrap ${isCur?'current':''}" style="transform:translateX(${x}px)">${isCur?'<span class="start-tag">Начать</span>':''}<button class="node ${done?'done':can?'':'locked'}" data-lesson="${u}-${l}" aria-label="Урок: ${esc(L.title)}">${done?IC.check:can?IC.star:IC.lock}</button><span class="node-label">${esc(L.title)}</span></div>`;
    });
    const tCur=cur&&cur.u===u&&cur.test;const tOpen=open&&lessonsDone(u);
    h+=`<div class="node-wrap ${tCur?'current':''}" style="transform:translateX(30px)">${tCur?'<span class="start-tag">Тест</span>':''}<button class="node test ${comp?'done':tOpen?'':'locked'}" data-test="${u}" aria-label="Тест раздела">${IC.trophy}</button><span class="node-label">Тест раздела${S.tests[u]!=null?' · лучший '+S.tests[u]+'/'+TEST_N:''}</span></div>`;
    h+=`<div class="node-wrap" style="transform:translateX(-40px)"><button class="node practice ${S.practice[u]?'done':''}" data-prac="${u}" aria-label="Практика в Studio">${S.practice[u]?IC.check:IC.hammer}</button><span class="node-label">Практика в Studio · ${U.practice.min} мин</span></div>`;
    h+=`</div></section>`;
  });
  const fp=S.final>=Math.ceil(FINAL_N*PASS);
  h+=`<section class="final"><div class="kind">${IC.trophy} Итоговый экзамен</div><h2>${fp?'Экзамен сдан: '+S.final+'/'+FINAL_N:'Итоговый экзамен по Luau'}</h2><p>${FINAL_N} вопросов из всех разделов. Для зачёта нужно ${Math.ceil(FINAL_N*PASS)} правильных. Открывается после тестов всех разделов.</p><button class="btn ${allPassed()?'gold':''}" data-final ${allPassed()?'':'disabled'}>${fp?'Пересдать':'Начать экзамен'}</button></section>`;
  return h;
}

/* ===== План / расчёт времени ===== */
function remainingMinutes(){
  let m=0;
  COURSE.forEach((U,u)=>{
    U.lessons.forEach((_,l)=>{if(!S.done[lk(u,l)]&&!passed(u))m+=EST.lesson*(1+EST.review);});
    if(!passed(u))m+=EST.test*(1+EST.review);
    if(!S.practice[u])m+=U.practice.min;
  });
  if(S.final<Math.ceil(FINAL_N*PASS))m+=EST.final;
  return m;
}
function totalMinutes(){
  const lessons=totalLessons*EST.lesson*(1+EST.review), tests=COURSE.length*EST.test*(1+EST.review), prac=COURSE.reduce((a,U)=>a+U.practice.min,0);
  return {lessons,tests,prac,final:EST.final,sum:lessons+tests+prac+EST.final};
}
const daysFor=(min,perDay,dpw)=>Math.ceil(min/perDay)*7/dpw;
function fmtDays(d){d=Math.ceil(d);if(d<14)return d+' '+plural(d,'день','дня','дней');const w=Math.round(d/7*2)/2;return (Number.isInteger(w)?w:w.toFixed(1).replace('.',','))+' нед.';}
function fmtDaysLong(d){d=Math.ceil(d);if(d<60)return fmtDays(d);const mo=Math.round(d/30.4*2)/2;return (Number.isInteger(mo)?mo:mo.toFixed(1).replace('.',','))+' мес.';}
function finishDate(d){const dt=new Date();dt.setDate(dt.getDate()+Math.ceil(d));return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}

  const stages=[
    {name:"Синтаксис Luau",note:"Разделы 1–8: можешь читать и писать любые скрипты",min:COURSE.slice(0,8).reduce((a,U)=>a+U.lessons.length*EST.lesson*(1+EST.review)+EST.test*(1+EST.review)+U.practice.min,0)},
    {name:"Весь курс",note:"Разделы 1–12, практика и итоговый экзамен",min:T.sum},
    {name:"Первая своя игра",note:"Курс + ~30 ч на свой проект (обби, симулятор, тайкун)",min:T.sum+EST.project},
    {name:"Уверенный скриптер",note:"Курс + ~100 ч практики: системы, DataStore, UI",min:T.sum+EST.confident}

    <div class="st" style="color:var(--good)">${IC.check}<div><b style="color:var(--ink)">${Object.keys(S.done).length}/${totalLessons}</b><span>уроков</span></div></div>

  <section class="card"><h2>Настройки</h2>
    <div class="ctrl"><label>Звуки</label><div class="seg"><button data-sound="1" aria-pressed="${S.sound}">Включены</button><button data-sound="0" aria-pressed="${!S.sound}">Выключены</button></div></div>
    <div class="ctrl"><label>Тема</label><div class="seg">${[['','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(([k,t])=>`<button data-theme-set="${k}" aria-pressed="${(document.documentElement.dataset.theme||'')===k}">${t}</button>`).join('')}</div></div>

    <div><button class="btn ghost sm" id="reset">Сбросить прогресс</button></div>

/* ===== обработчики вида ===== */
function bindView(){
  const v=$('#view');
  v.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{const [u,l]=b.dataset.lesson.split('-').map(Number);openLessonSheet(u,l);});
  v.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>openTestSheet(+b.dataset.test));
  v.querySelectorAll('[data-prac]').forEach(b=>b.onclick=()=>openPracticeSheet(+b.dataset.prac));
  v.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>openRefSheet(+b.dataset.ref));
  const f=v.querySelector('[data-final]');if(f)f.onclick=()=>startSession('final');
  v.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>startSession(b.dataset.review==='mistakes'?'mistakes':'random'));
  const g=v.querySelector('#goal');if(g){g.oninput=()=>{S.goal=+g.value;save();const y=window.scrollY;render();window.scrollTo(0,y);const ng=$('#goal');if(ng)ng.focus();};}
  v.querySelectorAll('[data-dpw]').forEach(b=>b.onclick=()=>{S.dpw=+b.dataset.dpw;save();const y=window.scrollY;render();window.scrollTo(0,y);});
  v.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{S.sound=b.dataset.sound==='1';save();render();});
  v.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.themeSet;if(k)document.documentElement.dataset.theme=k;else delete document.documentElement.dataset.theme;try{localStorage.setItem(KEY+'-theme',k);}catch(e){}render();});
  const r=v.querySelector('#reset');if(r)r.onclick=()=>sheet(`<h2>Сбросить весь прогресс?</h2><p class="muted">Уроки, тесты, XP и серия дней будут удалены. Это нельзя отменить.</p><div class="row"><button class="btn ghost" data-close>Отмена</button><button class="btn bad" id="do-reset">Сбросить</button></div>`,el=>{el.querySelector('#do-reset').onclick=()=>{S=fresh();save();closeSheet();render();toast('Прогресс сброшен');};});
}

/* ================= ЛИСТЫ (модальные) ================= */
function sheet(html,bind){
  const root=$('#sheet-root');
  root.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc=root.querySelector('.scrim');
  sc.addEventListener('click',e=>{if(e.target===sc)closeSheet();});
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  if(bind)bind(root.querySelector('.sheet'));
  const fb=root.querySelector('.btn:not([disabled])');if(fb)fb.focus();
}
function closeSheet(){$('#sheet-root').innerHTML='';}
function openLessonSheet(u,l){
  const L=COURSE[u].lessons[l],can=lessonOpen(u,l),done=S.done[lk(u,l)];
  regenHearts();
  sheet(`<div class="kind">Раздел ${u+1} · урок ${l+1} из ${COURSE[u].lessons.length}</div><h2>${esc(L.title)}</h2>
  <p class="muted">${can?`Теория и ${L.ex.length} заданий · ~${EST.lesson} мин · +${done?5:10} XP`:'Сначала пройди предыдущий урок.'}</p>
  <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn" id="go" ${can?'':'disabled'}>${done?'Повторить':'Начать'}</button></div>`,
  el=>{const g=el.querySelector('#go');if(g)g.onclick=()=>{closeSheet();startSession('lesson',u,l);};});
}
function openTestSheet(u){
  const open=unitOpen(u)&&lessonsDone(u),early=!lessonsDone(u)&&(unitOpen(u)||u===firstLocked());
  const can=open||early||passed(u);
  sheet(`<div class="kind">${IC.trophy} Тест раздела ${u+1}</div><h2>${esc(COURSE[u].title)}</h2>
  <p class="muted">${can?`${TEST_N} вопросов из всех уроков раздела. Для зачёта нужно ${Math.ceil(TEST_N*PASS)} правильных. Сердца не тратятся.${early?' <b>Досрочно:</b> при успехе все уроки раздела засчитаются.':''}`:'Тест откроется, когда ты пройдёшь уроки этого раздела.'}</p>
  ${S.tests[u]!=null?`<p>Лучший результат: <b>${S.tests[u]}/${TEST_N}</b></p>`:''}
  <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn" id="go" ${can?'':'disabled'}>Начать тест</button></div>`,
  el=>{const g=el.querySelector('#go');if(g)g.onclick=()=>{closeSheet();startSession('test',u);};});
}
function openPracticeSheet(u){
  const P=COURSE[u].practice;
  sheet(`<div class="kind">${IC.hammer} Практика в Roblox Studio · ~${P.min} мин</div><h2>${esc(COURSE[u].title)}</h2>
  <p class="muted">Сделай это в Studio. Отметь пункты, а когда закончишь — нажми «Готово». Время зачтётся в дневную цель.</p>
  <ul class="checklist">${P.tasks.map((t,i)=>`<li><input type="checkbox" id="pt-${u}-${i}" ${S.practice[u]?'checked':''}><label for="pt-${u}-${i}">${esc(t)}</label></li>`).join('')}</ul>
  <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn good" id="go" ${S.practice[u]?'disabled':''}>${S.practice[u]?'Уже выполнено':'Готово · +'+P.min+' мин'}</button></div>`,
  el=>{const g=el.querySelector('#go');if(g&&!S.practice[u])g.onclick=()=>{S.practice[u]=true;S.xp+=15;markActivity(P.min);save();closeSheet();render();toast('Практика засчитана: +15 XP, +'+P.min+' мин');};});
}
function openRefSheet(u){
  const U=COURSE[u];
  sheet(`<div class="kind">${IC.book} Справка · раздел ${u+1}</div><h2>${esc(U.title)}</h2>${U.lessons.map(L=>`<div class="ref-unit"><h3>${esc(L.title)}</h3>${theoryHtml(L.theory)}</div>`).join('')}<button class="btn wide" data-close>Закрыть</button>`);
}
function theoryHtml(T){
  return T.map(x=>typeof x==='string'?(x.startsWith('• ')?`<ul class="tl">${x.split('\n').map(li=>`<li>${inl(li.replace(/^•\s*/,''))}</li>`).join('')}</ul>`:`<p>${inl(x)}</p>`):x.h?`<h3 class="th">${esc(x.h)}</h3>`:x.c?`<pre class="code">${hl(x.c)}</pre>`:`<div class="tip"><b>Совет</b><span>${inl(x.tip)}</span></div>`).join('');
}

/* ================= СЕССИЯ (урок/тест) ================= */
let SS=null;
function startSession(kind,u,l){
  regenHearts();
  let ids=[];
  if(kind==='lesson'){ids=COURSE[u].lessons[l].ex.map((_,i)=>u+'.'+l+'.'+i);}
  else if(kind==='test'){const all=[];COURSE[u].lessons.forEach((L,ll)=>L.ex.forEach((_,i)=>all.push(u+'.'+ll+'.'+i)));ids=shuffle(all).slice(0,TEST_N);}
  else if(kind==='final'){const all=[];COURSE.forEach((U,uu)=>U.lessons.forEach((L,ll)=>L.ex.forEach((_,i)=>all.push(uu+'.'+ll+'.'+i))));
    // равномерно по разделам
    const per=shuffle(COURSE.map((_,uu)=>shuffle(all.filter(id=>id.startsWith(uu+'.')))));ids=[];let k=0;while(ids.length<FINAL_N){const p=per[k%per.length];if(p.length)ids.push(p.pop());k++;}ids=shuffle(ids);}
  else if(kind==='mistakes'){ids=shuffle(S.mistakes).slice(0,8);}
  else if(kind==='random'){const all=[];COURSE.forEach((U,uu)=>U.lessons.forEach((L,ll)=>{if(S.done[lk(uu,ll)])L.ex.forEach((_,i)=>all.push(uu+'.'+ll+'.'+i));}));ids=shuffle(all).slice(0,8);}
  if(!ids.length)return;
  SS={kind,u,l,queue:ids.slice(),unique:ids.length,solved:0,correct:0,wrong:0,phase:kind==='lesson'?'theory':'ex',cur:null,checked:false,start:Date.now(),failed:false};
  if(SS.phase==='ex')nextEx();
  drawLayer();
}
const usesHearts=()=>false;
const requeue=()=>SS.kind==='lesson'||SS.kind==='mistakes'||SS.kind==='random';

function nextEx(){
  const id=SS.queue.shift();
  if(!id){finish();return;}
  const ex=exById(id);
  SS.cur={id,ex,order:ex.t==='c'?shuffle(ex.o.map((_,k)=>k)):null,sel:null,
    bank:ex.t==='o'?shuffle([...ex.p,...ex.x].map((t,k)=>({t,k}))):null,line:[],val:''};
  SS.checked=false;SS.lastOk=null;
}

function drawLayer(){
  const root=$('#layer-root');
  if(!SS){root.innerHTML='';document.body.style.overflow='';return;}
  document.body.style.overflow='hidden';
  const pct=SS.phase==='theory'?0:SS.phase==='done'?100:(SS.solved/SS.unique*100);
  const heartHtml=usesHearts()?`<div class="stat s-heart">${IC.heart}${S.hearts}</div>`:'';
  let body='',foot='';
  if(SS.phase==='theory'){
    const L=COURSE[SS.u].lessons[SS.l];
    body=`<div class="kind">${IC.book} Теория · раздел ${SS.u+1}</div><h2 class="q">${esc(L.title)}</h2><div class="theory">${theoryHtml(L.theory)}</div>`;
    foot=`<button class="btn wide" id="act">Перейти к заданиям</button>`;
  }else if(SS.phase==='done'){
    body=resultHtml();
    foot=`<button class="btn wide ${SS.failed?'':'good'}" id="act">Продолжить</button>`;
  }else{
    body=exHtml();
    if(!SS.checked){foot=`<button class="btn wide" id="act" ${canCheck()?'':'disabled'}>Проверить</button>`;}
    else{
      const ex=SS.cur.ex;
      foot=`<div class="fb"><h3>${SS.lastOk?IC.check.replace('<svg','<svg width="24" height="24"')+' Верно!':IC.x.replace('<svg','<svg width="24" height="24"')+' Неверно'}</h3>
      ${SS.lastOk?'':`<p>Правильный ответ: <span class="ans">${esc(answerText(ex))}</span></p>`}
      ${ex.e?`<p><b>Почему:</b> ${esc(ex.e)}</p>`:''}</div><button class="btn wide ${SS.lastOk?'good':'bad'}" id="act">Дальше</button>`;
    }
  }
  const kindName={lesson:'',test:'Тест',final:'Экзамен',mistakes:'Ошибки',random:'Повторение'}[SS.kind];
  root.innerHTML=`<div class="layer" role="dialog" aria-modal="true" aria-label="Урок">
   <div class="l-top"><div class="wrap"><button class="x" id="quit" aria-label="Выйти">${IC.x}</button><div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${kindName?`<span class="small muted" style="font-weight:700">${kindName}</span>`:''}${SS.phase==='ex'&&SS.cur?`<button class="x" id="th" aria-label="Теория" title="Посмотреть теорию">${IC.book}</button>`:''}</div></div>
   <div class="l-body"><div class="wrap">${body}</div></div>
   <div class="l-foot ${SS.checked&&SS.phase==='ex'?(SS.lastOk?'ok':'no'):''}"><div class="wrap">${foot}</div></div></div>`;
  bindLayer();
}

function exHtml(){
  const {ex}=SS.cur;
  const label={c:'Выбери ответ',i:'Впиши пропущенное',o:'Собери код'}[ex.t];
  let h=`<div class="kind">${label}</div><div class="q">${esc(ex.q)}</div>`;
  if(ex.t==='c'){
    if(ex.code)h+=`<pre class="code">${hl(ex.code)}</pre>`;
    const mono=!!ex.code||ex.o.some(o=>/[(){}=.:"`]/.test(o)&&!/[а-яё]{4,}\s[а-яё]{4,}/i.test(o));
    h+=`<div class="opts">${SS.cur.order.map((k,pos)=>{
      let cls='opt'+(mono?' mono':'');
      if(SS.checked){if(k===ex.a)cls+=' right';else if(k===SS.cur.sel)cls+=' wrong';}
      return `<button class="${cls}" data-opt="${k}" aria-pressed="${SS.cur.sel===k}" ${SS.checked?'disabled':''}><span class="num">${pos+1}</span><span class="t">${esc(ex.o[k])}</span></button>`;}).join('')}</div>`;
  }else if(ex.t==='i'){
    const parts=ex.code.split('___');
    h+=`<pre class="code">${hl(parts[0])}<input class="blank" id="blank" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Пропущенное слово" value="${esc(SS.cur.val)}" ${SS.checked?'disabled':''} style="width:${Math.max(5,SS.cur.val.length+2,ex.a[0].length+2)}ch">${hl(parts[1]||'')}</pre>`;
    h+=`<p class="small muted">Регистр букв важен: Luau различает print и Print.</p>`;
  }else{
    h+=`<div class="answer-line" id="line">${SS.cur.line.map((k,pos)=>`<button class="chip" data-line="${pos}" ${SS.checked?'disabled':''}>${esc(SS.cur.bank.find(b=>b.k===k).t)}</button>`).join('')}</div>`;
    h+=`<div class="bank">${SS.cur.bank.map(b=>`<button class="chip ${SS.cur.line.includes(b.k)?'used':''}" data-bank="${b.k}" ${SS.checked?'disabled':''}>${esc(b.t)}</button>`).join('')}</div>`;
  }
  return h;
}
function canCheck(){const c=SS.cur;if(!c)return false;const t=c.ex.t;return t==='c'?c.sel!=null:t==='i'?c.val.trim().length>0:c.line.length>0;}
const norm=s=>s.replace(/\s+/g,'');
function isRight(){
  const c=SS.cur,ex=c.ex;
  if(ex.t==='c')return c.sel===ex.a;
  if(ex.t==='i')return ex.a.some(a=>norm(a)===norm(c.val));
  const got=c.line.map(k=>c.bank.find(b=>b.k===k).t);
  return got.length===ex.p.length&&got.every((t,i)=>t===ex.p[i]);
}
function answerText(ex){
  if(ex.t==='c')return ex.o[ex.a];
  if(ex.t==='i')return ex.code.replace('___',ex.a[0]);
  return ex.p.join(' ');
}
function check(){
  if(!canCheck())return;
  const ok=isRight();SS.checked=true;SS.lastOk=ok;
  S.answered++;
  const id=SS.cur.id;
  if(ok){
    S.correct++;SS.correct++;SS.solved++;
    if(SS.kind==='mistakes'||SS.kind==='random'||SS.kind==='lesson'){const ix=S.mistakes.indexOf(id);if(ix>=0&&SS.kind!=='lesson')S.mistakes.splice(ix,1);}
  }else{
    SS.wrong++;
    if(!S.mistakes.includes(id))S.mistakes.push(id);
    if(requeue())SS.queue.push(id);else SS.solved++;
    if(usesHearts()){S.hearts=Math.max(0,S.hearts-1);if(S.hearts<MAX_HEARTS&&S.hearts===MAX_HEARTS-1)S.heartTs=Date.now();}
  }
  beep(ok);save();renderTop();drawLayer();
}
function advance(){
  if(SS.phase==='theory'){SS.phase='ex';nextEx();drawLayer();return;}
  if(SS.phase==='done'){SS=null;drawLayer();render();return;}
  if(usesHearts()&&S.hearts<=0){SS.failed=true;finish();return;}
  nextEx();if(SS.phase!=='done')drawLayer();
}
function finish(){
  const mins=Math.min((Date.now()-SS.start)/6e4,SS.unique*2.5+6);
  SS.minutes=Math.max(1,mins);SS.phase='done';SS.xp=0;
  if(!SS.failed){
    if(SS.kind==='lesson'){const key=lk(SS.u,SS.l);SS.xp=S.done[key]?5:(SS.wrong===0?15:10);S.done[key]=true;}
    else if(SS.kind==='test'){SS.score=SS.correct;const was=passed(SS.u);S.tests[SS.u]=Math.max(S.tests[SS.u]||0,SS.correct);SS.pass=SS.correct>=Math.ceil(TEST_N*PASS);
      if(SS.pass){COURSE[SS.u].lessons.forEach((_,l)=>S.done[lk(SS.u,l)]=true);SS.xp=was?5:25;}else SS.xp=3;}
    else if(SS.kind==='final'){SS.score=SS.correct;S.final=Math.max(S.final,SS.correct);SS.pass=SS.correct>=Math.ceil(FINAL_N*PASS);SS.xp=SS.pass?100:10;}
    else{SS.xp=8;}
  }
  S.xp+=SS.xp;markActivity(SS.minutes);save();renderTop();drawLayer();
}
function resultHtml(){
  const acc=SS.correct+SS.wrong?Math.round(SS.correct/(SS.correct+SS.wrong)*100):100;
  let title,sub,color='var(--gold)';
  if(SS.failed){title='Сердца закончились';sub='Не беда! Повтори ошибки в «Тренировке» — это вернёт сердце, — и попробуй снова.';color='var(--bad)';}
  else if(SS.kind==='lesson'){title=SS.wrong===0?'Идеально!':'Урок пройден!';sub=SS.wrong===0?'Ни одной ошибки — бонус +5 XP.':`Ошибок: ${SS.wrong}. Эти задания сохранены в «Тренировке» — повтори их позже.`;}
  else if(SS.kind==='test'){title=SS.pass?'Тест сдан!':'Пока не сдан';sub=SS.pass?`Раздел «${COURSE[SS.u].title}» пройден. Следующий открыт.`:`Нужно ${Math.ceil(TEST_N*PASS)} из ${TEST_N}. Загляни в справку раздела и попробуй снова.`;color=SS.pass?'var(--good)':'var(--bad)';}
  else if(SS.kind==='final'){title=SS.pass?'Экзамен сдан!':'Почти получилось';sub=SS.pass?'Ты прошёл весь курс Luau. Время делать свою игру!':`Нужно ${Math.ceil(FINAL_N*PASS)} из ${FINAL_N}. Повтори слабые разделы.`;color=SS.pass?'var(--good)':'var(--bad)';}
  else {title='Тренировка завершена';sub='Отличная работа над ошибками.';}
  const scoreTile=(SS.kind==='test'||SS.kind==='final')?`<div class="tile g"><span class="k">Результат</span><span class="v">${SS.score}/${SS.unique}</span></div>`:`<div class="tile g"><span class="k">Точность</span><span class="v">${acc}%</span></div>`;
  return `<div class="result"><svg class="medal" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="${color}"/><circle cx="60" cy="60" r="40" fill="none" stroke="var(--surface)" stroke-width="4" opacity=".55"/><path d="${SS.failed||SS.pass===false?'M44 44l32 32M76 44L44 76':'M40 62l14 14 28-30'}" fill="none" stroke="var(--surface)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h2>${title}</h2><p class="lead">${sub}</p>
  <div class="tiles"><div class="tile"><span class="k">Опыт</span><span class="v">+${SS.xp}</span></div>${scoreTile}<div class="tile b"><span class="k">Время</span><span class="v">${Math.round(SS.minutes)} мин</span></div></div></div>`;
}
function bindLayer(){
  const root=$('#layer-root');
  root.querySelector('#quit').onclick=()=>{
    if(SS.phase==='done'){advance();return;}
    sheet(`<h2>Выйти из ${SS.kind==='lesson'?'урока':'задания'}?</h2><p class="muted">Прогресс этой попытки не сохранится.</p><div class="row"><button class="btn ghost" id="q-yes">Выйти</button><button class="btn" data-close>Продолжить</button></div>`,el=>{el.querySelector('#q-yes').onclick=()=>{closeSheet();SS=null;drawLayer();render();};});
  };
  const thb=root.querySelector('#th');if(thb)thb.onclick=()=>{const [u,l]=SS.cur.id.split('.').map(Number);const L=COURSE[u].lessons[l];sheet(`<div class="kind">${IC.book} Теория · раздел ${u+1}</div><h2>${esc(L.title)}</h2><div class="ref-unit">${theoryHtml(L.theory)}</div><button class="btn wide" data-close>Вернуться к заданию</button>`);};
  const act=root.querySelector('#act');
  if(act)act.onclick=()=>{if(SS.phase==='ex'&&!SS.checked)check();else advance();};
  root.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{SS.cur.sel=+b.dataset.opt;drawLayer();});
  const bl=root.querySelector('#blank');
  if(bl){bl.oninput=()=>{SS.cur.val=bl.value;bl.style.width=Math.max(5,bl.value.length+2,SS.cur.ex.a[0].length+2)+'ch';const a=root.querySelector('#act');if(a)a.disabled=!canCheck();};if(!SS.checked)setTimeout(()=>bl.focus(),30);}
  root.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{const k=+b.dataset.bank;if(!SS.cur.line.includes(k)){SS.cur.line.push(k);drawLayer();}});
  root.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{SS.cur.line.splice(+b.dataset.line,1);drawLayer();});
  if(act&&(SS.checked||SS.phase!=='ex'))act.focus();
}
document.addEventListener('keydown',e=>{
  if(!SS||$('#sheet-root').innerHTML)return;
  if(e.key==='Enter'){const a=$('#act');if(a&&!a.disabled){e.preventDefault();a.click();}}
  else if(SS.phase==='ex'&&!SS.checked&&SS.cur&&SS.cur.ex.t==='c'&&/^[1-4]$/.test(e.key)&&document.activeElement.tagName!=='INPUT'){const k=SS.cur.order[+e.key-1];if(k!=null){SS.cur.sel=k;drawLayer();}}
  else if(e.key==='Escape'){$('#quit').click();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet-root').innerHTML){e.stopPropagation();closeSheet();}},true);

/* старт */
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
setInterval(()=>{if(!SS)renderTop();},60000);
render();
</script>
</body></html>
