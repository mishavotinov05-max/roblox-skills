<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Тропа Luau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow app column (like a phone app), sticky stat bar on top, tab bar at the bottom, lessons open as a full-screen layer. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F5F7FC; --line:#DCE2EF;
  --ink:#162033; --muted:#5B6782;
  --accent:#3454E8; --accent-deep:#2238B3; --accent-soft:#E3E9FF;
  --good:#1F9D57; --good-deep:#157541; --good-soft:#DDF5E7;
  --bad:#D93C47; --bad-deep:#A52833; --bad-soft:#FCE3E5;
  --gold:#E8A200; --gold-deep:#B27C00; --gold-soft:#FFF1CC;
  --locked:#C9D0DF; --locked-deep:#A9B2C6;
  --code-bg:#1B2236; --code-ink:#E6EAF5; --code-kw:#FF9E64; --code-str:#9ECE6A; --code-num:#E0AF68; --code-com:#7C86A6; --code-fn:#7DCFFF;
  --f-display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#171E31; --surface-2:#1D2540; --line:#2A3452;
  --ink:#E8ECF6; --muted:#98A3C0;
  --accent:#6F87FF; --accent-deep:#4258D6; --accent-soft:#232E5A;
  --good:#37C878; --good-deep:#22924F; --good-soft:#163A2A;
  --bad:#FF6B73; --bad-deep:#C2414A; --bad-soft:#41202A;
  --gold:#FFC23D; --gold-deep:#C38D10; --gold-soft:#3B3017;
  --locked:#36405E; --locked-deep:#262E47;
  --code-bg:#0A0E1A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E31; --surface-2:#1D2540; --line:#2A3452;
  --ink:#E8ECF6; --muted:#98A3C0;
  --accent:#6F87FF; --accent-deep:#4258D6; --accent-soft:#232E5A;
  --good:#37C878; --good-deep:#22924F; --good-soft:#163A2A;
  --bad:#FF6B73; --bad-deep:#C2414A; --bad-soft:#41202A;
  --gold:#FFC23D; --gold-deep:#C38D10; --gold-soft:#3B3017;
  --locked:#36405E; --locked-deep:#262E47;
  --code-bg:#0A0E1A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
code,.mono{font-family:var(--f-mono)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px;transform:rotate(-8deg)}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.stat svg{width:22px;height:22px}
.s-streak{color:var(--gold)} .s-xp{color:var(--accent)} .s-heart{color:var(--bad)}
.s-streak.off{color:var(--muted)}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{padding-block:20px;display:flex;flex-direction:column;gap:20px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}

/* chunky buttons */
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-deep);color:var(--muted);cursor:not-allowed}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep);color:#2a1d00}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:13px}

/* today card */
.today{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.today h2{font-size:16px}
.today p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* unit band */
.unit{display:flex;flex-direction:column;gap:18px}
.band{border-radius:var(--r);padding:16px 18px;color:#fff;background:var(--accent);box-shadow:0 4px 0 var(--accent-deep);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.band.locked{background:var(--locked);box-shadow:0 4px 0 var(--locked-deep);color:var(--ink)}
.band.complete{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.band .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.band h2{font-size:19px;margin-top:2px}
.band p{margin:4px 0 0;font-size:14px;opacity:.92}
.band .acts{display:flex;flex-direction:column;gap:8px;flex:none}
.band-btn{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:inherit;border-radius:12px;padding:6px 10px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.band.locked .band-btn{background:var(--surface);border-color:var(--line)}

.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:6px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node{width:72px;height:66px;border-radius:50%;border:none;display:grid;place-items:center;background:var(--accent);box-shadow:0 6px 0 var(--accent-deep);color:#fff;transition:transform .06s,box-shadow .06s}
.node svg{width:30px;height:30px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep)}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep);color:#3a2800}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--locked-deep);color:var(--muted)}
.node.test{border-radius:22px}
.node.test.done{background:var(--good);box-shadow:0 6px 0 var(--good-deep);color:#fff}
.node.practice{width:60px;height:56px;background:var(--surface);color:var(--accent);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.node.practice.done{color:var(--good);border-color:var(--good)}
.node-label{font-size:13px;font-weight:600;color:var(--muted);text-align:center;max-width:180px;line-height:1.3}
.node-wrap.current .node{animation:bob 1.6s ease-in-out infinite}
.start-tag{position:absolute;top:-34px;background:var(--surface);border:2px solid var(--line);color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:10px;white-space:nowrap}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node-wrap.current{margin-top:26px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.node-wrap.current .node{animation:none}*{transition:none!important}}

.final{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.final h2{font-size:18px}
.final p{margin:0;color:var(--muted)}

/* cards & sections */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:18px}
.card h3{font-size:15px}
.card p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.h-page{font-size:24px}
.lead{margin:0;color:var(--muted);max-width:60ch}

/* plan */
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl label{font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.ctrl output{font-family:var(--f-display);font-weight:700;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.big-est{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.est .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.est .v{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.est .d{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n{white-space:nowrap;font-weight:600}
tr.hl td{background:var(--accent-soft)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.st svg{width:28px;height:28px;flex:none}
.st b{font-family:var(--f-display);font-size:19px;display:block;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.week i{width:100%;max-width:30px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.week i.met{background:var(--good)}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet h2{font-size:20px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.checklist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.checklist input{margin-top:4px;width:18px;height:18px;accent-color:var(--good);flex:none}

/* lesson layer */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{background:none;border:none;color:var(--muted);padding:4px;display:grid;place-items:center;border-radius:8px}
.x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.l-body{flex:1;overflow-y:auto}
.l-body .wrap{padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
.kind{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.q{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3}
.l-foot{border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-foot .wrap{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.l-foot.ok{background:var(--good-soft);border-color:var(--good)}
.l-foot.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:4px}
.fb h3{font-size:18px;display:flex;align-items:center;gap:8px}
.l-foot.ok .fb h3{color:var(--good)} .l-foot.no .fb h3{color:var(--bad)}
.fb p{margin:0;font-size:15px}
.fb .ans{font-family:var(--f-mono);font-weight:600;white-space:pre-wrap;word-break:break-word}

pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--f-mono);font-size:14px;line-height:1.6;tab-size:4}
.k{color:var(--code-kw);font-weight:600} .s{color:var(--code-str)} .nm{color:var(--code-num)} .cm{color:var(--code-com);font-style:italic} .fn{color:var(--code-fn)}
pre.code input.blank{font-family:var(--f-mono);font-size:14px;background:rgba(255,255,255,.1);color:#fff;border:none;border-bottom:2px solid var(--code-fn);border-radius:4px 4px 0 0;padding:1px 6px;width:9ch;min-width:5ch}
code.in{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.9em}

.theory{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.theory p{margin:0;max-width:65ch}
.tip{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;gap:10px}
.tip b{color:var(--gold-deep)}
:root[data-theme="dark"] .tip b{color:var(--gold)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;box-shadow:0 3px 0 var(--line);display:flex;gap:12px;align-items:flex-start;font-size:16px}
.opt .num{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt .t{white-space:pre-wrap;word-break:break-word;min-width:0}
.opt.mono .t{font-family:var(--f-mono);font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt[aria-pressed="true"] .num{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}

.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.chip{font-family:var(--f-mono);font-size:15px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.chip.used{visibility:hidden}
.chip:disabled{cursor:default}

.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:24px}
.result h2{font-size:26px}
.medal{width:120px;height:120px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:14px;border:2px solid var(--gold);overflow:hidden;background:var(--surface)}
.tile .k{display:block;background:var(--gold);color:#2a1d00;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.tile .v{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;padding:10px 4px;font-variant-numeric:tabular-nums}
.tile.b{border-color:var(--accent)} .tile.b .k{background:var(--accent);color:#fff}
.tile.g{border-color:var(--good)} .tile.g .k{background:var(--good);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;font-size:14px;max-width:90vw;text-align:center}
.theory h3.th,.ref-unit h3.th{font-size:16px;margin-top:6px;color:var(--accent)}
ul.tl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.scrim{z-index:50!important}
.kind svg{width:16px;height:16px;flex:none}
pre.code,code,.mono,.chip,.opt .t,.fb .ans,input.blank{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.ref-unit{display:flex;flex-direction:column;gap:10px}
.ref-unit h3{font-size:15px;margin-top:6px}
@media (max-width:420px){.band{flex-direction:column}.band .acts{flex-direction:row}.q{font-size:18px}.stat{font-size:14px}.brand span.full{display:none}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><div class="brand-mark">lu</div><span class="full">Тропа Luau</span></div>
  <div class="stat s-streak" id="st-streak" title="Серия дней"></div>
  <div class="stat s-xp" id="st-xp" title="Опыт (XP)"></div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="nav" aria-label="Разделы"><div class="wrap">
  <button data-tab="path" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Обучение</button>
  <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>Тренировка</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>План</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>

{title:"Первые шаги",desc:"print, комментарии, переменные и типы данных",
 practice:{min:20,tasks:["Открой Roblox Studio и создай новое место из шаблона Baseplate.","В окне Explorer найди ServerScriptService, нажми на «+» рядом с ним и выбери Script.","Сотри строку print(\"Hello world!\") и напиши print с твоим именем и возрастом.","Объяви три переменные: число (например, coins = 10), строку (name = \"Миша\") и логическое значение (isVip = false).","Выведи typeof каждой переменной: print(typeof(coins)) и так далее.","Нажми Play (F5) и посмотри результат в окне Output (вкладка View → Output)."]},
 lessons:[
 {title:"print и комментарии",theory:[
  {h:"Что такое Luau"},
  "Luau — это язык программирования, на котором пишутся все скрипты в Roblox. Когда в игре открывается дверь, игроку начисляются монеты или кто-то получает урон, это работает код на Luau.",
  "Luau сделан на основе языка Lua: Roblox взял Lua, ускорил его и добавил новые возможности, например проверку типов. Поэтому уроки по Lua тоже почти всегда подходят.",
  {h:"Команда print — вывести сообщение"},
  "Самая первая команда, которую учат все программисты, — [[print]]. Она пишет текст в специальное окно Output внизу Roblox Studio. Игрок этот текст не видит: он нужен тебе, разработчику, чтобы понимать, что происходит в коде.",
  {c:'print("Привет, Roblox!")'},
  "Разберём строку по частям:",
  "• [[print]] — имя команды (правильнее говорить «функции»).\n• [[( )]] — круглые скобки: внутрь кладут то, что нужно передать функции.\n• [[\"Привет, Roblox!\"]] — текст. Текст всегда пишут в кавычках, иначе Luau подумает, что это имя переменной.",
  "Результат: в окне Output появится строчка Привет, Roblox!",
  {h:"Комментарии — заметки для себя"},
  "Комментарий — это текст в коде, который Luau полностью пропускает. В комментариях пишут пояснения: что делает код и зачем. Однострочный комментарий начинается с двух дефисов [[--]] и идёт до конца строки.",
  {c:'-- Это комментарий, он не выполняется\nprint("Работает")  -- комментарий может стоять и после кода\n\n--[[ А это многострочный\n     комментарий: всё между скобками\n     Luau пропустит ]]'},
  "Ещё один полезный приём: если поставить [[--]] перед строкой кода, она «выключится». Так удобно временно отключать код, не удаляя его.",
  {tip:"Окно Output открывается в Studio через вкладку View → Output. Держи его открытым всегда: туда же приходят сообщения об ошибках."}],
 ex:[
  C("Какая функция выводит текст в окно Output?",null,["print","echo","console.log","write"],0,"В Luau для вывода используется print(...). echo, console.log и write — это команды из других языков (PHP, JavaScript, Pascal), в Luau их нет."),
  C("С чего начинается однострочный комментарий в Luau?",null,["--","//","#","/*"],0,"В Luau комментарий начинается с двух дефисов: -- текст. Знаки // и /* используются в C, Java и JavaScript, а # — в Python. В Luau они дадут ошибку."),
  O("Собери строку, которая выведет Hello",["print","(",'"Hello"',")"],["echo","["],"Вызов функции всегда устроен одинаково: сначала имя функции (print), потом открывающая скобка, затем то, что передаём (текст \"Hello\" в кавычках), и закрывающая скобка."),
  I("Допиши, чтобы вывести текст в Output","___(\"Игра началась\")","print","Не хватает имени функции. Текст в скобках уже есть, нужно только сказать Luau, что с ним сделать — вывести через print."),
  C("Что появится в Output?",'-- print("A")\nprint("B")',["B","A\nB","A","Ничего"],0,"Первая строка начинается с --, значит это комментарий. Luau её пропускает, хоть там и написан print. Выполнится только вторая строка, и в Output появится B."),
  C("Что такое Luau?",null,["Язык скриптов Roblox на основе Lua","Язык разметки интерфейса","Библиотека JavaScript","Физический движок Roblox"],0,"Luau — язык программирования, на котором пишут все скрипты в Roblox. Он создан на основе Lua 5.1: Roblox ускорил его и добавил проверку типов.")]},
 {title:"Переменные",theory:[
  {h:"Что такое переменная"},
  "Представь коробку с наклейкой. На наклейке написано имя, например coins, а внутри лежит значение, например 10. Это и есть переменная: именованное место, где программа хранит данные.",
  "Переменные нужны, чтобы помнить информацию: сколько у игрока монет, как его зовут, жив ли он.",
  {h:"Как создать переменную"},
  {c:'local coins = 10'},
  "Разбор по словам:",
  "• [[local]] — «создаю новую переменную».\n• [[coins]] — имя переменной, его придумываешь ты.\n• [[=]] — знак присваивания: «положи в коробку».\n• [[10]] — значение, которое кладём.",
  "Знак [[=]] здесь — это не «равно» из математики. Он значит «запиши значение справа в переменную слева».",
  {h:"Как изменить переменную"},
  "Когда переменная уже создана, [[local]] второй раз писать не нужно: просто присваиваешь новое значение.",
  {c:'local coins = 10      -- создали, внутри 10\ncoins = coins + 5    -- взяли 10, прибавили 5, записали обратно\nprint(coins)         --> 15'},
  "Строку [[coins = coins + 5]] Luau читает справа налево: сначала считает [[coins + 5]] (10 + 5 = 15), потом записывает 15 в coins.",
  {h:"Правила имён"},
  "• Можно: буквы, цифры и знак подчёркивания [[_]].\n• Нельзя начинать с цифры: [[2player]] — ошибка, [[player2]] — нормально.\n• Регистр важен: [[Score]] и [[score]] — две разные переменные.\n• Пробелов быть не может. Вместо них пишут [[maxHealth]] или [[max_health]].",
  {tip:"Если переменную ни разу не объявляли, её значение — nil («ничего»). Ошибки при этом не будет, поэтому опечатку в имени легко не заметить."}],
 ex:[
  C("Какое ключевое слово объявляет локальную переменную?",null,["local","var","let","dim"],0,"В Luau новую переменную создают словом local. var и let — из JavaScript, dim — из Visual Basic."),
  I("Объяви переменную speed","___ speed = 16","local","Чтобы создать новую переменную, перед её именем пишут local. Полная строка: local speed = 16."),
  C("Какое имя переменной недопустимо?",null,["2player","player2","_hp","maxHealth"],0,"Имя переменной не может начинаться с цифры. player2 — нормально (цифра в конце), _hp — нормально (подчёркивание разрешено), maxHealth — нормально."),
  C("Что выведет код?","local a = 5\na = a * 2\nprint(a)",["10","5","25","a"],0,"Пошагово: в a кладём 5. Затем считаем a * 2 = 5 * 2 = 10 и записываем 10 обратно в a. print(a) выводит 10. Звёздочка * — это умножение."),
  O("Объяви переменную health со значением 100",["local","health","=","100"],["var",":="],"Шаблон всегда один: local, имя, знак =, значение. var — не из Luau, а := в Luau не существует."),
  C("Что выведет код?","local Score = 1\nprint(score)",["nil","1","Ошибку","Score"],0,"Ловушка с регистром! Объявлена Score с большой буквы, а выводим score с маленькой. Для Luau это разные переменные. score никто не создавал, поэтому её значение nil.")]},
 {title:"Типы данных",theory:[
  {h:"Зачем нужны типы"},
  "У каждого значения есть тип — то, чем это значение является. Число можно умножить, а текст нельзя. Чтобы понимать, что можно делать со значением, важно знать его тип.",
  {h:"Главные типы Luau"},
  "• [[number]] — число: [[10]], [[-3]], [[3.14]]. В Luau нет отдельных «целых» и «дробных», всё это number.\n• [[string]] — строка, то есть текст: [[\"Привет\"]]. Всегда в кавычках.\n• [[boolean]] — логическое значение: только [[true]] (истина, да) или [[false]] (ложь, нет).\n• [[nil]] — «ничего», пустота. Так выглядит переменная, в которую ничего не положили.\n• [[table]] и [[function]] — таблицы и функции, их разберём позже.",
  {c:'local coins = 50          -- number\nlocal name = "Миша"       -- string\nlocal isAlive = true      -- boolean\nlocal weapon = nil        -- nil: оружия пока нет'},
  {h:"Как узнать тип: typeof"},
  "Функция [[typeof]] возвращает название типа в виде текста.",
  {c:'print(typeof(42))     --> number\nprint(typeof(3.5))    --> number\nprint(typeof("hi"))   --> string\nprint(typeof("42"))   --> string (в кавычках — это текст!)\nprint(typeof(true))   --> boolean\nprint(typeof(nil))    --> nil'},
  {h:"Превращение типов"},
  "Иногда число приходит в виде текста, например из поля ввода. Перевести текст в число можно через [[tonumber]], а число в текст — через [[tostring]].",
  {c:'local text = "42"\nlocal n = tonumber(text)   -- теперь это число 42\nprint(n + 1)               --> 43\nprint(tostring(7))         --> "7" (уже текст)'},
  {tip:"\"10\" и 10 — разные вещи: первое — текст из символов 1 и 0, второе — число."}],
 ex:[
  C("Что вернёт typeof(3.14)?",null,["number","float","double","decimal"],0,"В Luau все числа, и целые, и дробные, имеют один тип — number. float, double и decimal — названия типов из других языков."),
  C("Какое значение означает «ничего»?",null,["nil","null","undefined","None"],0,"В Luau пустота называется nil. null — это из Java и C#, undefined — из JavaScript, None — из Python."),
  C("Что вернёт typeof(\"10\")?",null,["string","number","text","nil"],0,"Решают кавычки: всё, что в кавычках, — это текст (string), даже если внутри одни цифры. Без кавычек 10 было бы number."),
  I("Присвой логическое значение «истина»","local isAlive = ___","true","У boolean всего два значения: true (истина, да) и false (ложь, нет). Здесь нужна истина — true, без кавычек."),
  C("Что выведет код?",'print(tonumber("42") + 1)',["43","421","Ошибку","nil"],0,"tonumber(\"42\") превращает текст \"42\" в число 42. Потом 42 + 1 = 43. Знак + в Luau всегда складывает числа, он не склеивает текст."),
  C("Какие значения бывают у типа boolean?",null,["true и false","yes и no","1 и 0","on и off"],0,"У boolean ровно два значения: true и false. Их пишут маленькими буквами и без кавычек.")]}
 ]},
{title:"Операторы",desc:"Арифметика, строки, сравнение и логика",
 practice:{min:20,tasks:["Создай переменную coins = 100.","Сделай три «покупки» по 15, 30 и 25 монет через -= (например, coins -= 15).","Выведи остаток через интерполяцию: print(`Осталось: {coins}`) — кавычки обратные, клавиша Ё.","Посчитай, сколько полных пакетов по 12 монет можно купить: coins // 12. Сколько монет останется: coins % 12.","Выведи результат 2 ^ 10 и проверь, что получилось 1024."]},
 lessons:[
 {title:"Арифметика",theory:[
  {h:"Математика в коде"},
  "Luau умеет считать как калькулятор. Это нужно постоянно: прибавить монеты, отнять здоровье, посчитать урон.",
  "• [[+]] сложение, [[-]] вычитание\n• [[*]] умножение (звёздочка)\n• [[/]] деление\n• [[^]] степень: [[2 ^ 3]] = 2 × 2 × 2 = 8",
  {c:'print(5 + 3)    --> 8\nprint(10 - 4)   --> 6\nprint(6 * 7)    --> 42\nprint(10 / 4)   --> 2.5'},
  {h:"Два особых оператора: // и %"},
  "Они связаны с делением с остатком, как в начальной школе: «7 разделить на 2 — будет 3 и 1 в остатке».",
  "• [[//]] — целая часть от деления: [[7 // 2]] = 3.\n• [[%]] — остаток от деления: [[7 % 2]] = 1.",
  {c:'-- 17 монет, пакет стоит 5. Сколько пакетов купим и сколько останется?\nprint(17 // 5)  --> 3 (три пакета)\nprint(17 % 5)   --> 2 (две монеты останутся)'},
  "Где пригодится [[%]]: проверка на чётность. Если [[n % 2 == 0]], то число чётное.",
  {h:"Короткая запись: += -= *= /="},
  "Очень часто нужно изменить переменную на какое-то число. Для этого есть короткая запись:",
  {c:'local coins = 50\ncoins += 10   -- то же самое, что coins = coins + 10 → 60\ncoins -= 5    -- coins = coins - 5 → 55\ncoins *= 2    -- coins = coins * 2 → 110'},
  {h:"Порядок действий"},
  "Как в математике: сначала [[^]], потом [[*]] [[/]] [[//]] [[%]], и только потом [[+]] [[-]]. Если нужен другой порядок, используй скобки: [[(2 + 3) * 4]] = 20."],
 ex:[
  C("Что выведет код?","print(7 % 3)",["1","2","2.33","0"],0,"% — остаток от деления. 7 разделить на 3: тройка помещается 2 раза (это 6), остаётся 7 − 6 = 1."),
  C("Что выведет код?","print(2 ^ 3)",["8","6","5","23"],0,"^ — возведение в степень: 2 ^ 3 = 2 × 2 × 2 = 8. Ответ 6 был бы, если бы ^ было умножением, но это не так."),
  C("Что выведет код?","print(7 // 2)",["3","3.5","4","1"],0,"// — деление с отбрасыванием дробной части. 7 / 2 = 3.5, дробная часть отбрасывается, остаётся 3. Округления до 4 нет: всегда вниз."),
  C("Что выведет код?","print(10 / 4)",["2.5","2","3","2.4"],0,"Одинарная косая черта / — обычное деление с дробной частью: 10 / 4 = 2.5."),
  I("Увеличь coins на 10 короткой записью","coins ___ 10","+=","Короткая запись += значит «прибавь к тому, что уже есть». coins += 10 — то же, что coins = coins + 10."),
  C("Что выведет код?","print(2 + 3 * 4)",["14","20","24","9"],0,"Умножение выполняется раньше сложения, как в математике. Сначала 3 * 4 = 12, потом 2 + 12 = 14. Чтобы получилось 20, нужны скобки: (2 + 3) * 4.")]},
 {title:"Работа со строками",theory:[
  {h:"Склеивание текста: .."},
  "Чтобы соединить два куска текста, между ними ставят две точки [[..]]. Это называется конкатенация.",
  {c:'local name = "Миша"\nprint("Привет, " .. name)   --> Привет, Миша\nprint("Ro" .. "blox")       --> Roblox'},
  "Пробелы сами не добавляются. Если нужен пробел, поставь его внутри кавычек: [[\"Привет, \"]] — после запятой есть пробел.",
  "Числа тоже можно приклеивать, Luau сам превратит их в текст:",
  {c:'local score = 120\nprint("Очки: " .. score)    --> Очки: 120'},
  {tip:"Не путай: + складывает числа, а .. склеивает текст. \"Ro\" + \"blox\" вызовет ошибку."},
  {h:"Длина текста: #"},
  "Знак [[#]] перед строкой даёт её длину, то есть количество символов.",
  {c:'print(#"Luau")     --> 4\nprint(#"")         --> 0 (пустая строка)'},
  {h:"Интерполяция: самый удобный способ"},
  "Когда кусков много, склеивать через [[..]] неудобно. В Luau можно написать текст в обратных кавычках (клавиша Ё на английской раскладке) и вставлять переменные прямо в фигурных скобках [[{ }]].",
  {c:'local name = "Аня"\nlocal hp = 75\n\n-- через .. (громоздко):\nprint("Игрок " .. name .. ", здоровье: " .. hp)\n\n-- через интерполяцию (удобно):\nprint(`Игрок {name}, здоровье: {hp}`)\n-- оба выведут: Игрок Аня, здоровье: 75'},
  "Внутри [[{ }]] можно даже считать: [[`Через год: {age + 1}`]]."],
 ex:[
  C("Что выведет код?",'print("Ro" .. "blox")',["Roblox","Ro blox","Ro..blox","Ошибку"],0,".. склеивает две строки в одну. Пробел сам не появляется: \"Ro\" и \"blox\" просто ставятся рядом и получается Roblox."),
  C("Какой оператор склеивает строки?",null,["..","+","&",","],0,"В Luau текст склеивают двумя точками. + работает только с числами, & здесь не существует, а запятая разделяет аргументы функции."),
  C("Что выведет код?",'print(#"Luau")',["4","3","5","Luau"],0,"# перед строкой даёт количество символов. В слове Luau четыре буквы: L, u, a, u."),
  I("Склей текст и число",'print("Очки: " ___ score)',"..","Чтобы приклеить к тексту значение переменной, ставим ... Число score Luau сам превратит в текст."),
  C("Что выведет код?","local n = 3\nprint(`Жизни: {n}`)",["Жизни: 3","Жизни: {n}","Жизни: n","Ошибку"],0,"Текст в обратных кавычках, поэтому {n} заменяется значением переменной n, то есть 3."),
  C("Какие кавычки нужны для интерполяции {…}?",null,["Обратные `…`","Двойные \"…\"","Одинарные '…'","Любые"],0,"Интерполяция работает только в обратных кавычках ` (клавиша Ё). В обычных кавычках \"Жизни: {n}\" выведется буквально, вместе со скобками.")]},
 {title:"Сравнение и логика",theory:[
  {h:"Сравнение: ответ «да» или «нет»"},
  "Операторы сравнения проверяют что-то и возвращают [[true]] или [[false]].",
  "• [[==]] равно (два знака!)\n• [[~=]] не равно (тильда и равно)\n• [[<]] меньше, [[>]] больше\n• [[<=]] меньше или равно, [[>=]] больше или равно",
  {c:'print(5 == 5)     --> true\nprint(5 ~= 3)     --> true  (5 не равно 3 — правда)\nprint(10 < 3)     --> false\nprint(5 == "5")   --> false (число и текст никогда не равны)'},
  {tip:"Одиночный = записывает значение в переменную, двойной == сравнивает. Их часто путают."},
  {h:"Логика: and, or, not"},
  "• [[and]] («и») — true, только если обе части true.\n• [[or]] («или») — true, если хотя бы одна часть true.\n• [[not]] («не») — переворачивает: [[not true]] = false.",
  {c:'local level = 12\nlocal banned = false\nprint(level >= 10 and not banned)   --> true\n-- уровень 10+ (да) И не забанен (да) → true'},
  {h:"Важное правило: что считается ложью"},
  "В Luau ложными считаются только два значения: [[false]] и [[nil]]. Всё остальное — истина, в том числе число [[0]] и пустой текст [[\"\"]].",
  {h:"Трюк со значением по умолчанию"},
  "[[or]] возвращает первое истинное значение. Поэтому [[a or b]] значит: «возьми a, а если там пусто — возьми b».",
  {c:'local name = nil\nprint(name or "Гость")   --> Гость (name пустое, берём запасное)\n\nlocal nick = "Rex"\nprint(nick or "Гость")   --> Rex'}],
 ex:[
  C("Как в Luau записать «не равно»?",null,["~=","!=","<>","=/="],0,"В Luau «не равно» пишется как ~= (тильда и равно). != есть во многих других языках, но в Luau это ошибка."),
  C("Что выведет код?",'print(5 == "5")',["false","true","Ошибку","nil"],0,"Слева число 5, справа текст \"5\". Это разные типы, а значения разных типов никогда не равны. Ошибки не будет, просто false."),
  C("Что выведет код?","print(not nil)",["true","false","nil","Ошибку"],0,"nil считается ложью. not переворачивает ложь в истину, поэтому not nil = true."),
  C("Что выведет код?",'print(nil or "по умолчанию")',["по умолчанию","nil","true","false"],0,"or берёт первое истинное значение. nil — ложь, поэтому or переходит ко второму значению и возвращает \"по умолчанию\"."),
  C("Что выведет код?",'print(0 and "да" or "нет")',["да","нет","0","false"],0,"Ловушка! В Luau 0 — это истина (ложь — только false и nil). 0 and \"да\" даёт \"да\", а \"да\" or \"нет\" — тоже \"да\"."),
  O("Собери условие: уровень не меньше 10 и игрок не забанен",["level",">=","10","and","not","banned"],["&&","!"],"«Не меньше 10» — это >= 10. «И» — это and. «Не забанен» — not banned. В Luau логические операторы пишут словами, && и ! здесь не работают.")]}
 ]},
{title:"Условия",desc:"if, elseif, else и правда о «правде»",
 practice:{min:20,tasks:["Создай переменную level с любым числом.","Напиши if/elseif/else: level >= 10 → «Ветеран», level >= 5 → «Опытный», иначе «Новичок».","Поменяй значение level на 3, 7 и 15 и каждый раз запускай игру. Проверь, что ответ меняется.","Перепиши ту же логику через if-выражение: local rank = if level >= 10 then \"Ветеран\" elseif level >= 5 then \"Опытный\" else \"Новичок\".","Проверь, что if 0 then и if \"\" then срабатывают (в Luau это истина)."]},
 lessons:[
 {title:"if … then … end",theory:[
  {h:"Код, который выполняется не всегда"},
  "До сих пор код выполнялся строчка за строчкой целиком. Но в игре нужно принимать решения: если здоровье кончилось — игрок погиб, если хватает монет — покупка проходит. Для этого есть [[if]] («если»).",
  {c:'local hp = 0\n\nif hp <= 0 then\n    print("Игрок погиб")\nend'},
  "Как это читать: «Если hp меньше или равно 0, то вывести „Игрок погиб“. Конец».",
  "Разбор:",
  "• [[if]] — «если».\n• [[hp <= 0]] — условие, проверка с ответом true или false.\n• [[then]] — «то»: дальше идёт код, который выполнится, если условие истинно.\n• [[end]] — конец блока. Без него будет ошибка.",
  "Если условие ложно, код между [[then]] и [[end]] просто пропускается, и программа идёт дальше.",
  {c:'local coins = 30\nif coins >= 50 then\n    print("Куплено!")     -- не выполнится: 30 меньше 50\nend\nprint("Готово")           -- выполнится всегда'},
  {h:"Отступы"},
  "Код внутри [[if]] принято сдвигать вправо клавишей Tab. Luau это не требует, но так видно, какой код относится к условию.",
  {tip:"Частая ошибка: if x = 5 then. Одиночный = — это запись значения, а для сравнения нужен двойной: if x == 5 then."}],
 ex:[
  C("Какое слово ставится после условия в if?",null,["then","do",":","{"],0,"Шаблон: if условие then … end. Слово do используется в циклах, двоеточие — в Python, фигурные скобки — в JavaScript."),
  C("Чем заканчивается блок if?",null,["end","fi","}","endif"],0,"В Luau каждый блок (if, цикл, функция) закрывается словом end."),
  I("Допиши условие","if score > 100 ___\n    print(\"Рекорд!\")\nend","then","После условия score > 100 должно стоять then: «если счёт больше 100, то…»."),
  C("Что выведет код?",'local x = 5\nif x > 3 then\n    print("big")\nend',["big","Ничего","5","Ошибку"],0,"Проверяем: 5 > 3? Да, это true. Значит код внутри if выполняется, и выводится big."),
  O("Собери начало проверки: если монет хотя бы 50",["if","coins",">=","50","then"],["do","=="],"«Хотя бы 50» значит «50 или больше», то есть >= 50. Порядок: if, условие, then."),
  C("Что не так в строке if x = 5 then?",null,["Нужно == вместо =","Нужно do вместо then","Нужны скобки","Всё правильно"],0,"Одиночный = записывает значение, а не сравнивает. Для проверки на равенство нужен ==: if x == 5 then.")]},
 {title:"elseif и else",theory:[
  {h:"Что делать, если условие не выполнилось"},
  "[[else]] («иначе») — код, который выполнится, когда условие ложно. Получается развилка: одна из двух дорог.",
  {c:'local coins = 30\nif coins >= 50 then\n    print("Куплено!")\nelse\n    print("Не хватает монет")   -- выполнится это\nend'},
  {h:"Несколько вариантов: elseif"},
  "[[elseif]] («иначе если») добавляет ещё одну проверку. Пишется одним словом, без пробела.",
  {c:'local score = 75\n\nif score >= 90 then\n    print("Отлично")\nelseif score >= 70 then\n    print("Хорошо")       -- выполнится это\nelseif score >= 50 then\n    print("Нормально")\nelse\n    print("Попробуй ещё")\nend'},
  "Как Luau это выполняет: проверяет условия сверху вниз и выполняет только первую подходящую ветку. 75 >= 90? Нет. 75 >= 70? Да — выводим «Хорошо», а остальные ветки даже не проверяем.",
  "Вся цепочка закрывается одним [[end]] в самом конце.",
  {h:"Короткая запись: if-выражение"},
  "Если нужно просто выбрать одно из двух значений, можно уложиться в одну строку:",
  {c:'local hp = 30\nlocal status = if hp > 50 then "Здоров" else "Ранен"\nprint(status)   --> Ранен'},
  "Читается так: «status равен „Здоров“, если hp больше 50, иначе „Ранен“»."],
 ex:[
  C("Как в Luau пишется ветка «иначе если» одним словом?",null,["elseif","elif","elsif","otherwise"],0,"В Luau это elseif, одним словом. elif — из Python, elsif — из Ruby."),
  C("Что выведет код?",'local s = 75\nif s >= 90 then print("A")\nelseif s >= 70 then print("B")\nelse print("C") end',["B","A","C","B и C"],0,"Проверяем сверху вниз. 75 >= 90? Нет. 75 >= 70? Да — выводим B и выходим. До else дело не доходит, поэтому C не выводится."),
  C("Что выведет код?",'local t = -5\nif t > 0 then print("тепло")\nelseif t == 0 then print("ноль")\nelse print("холодно") end',["холодно","тепло","ноль","Ничего"],0,"-5 > 0? Нет. -5 == 0? Нет. Ни одно условие не подошло, поэтому срабатывает else и выводится «холодно»."),
  I("Допиши ветку «во всех остальных случаях»",'if ready then\n    start()\n___\n    wait()\nend',"else","«Во всех остальных случаях» — это else. Он срабатывает, если условие ready оказалось ложным."),
  C("Сколько end нужно для цепочки if / elseif / elseif / else?",null,["1","2","3","4"],0,"if, elseif и else — части одного блока, поэтому end нужен один, в самом конце."),
  C("Чему равно label?",'local hp = 30\nlocal label = if hp > 50 then "ok" else "low"',["low","ok","nil","Ошибка"],0,"Это if-выражение. Проверяем: 30 > 50? Нет. Значит берётся значение после else — \"low\".")]},
 {title:"Истинность значений",theory:[
  {h:"Что может стоять в условии"},
  "В условии [[if]] не обязательно сравнение. Туда можно поставить любое значение, и Luau решит, «правда» это или «ложь».",
  {h:"Главное правило Luau"},
  "Ложь — это только [[false]] и [[nil]]. Всё остальное — правда.",
  "Значит, правдой будут: любое число (даже [[0]] и [[-1]]), любой текст (даже пустой [[\"\"]]), любая таблица и любой объект.",
  {c:'if 0 then print("0 — это правда") end        -- выведется\nif "" then print("пустой текст — правда") end -- выведется\nif nil then print("сюда не попадём") end    -- не выведется'},
  {h:"Зачем это нужно в Roblox"},
  "Очень частая проверка — «существует ли объект». Если объекта нет, вместо него будет [[nil]], то есть ложь.",
  {c:'local tool = nil   -- у игрока нет оружия\n\nif tool then\n    print("Атакуем!")\nelse\n    print("Нет оружия")   -- выполнится это\nend\n\n-- то же самое через not:\nif not tool then\n    print("Нет оружия")\nend'},
  {tip:"Если раньше учил Python или JavaScript, будь внимателен: там 0 и \"\" считаются ложью, а в Luau — правдой."}],
 ex:[
  C("Какие значения в Luau считаются ложными?",null,["Только false и nil","false, nil, 0 и \"\"","Только false","false и 0"],0,"Запомни: ложь — только false и nil. 0 и пустая строка \"\" в Luau — это правда."),
  C("Что выведет код?",'if 0 then print("да") else print("нет") end',["да","нет","0","Ошибку"],0,"0 — не false и не nil, значит для Luau это правда. Условие выполняется, выводится «да»."),
  C("Что выведет код?",'if "" then print("да") else print("нет") end',["да","нет","Ничего","Ошибку"],0,"Пустая строка — это тоже не false и не nil. Значит правда, выводится «да»."),
  C("Что выведет код?",'local tool = nil\nif not tool then print("нет предмета") end',["нет предмета","Ничего","nil","Ошибку"],0,"tool равен nil (ложь). not переворачивает ложь в правду, условие выполняется."),
  I("Задай имя «Гость», если input пустой (nil)",'local name = input ___ "Гость"',"or","a or b вернёт a, если там что-то есть, или b, если a равно nil или false. Так задают значение по умолчанию."),
  C("Что выведет код?","local a = false\nlocal b = a == false\nprint(b)",["true","false","nil","Ошибку"],0,"Разберём вторую строку: сначала вычисляется a == false (false равно false? да → true), потом это true записывается в b.")]}
 ]},
{title:"Циклы",desc:"for, while, repeat, break и continue",
 practice:{min:25,tasks:["Выведи таблицу умножения на 7: for i = 1, 10 do print(`7 × {i} = {7 * i}`) end.","Сделай обратный отсчёт от 10 до 1 с паузой: for i = 10, 1, -1 do print(i) task.wait(1) end. В конце выведи «Старт!».","С помощью while найди первую степень двойки больше 1000 (начни с n = 1 и умножай на 2).","Выведи только нечётные числа от 1 до 20 через continue."]},
 lessons:[
 {title:"Числовой for",theory:[
  {h:"Зачем нужны циклы"},
  "Представь, что нужно вывести числа от 1 до 100. Писать 100 раз print неудобно. Цикл повторяет один и тот же код много раз.",
  {h:"Цикл for"},
  {c:'for i = 1, 5 do\n    print(i)\nend\n-- выведет: 1, 2, 3, 4, 5 (каждое на новой строке)'},
  "Разбор:",
  "• [[for]] — «для».\n• [[i]] — переменная-счётчик. Её создаёт сам цикл, [[local]] писать не нужно.\n• [[= 1, 5]] — счётчик начинается с 1 и заканчивается на 5 (включительно!).\n• [[do … end]] — код, который повторяется.",
  "Что происходит: i = 1 → выполнить код → i = 2 → выполнить код → … → i = 5 → выполнить код → цикл закончен.",
  {h:"Шаг"},
  "Третье число задаёт шаг: насколько меняется i за раз. По умолчанию шаг 1.",
  {c:'for i = 0, 10, 2 do print(i) end    --> 0, 2, 4, 6, 8, 10\nfor i = 5, 1, -1 do print(i) end    --> 5, 4, 3, 2, 1 (обратный отсчёт)'},
  {h:"Пример: сумма"},
  {c:'local sum = 0\nfor i = 1, 4 do\n    sum += i\nend\nprint(sum)   --> 10\n-- шаги: 0+1=1, 1+2=3, 3+3=6, 6+4=10'}],
 ex:[
  C("Что выведет код?","for i = 1, 3 do\n    print(i)\nend",["1\n2\n3","0\n1\n2","1\n2","1 2 3 4"],0,"Счётчик начинается с 1 и доходит до 3 включительно. Каждый print выводит на новой строке: 1, 2, 3."),
  C("Сколько раз выполнится тело цикла for i = 1, 10, 2?",null,["5","10","4","6"],0,"Шаг 2: i = 1, 3, 5, 7, 9. Следующее было бы 11, но это больше 10, поэтому цикл остановится. Всего 5 раз."),
  C("Что выведет код?","for i = 3, 1, -1 do\n    print(i)\nend",["3\n2\n1","1\n2\n3","Ничего","3"],0,"Шаг -1 значит «уменьшать на 1». Начинаем с 3: 3, 2, 1."),
  I("Допиши заголовок цикла","for i = 1, 5 ___\n    print(i)\nend","do","В for после чисел ставится do («делай»), а не then. then — только для if."),
  O("Собери цикл от 1 до 10",["for","i","=","1",",","10","do"],["then","in"],"Шаблон: for счётчик = начало, конец do. Между началом и концом стоит запятая."),
  C("Что выведет код?","local sum = 0\nfor i = 1, 4 do\n    sum += i\nend\nprint(sum)",["10","4","15","6"],0,"Цикл по очереди прибавляет к sum числа 1, 2, 3, 4. 0 + 1 + 2 + 3 + 4 = 10.")]},
 {title:"while и repeat",theory:[
  {h:"Когда неизвестно, сколько повторов"},
  "[[for]] хорош, когда количество повторов известно заранее. А если нужно «повторять, пока не случится что-то»? Для этого есть [[while]] («пока»).",
  {c:'local n = 1\nwhile n < 100 do\n    n *= 2\nend\nprint(n)   --> 128'},
  "Как это работает: Luau проверяет условие [[n < 100]]. Если правда — выполняет код внутри и снова проверяет. Когда условие станет ложным, цикл остановится.",
  "n меняется так: 1 → 2 → 4 → 8 → 16 → 32 → 64 → 128. На 128 условие 128 < 100 ложно, и цикл заканчивается.",
  {h:"repeat … until"},
  "[[repeat]] («повторяй») похож на while, но проверяет условие после выполнения кода. Поэтому тело выполнится хотя бы один раз. И он работает «пока НЕ»: останавливается, когда условие станет истинным.",
  {c:'local tries = 0\nrepeat\n    tries += 1\n    print("Попытка " .. tries)\nuntil tries >= 3\n-- Попытка 1, Попытка 2, Попытка 3'},
  {h:"Бесконечный цикл в Roblox"},
  "В играх часто нужен цикл, который работает всё время, например спавн монет каждые 5 секунд. Пишут [[while true do]], но внутри обязательно должна быть пауза [[task.wait()]].",
  {c:'while true do\n    print("Новая монета!")\n    task.wait(5)   -- пауза 5 секунд\nend'},
  {tip:"Без task.wait бесконечный цикл займёт весь процессор, игра зависнет, а Roblox прервёт скрипт с ошибкой."}],
 ex:[
  C("Что выведет код?","local n = 1\nwhile n < 5 do\n    n *= 2\nend\nprint(n)",["8","4","5","16"],0,"Пошагово: n = 1 (1 < 5, удваиваем) → 2 (2 < 5, удваиваем) → 4 (4 < 5, удваиваем) → 8 (8 < 5? нет, стоп). Выводится 8."),
  C("Сколько раз минимум выполнится тело repeat … until?",null,["1","0","2","Зависит от условия"],0,"repeat сначала выполняет код и только потом проверяет условие until. Поэтому один раз код выполнится всегда."),
  I("Допиши конец цикла repeat","repeat\n    count += 1\n___ count >= 3","until","Цикл repeat закрывается словом until («до тех пор, пока») и условием остановки."),
  C("Что случится с while true do end без паузы в Roblox?",null,["Скрипт зависнет и будет прерван","Цикл выполнится один раз","Ничего","Roblox сам добавит паузу"],0,"true всегда истинно, поэтому цикл бесконечный. Без паузы он не даёт игре ничего делать, и Roblox прерывает скрипт с ошибкой «Script timeout»."),
  C("Что выведет код?","local i = 0\nrepeat\n    i += 1\nuntil i == 3\nprint(i)",["3","2","4","0"],0,"i становится 1 (не 3, повтор), 2 (не 3, повтор), 3 (да, стоп). После цикла выводится 3."),
  C("Что ставить внутрь бесконечного цикла в Roblox?",null,["task.wait()","sleep()","pause()","delay"],0,"task.wait() приостанавливает скрипт и даёт игре поработать. sleep и pause в Roblox не существуют.")]},
 {title:"break и continue",theory:[
  {h:"break — выйти из цикла досрочно"},
  "Иногда цикл нужно остановить раньше, например когда нужная вещь уже найдена. [[break]] («прервать») сразу завершает цикл.",
  {c:'for i = 1, 10 do\n    if i == 4 then\n        break       -- на i = 4 выходим\n    end\n    print(i)\nend\n-- выведет: 1, 2, 3'},
  "Когда i стало 4, сработал [[break]], и цикл закончился. До [[print(4)]] дело не дошло.",
  {h:"continue — пропустить один шаг"},
  "[[continue]] («продолжить») пропускает остаток кода в текущем шаге и сразу переходит к следующему. Цикл при этом продолжается.",
  {c:'for i = 1, 6 do\n    if i % 2 == 0 then\n        continue    -- чётное? пропускаем\n    end\n    print(i)\nend\n-- выведет: 1, 3, 5'},
  "Разница: [[break]] — «всё, выходим совсем», [[continue]] — «этот шаг пропускаем, идём к следующему».",
  {h:"Пример из игры"},
  {c:'-- лечим всех игроков, кроме мёртвых\nfor _, player in players do\n    if player.dead then\n        continue    -- мёртвого пропускаем\n    end\n    heal(player)\nend'},
  {tip:"continue есть в Luau, но его нет в обычном Lua. В старых уроках по Lua его не встретишь."}],
 ex:[
  C("Что выведет код?","for i = 1, 10 do\n    if i == 4 then break end\n    print(i)\nend",["1\n2\n3","1\n2\n3\n4","4","1…10"],0,"Для i = 1, 2, 3 условие ложно, выводим число. На i = 4 срабатывает break, и цикл заканчивается раньше, чем выполнится print. Поэтому 4 не выводится."),
  C("Что выведет код?","for i = 1, 5 do\n    if i % 2 == 0 then continue end\n    print(i)\nend",["1\n3\n5","2\n4","1\n2\n3\n4\n5","1"],0,"i % 2 == 0 — проверка на чётность. Для 2 и 4 срабатывает continue, и print пропускается. Выводятся только нечётные: 1, 3, 5."),
  C("Что делает break?",null,["Выходит из цикла","Пропускает итерацию","Останавливает скрипт","Ставит паузу"],0,"break полностью завершает цикл, и программа идёт дальше, к коду после end. Пропуск одного шага — это continue."),
  I("Пропусти итерацию, если игрок мёртв","for _, p in players do\n    if p.dead then ___ end\n    heal(p)\nend","continue","Нужно не выйти из цикла, а только пропустить этого игрока и перейти к следующему. Это continue."),
  C("break внутри вложенного цикла выходит из…",null,["Только внутреннего цикла","Обоих циклов","Функции","Скрипта"],0,"break выходит только из того цикла, в котором написан, то есть из ближайшего. Внешний цикл продолжит работу."),
  C("Что выведет код?","local found\nfor i = 1, 100 do\n    if i * i > 50 then\n        found = i\n        break\n    end\nend\nprint(found)",["8","7","50","100"],0,"Ищем первое число, квадрат которого больше 50. 7 × 7 = 49 — мало. 8 × 8 = 64 > 50 — нашли: found = 8, break.")]}
 ]},
{title:"Функции",desc:"Параметры, return, анонимные функции и замыкания",
 practice:{min:25,tasks:["Напиши функцию calculateDamage(base, multiplier). Если multiplier не передали, пусть он будет 1 (используй or). Верни base * multiplier.","Вызови её дважды: calculateDamage(10, 2) и calculateDamage(10). Выведи результаты.","Напиши getMinMax(a, b, c), которая возвращает два значения: math.min и math.max трёх чисел.","Сделай makeCounter() — функцию, которая возвращает функцию-счётчик (как в уроке).","Напиши функцию repeatTimes(n, f), которая вызывает функцию f n раз."]},
 lessons:[
 {title:"Объявление и вызов",theory:[
  {h:"Что такое функция"},
  "Функция — это кусок кода с именем, который можно вызывать сколько угодно раз. Как рецепт: написал один раз, готовишь по нему когда нужно.",
  "Ты уже пользовался готовыми функциями: [[print]], [[typeof]], [[tonumber]]. Теперь научимся делать свои.",
  {h:"Как создать функцию"},
  {c:'local function greet()\n    print("Привет!")\nend'},
  "• [[local function]] — «создаю функцию».\n• [[greet]] — её имя.\n• [[()]] — скобки для параметров (пока пустые).\n• Код до [[end]] — тело функции.",
  "Важно: пока функцию только объявили, код внутри не выполняется. Он выполнится, когда функцию вызовут:",
  {c:'greet()   --> Привет!\ngreet()   --> Привет!  (можно сколько угодно раз)'},
  {h:"Параметры — данные на входе"},
  "Чтобы функция работала с разными данными, ей дают параметры: переменные, которые получают значения при вызове.",
  {c:'local function greet(name)\n    print("Привет, " .. name)\nend\n\ngreet("Миша")   --> Привет, Миша\ngreet("Аня")    --> Привет, Аня'},
  "Здесь [[name]] — параметр («пустой слот»), а [[\"Миша\"]] — аргумент («что положили в слот»). Параметров может быть несколько, через запятую: [[function add(a, b)]].",
  "Если аргумент не передать, параметр будет равен [[nil]].",
  {tip:"Объявляй функцию до того, как вызываешь её. Иначе Luau ещё не будет знать, что это такое."}],
 ex:[
  C("Каким словом объявляют функцию?",null,["function","def","func","fn"],0,"В Luau функцию создают словом function (обычно с local впереди). def — из Python, func — из Go и Swift, fn — из Rust."),
  I("Объяви функцию heal","local ___ heal(amount)\n    hp += amount\nend","function","Чтобы создать функцию, пишут local function, потом имя и параметры в скобках."),
  C("Что выведет код?","local function double(x)\n    return x * 2\nend\nprint(double(7))",["14","7","72","nil"],0,"Вызываем double(7): параметр x получает 7. Функция возвращает 7 * 2 = 14, и print выводит 14."),
  O("Собери функцию сложения",["local","function","add(a, b)","return","a + b","end"],["def","then"],"Порядок: local function имя(параметры), затем тело (return a + b — вернуть сумму), затем end."),
  C("Что вернёт функция без return?",null,["nil","0","false","Ошибку"],0,"Если в функции нет return, она ничего не возвращает. Попробуешь взять её результат — получишь nil."),
  C("Что выведет код?","local function f(a, b)\n    print(b)\nend\nf(1)",["nil","1","0","Ошибку"],0,"При вызове f(1) передан только один аргумент: он попадает в a. Во второй параметр b ничего не передали, поэтому b = nil.")]},
 {title:"return и несколько значений",theory:[
  {h:"return — вернуть результат"},
  "Функция может не только что-то делать, но и вычислять результат и отдавать его обратно. Для этого есть [[return]] («вернуть»).",
  {c:'local function square(x)\n    return x * x\nend\n\nlocal result = square(5)   -- функция вернула 25\nprint(result)               --> 25\nprint(square(3) + 1)        --> 10'},
  "Представь функцию как автомат: кладёшь внутрь 5, автомат считает и выдаёт 25. Это значение можно сохранить в переменную или сразу использовать.",
  "После [[return]] функция сразу заканчивается: код ниже уже не выполнится.",
  {c:'local function check(age)\n    if age < 18 then\n        return "Ребёнок"    -- выходим отсюда\n    end\n    return "Взрослый"\nend'},
  {h:"Можно вернуть несколько значений"},
  "Особенность Luau: функция может вернуть сразу несколько значений через запятую.",
  {c:'local function minMax(a, b)\n    if a < b then\n        return a, b\n    end\n    return b, a\nend\n\nlocal lo, hi = minMax(9, 4)\nprint(lo)   --> 4\nprint(hi)   --> 9'},
  "Если переменная слева одна, она получит только первое значение, остальные потеряются.",
  {h:"Значение по умолчанию"},
  "Если аргумент не передали, параметр равен nil. Чтобы подставить запасное значение, используют [[or]]:",
  {c:'local function hit(damage)\n    damage = damage or 10   -- если не передали — 10\n    print("Урон: " .. damage)\nend\nhit(25)   --> Урон: 25\nhit()     --> Урон: 10'}],
 ex:[
  C("Что выведет код?","local function mm()\n    return 1, 2\nend\nlocal a, b = mm()\nprint(a + b)",["3","1","2","12"],0,"Функция возвращает два значения: 1 и 2. Первое попадает в a, второе в b. a + b = 1 + 2 = 3."),
  C("Что вернёт isAdult(20)?","local function isAdult(age)\n    return age >= 18\nend",["true","false","20","nil"],0,"Функция возвращает результат сравнения. 20 >= 18 — правда, значит true."),
  I("Верни квадрат числа","local function square(x)\n    ___ x * x\nend","return","Чтобы функция отдала результат наружу, перед ним пишут return."),
  C("Что выведет код?",'local function f()\n    return "a", "b", "c"\nend\nlocal x = f()\nprint(x)',["a","a b c","c","nil"],0,"Функция возвращает три значения, но переменная слева одна. Она получает только первое — \"a\", остальные отбрасываются."),
  C("Что выведет код?","local function hit(dmg)\n    dmg = dmg or 10\n    return dmg\nend\nprint(hit())",["10","nil","0","Ошибку"],0,"hit() вызвана без аргумента, поэтому dmg = nil. Строка dmg = dmg or 10: nil — ложь, берётся 10."),
  C("Что такое параметр функции?",null,["Имя в объявлении, которое получает значение аргумента","Значение, которое возвращает функция","Имя самой функции","Глобальная переменная"],0,"В function greet(name) параметр — name. При вызове greet(\"Миша\") аргумент \"Миша\" попадает в параметр name.")]},
 {title:"Анонимные функции и область видимости",theory:[
  {h:"Функция — это тоже значение"},
  "В Luau функцию можно положить в переменную, как число или текст. Функцию без имени называют анонимной.",
  {c:'local square = function(x)\n    return x * x\nend\nprint(square(5))   --> 25'},
  "Это то же самое, что [[local function square(x)]], просто записано иначе.",
  {h:"Функцию можно передать в другую функцию"},
  {c:'local function doTwice(action)\n    action()\n    action()\nend\n\ndoTwice(function()\n    print("Прыжок!")\nend)\n-- Прыжок!\n-- Прыжок!'},
  "Это очень важно для Roblox: так работают все события. Ты передаёшь функцию, а Roblox вызывает её, когда что-то случится, например игрок коснулся части.",
  {h:"Область видимости"},
  "Переменная с [[local]] живёт только внутри своего блока: функции, цикла, if или [[do … end]]. Снаружи её «не видно».",
  {c:'local x = 1\ndo\n    local x = 2       -- это ДРУГАЯ x, она живёт только здесь\n    print(x)          --> 2\nend\nprint(x)              --> 1 (внешняя x не изменилась)'},
  {h:"Замыкание: функция помнит переменные"},
  "Если создать функцию внутри другой функции, внутренняя «запоминает» переменные внешней, даже когда внешняя уже закончила работу.",
  {c:'local function makeCounter()\n    local count = 0\n    return function()\n        count += 1\n        return count\n    end\nend\n\nlocal counter = makeCounter()\nprint(counter())   --> 1\nprint(counter())   --> 2\nprint(counter())   --> 3'},
  "У counter есть своя «личная» переменная count, которая сохраняется между вызовами."],
 ex:[
  C("Что выведет код?","local square = function(x) return x * x end\nprint(square(5))",["25","10","5","nil"],0,"В переменную square положили функцию. Вызываем её с 5: 5 × 5 = 25. Работает так же, как обычная функция."),
  C("Что выведет код?","local x = 1\ndo\n    local x = 2\nend\nprint(x)",["1","2","nil","Ошибку"],0,"Внутри do … end создана новая переменная x = 2, она живёт только внутри блока. Снаружи осталась первая x, а она равна 1."),
  C("Можно ли передать функцию как аргумент?",null,["Да, функции — это значения","Нет","Только встроенные","Только глобальные"],0,"В Luau функции — обычные значения, их можно передавать. Именно так в Roblox подключают события: part.Touched:Connect(function(hit) … end)."),
  C("Что выведет код?","local function makeCounter()\n    local c = 0\n    return function()\n        c += 1\n        return c\n    end\nend\nlocal nxt = makeCounter()\nnxt()\nprint(nxt())",["2","1","0","nil"],0,"nxt помнит свою переменную c. Первый вызов nxt(): c = 1 (результат не выводим). Второй вызов: c = 2, его и выводим."),
  C("Что выведет код?","local function apply(f, v)\n    return f(v)\nend\nprint(apply(function(n) return n + 1 end, 9))",["10","9","nil","Ошибку"],0,"apply получает функцию f (она прибавляет 1) и число v = 9. Внутри вызывается f(9) = 9 + 1 = 10."),
  C("Зачем писать local function вместо function?",null,["Быстрее и не засоряет глобальную область","Так короче","Иначе функция не вызовется","Разницы нет"],0,"Без local функция становится глобальной: она видна везде, может случайно перезаписаться другим кодом и работает чуть медленнее. Поэтому в Roblox всегда пишут local function.")]}
 ]},
{title:"Таблицы",desc:"Массивы, словари и перебор",
 practice:{min:30,tasks:["Создай массив inventory = {\"Меч\", \"Щит\", \"Зелье\"}.","Добавь «Лук» через table.insert и удали первый предмет через table.remove(inventory, 1).","Выведи весь инвентарь с номерами через for i, item in ipairs(inventory).","Сделай словарь prices = { Меч = 100, Щит = 60, Зелье = 25 } и посчитай общую стоимость через pairs.","Сделай вложенную таблицу player = { name = \"Миша\", stats = { hp = 100, speed = 16 } } и выведи player.stats.speed."]},
 lessons:[
 {title:"Массивы",theory:[
  {h:"Что такое таблица"},
  "Таблица — главная структура данных в Luau. Это контейнер, куда можно сложить много значений сразу. Таблицы пишут в фигурных скобках [[{ }]].",
  {h:"Массив — список по порядку"},
  "Самый простой вид таблицы — массив: значения через запятую, и у каждого есть номер (индекс).",
  {c:'local fruits = {"яблоко", "банан", "вишня"}\n--               [1]       [2]      [3]'},
  {tip:"В Luau нумерация начинается с 1, а не с 0, как во многих других языках."},
  {h:"Как достать элемент"},
  "Номер элемента пишут в квадратных скобках:",
  {c:'print(fruits[1])   --> яблоко\nprint(fruits[3])   --> вишня\nprint(fruits[10])  --> nil (такого элемента нет, но и ошибки нет)'},
  {h:"Длина массива"},
  "[[#]] перед таблицей даёт количество элементов:",
  {c:'print(#fruits)   --> 3'},
  {h:"Добавить и удалить"},
  {c:'local inv = {"Меч", "Щит"}\n\ntable.insert(inv, "Лук")      -- добавить в конец\n-- теперь: {"Меч", "Щит", "Лук"}\n\ntable.remove(inv, 1)          -- удалить элемент №1\n-- теперь: {"Щит", "Лук"} — остальные сдвинулись!\n\ninv[1] = "Топор"              -- заменить элемент №1\n-- теперь: {"Топор", "Лук"}'},
  "Важно: после [[table.remove]] все элементы справа сдвигаются на одно место влево, и их номера меняются."],
 ex:[
  C("С какого индекса начинаются массивы в Luau?",null,["1","0","-1","Любого"],0,"В Luau первый элемент массива имеет номер 1. Это отличие от Python и JavaScript, где счёт идёт с 0."),
  C("Что выведет код?","local t = {10, 20, 30}\nprint(t[2])",["20","10","30","nil"],0,"t[2] — элемент номер 2. Считаем с 1: [1] = 10, [2] = 20, [3] = 30."),
  C("Что выведет код?",'print(#{"a", "b", "c", "d"})',["4","3","5","0"],0,"# возвращает количество элементов в массиве. Их четыре: a, b, c, d."),
  I("Добавь меч в конец инвентаря",'table.___(inventory, "Меч")',"insert","table.insert(массив, значение) добавляет значение в конец массива. insert по-английски — «вставить»."),
  C("Что выведет код?","local t = {1, 2, 3}\ntable.remove(t, 1)\nprint(t[1])",["2","1","nil","3"],0,"Удалили первый элемент (1). Остальные сдвинулись влево, массив стал {2, 3}. Теперь t[1] = 2."),
  C("Что выведет код?",'local t = {"a", "b"}\nprint(t[3])',["nil","b","Ошибку","\"\""],0,"В массиве только два элемента. Обращение к несуществующему номеру 3 не вызывает ошибку, а просто даёт nil.")]},
 {title:"Словари",theory:[
  {h:"Словарь — данные с подписями"},
  "В массиве элементы пронумерованы. А в словаре у каждого значения есть ключ — название. Так удобно описывать объекты: игрока, предмет, настройки.",
  {c:'local player = {\n    name = "Миша",\n    level = 5,\n    coins = 100,\n}'},
  "Слева от [[=]] — ключ (name), справа — значение («Миша»). Пары разделяются запятыми.",
  {h:"Как читать значения"},
  "Есть два способа, и они полностью одинаковые:",
  {c:'print(player.name)      --> Миша   (через точку — чаще всего)\nprint(player["name"])   --> Миша   (через скобки с текстом)'},
  "Способ со скобками нужен, когда ключ хранится в переменной или в нём есть пробел: [[player[\"best score\"]]].",
  {h:"Изменить, добавить, удалить"},
  {c:'player.level = 6        -- изменить\nplayer.vip = true       -- добавить новое поле\nplayer.coins = nil      -- удалить поле (присвоить «ничего»)\nprint(player.weapon)    --> nil (такого поля нет)'},
  {h:"Особенность #"},
  "[[#]] считает только пронумерованные элементы (1, 2, 3…). У словаря с текстовыми ключами длина [[#]] будет 0.",
  {c:'local t = { a = 1, b = 2 }\nprint(#t)   --> 0'}],
 ex:[
  C("Что выведет код?","local p = { hp = 100 }\nprint(p.hp)",["100","hp","nil","Ошибку"],0,"В таблице p есть ключ hp со значением 100. p.hp читает значение по этому ключу."),
  C("Какие записи равнозначны?",null,['p.hp и p["hp"]','p.hp и p[hp]','p:hp и p.hp','p->hp и p.hp'],0,'p.hp — сокращённая запись для p["hp"]. А p[hp] без кавычек ищет ключ по значению переменной hp, а не по слову "hp".'),
  I("Удали поле coins",'player.coins = ___',"nil","Чтобы удалить поле из таблицы, ему присваивают nil — «ничего»."),
  C("Что выведет код?",'local stats = {}\nstats.kills = 3\nprint(stats["kills"])',["3","nil","kills","Ошибку"],0,'Создали пустую таблицу и добавили поле kills = 3. stats["kills"] — тот же ключ, только в другой записи, поэтому выводится 3.'),
  O("Собери таблицу настроек со скоростью 16",["local","config","=","{","speed","=","16","}"],["[","]"],"Словарь в фигурных скобках: { ключ = значение }. Квадратные скобки для этого не нужны."),
  C("Что выведет код?","local t = { a = 1, b = 2 }\nprint(#t)",["0","2","1","nil"],0,"# считает только элементы с номерами 1, 2, 3… У t ключи текстовые (a и b), пронумерованных элементов нет, поэтому длина 0.")]},
 {title:"Перебор таблиц",theory:[
  {h:"Как пройтись по всем элементам"},
  "Часто нужно сделать что-то с каждым элементом таблицы: вывести все предметы, посчитать сумму. Для этого есть специальный цикл for.",
  {h:"ipairs — для массивов"},
  {c:'local items = {"Меч", "Щит", "Лук"}\n\nfor i, item in ipairs(items) do\n    print(i, item)\nend\n-- 1 Меч\n-- 2 Щит\n-- 3 Лук'},
  "На каждом шаге цикл кладёт номер в [[i]], а значение в [[item]]. Имена переменных можно выбрать любые. [[ipairs]] идёт строго по порядку: 1, 2, 3…",
  "Если номер не нужен, вместо него пишут [[_]] (подчёркивание) — так принято обозначать переменную, которую не используют:",
  {c:'local prices = {5, 10, 15}\nlocal total = 0\nfor _, price in ipairs(prices) do\n    total += price\nend\nprint(total)   --> 30'},
  {h:"pairs — для словарей"},
  {c:'local stats = { hp = 100, speed = 16, jump = 50 }\n\nfor key, value in pairs(stats) do\n    print(key, value)\nend\n-- hp 100\n-- speed 16\n-- jump 50  (порядок может быть любым!)'},
  "[[pairs]] обходит все ключи, но в случайном порядке. Не рассчитывай, что они пойдут так, как ты их написал.",
  {h:"Вложенные таблицы"},
  "Внутри таблицы может лежать другая таблица:",
  {c:'local player = {\n    name = "Миша",\n    stats = { hp = 50, speed = 16 },\n}\nprint(player.stats.hp)   --> 50'},
  {tip:"В Luau можно писать просто for k, v in таблица do, без pairs и ipairs. Но в чужом коде ты чаще увидишь ipairs и pairs, поэтому знай оба способа."}],
 ex:[
  C("Для чего лучше ipairs?",null,["Массив по порядку","Словарь по ключам","Строки","Числа от 1 до N"],0,"ipairs проходит по пронумерованным элементам строго по порядку: 1, 2, 3… Это то, что нужно для массивов."),
  C("Что выведет код?",'local t = {"x", "y"}\nfor i, v in ipairs(t) do\n    print(i, v)\nend',["1 x\n2 y","x\ny","0 x\n1 y","1\n2"],0,"На каждом шаге i — номер, v — значение. print(i, v) выводит оба через пробел: сначала 1 x, потом 2 y."),
  C("Гарантирован ли порядок у pairs?",null,["Нет","Да, алфавитный","Да, по порядку добавления","Да, по значениям"],0,"pairs может выдавать ключи в любом порядке. Если важен порядок, используй массив и ipairs."),
  I("Перебери словарь scores","for key, value in ___(scores) do\n    print(key, value)\nend","pairs","Для словаря с ключами-названиями используют pairs: он обходит все пары «ключ — значение»."),
  C("Что выведет код?","local t = {5, 10, 15}\nlocal s = 0\nfor _, v in ipairs(t) do\n    s += v\nend\nprint(s)",["30","15","3","0"],0,"Цикл по очереди прибавляет к s каждое значение: 0 + 5 = 5, 5 + 10 = 15, 15 + 15 = 30. _ — номер, который нам не нужен."),
  C("Что выведет код?","local map = { player = { hp = 50 } }\nprint(map.player.hp)",["50","nil","player","Ошибку"],0,"Идём по цепочке: map.player — внутренняя таблица { hp = 50 }, а у неё .hp = 50.")]}
 ]},
{title:"Строки и математика",desc:"Методы строк, math и форматирование",
 practice:{min:25,tasks:["Напиши функцию formatTime(seconds), которая превращает секунды в таймер «мм:сс»: string.format(\"%02d:%02d\", seconds // 60, seconds % 60). Проверь на 125 → 02:05.","Сгенерируй случайный код из 4 цифр: math.random(1000, 9999).","Раздели строку \"меч,щит,лук\" через :split(\",\") и выведи каждый предмет в цикле.","Ограничь здоровье от 0 до 100 через math.clamp(hp, 0, 100) и проверь на значениях -20 и 150."]},
 lessons:[
 {title:"Методы строк",theory:[
  {h:"Строки умеют много всего"},
  "У текста есть встроенные команды — методы. Их вызывают через двоеточие: [[текст:метод()]].",
  {c:'local s = "Roblox"\n\nprint(s:upper())     --> ROBLOX  (всё большими буквами)\nprint(s:lower())     --> roblox  (всё маленькими)\nprint(s:len())       --> 6       (длина, как #s)\nprint(s:reverse())   --> xolboR  (задом наперёд)'},
  {h:"Почему двоеточие"},
  "[[s:upper()]] — это сокращение для [[string.upper(s)]]. Двоеточие значит «передай эту строку в функцию первым аргументом». Обе записи работают одинаково.",
  {h:"Вырезать кусок: sub"},
  "[[s:sub(от, до)]] вырезает часть строки. Номера символов считаются с 1, оба конца включаются.",
  {c:'local s = "Roblox"\n--         R o b l o x\n--         1 2 3 4 5 6\nprint(s:sub(1, 3))   --> Rob\nprint(s:sub(4))      --> lox (с 4-го до конца)'},
  {h:"Разделить на части: split"},
  {c:'local text = "меч,щит,лук"\nlocal items = text:split(",")   -- режем по запятой\n-- items = {"меч", "щит", "лук"}\nprint(#items)    --> 3\nprint(items[2])  --> щит'},
  {h:"Повторить: rep"},
  {c:'print(string.rep("ab", 3))   --> ababab\nprint(("-"):rep(10))         --> ----------'},
  {h:"Шаблон: string.format"},
  "Вставляет значения в шаблон на места специальных меток: [[%d]] — целое число, [[%s]] — текст, [[%.2f]] — число с двумя знаками после точки.",
  {c:'print(string.format("Игрок %s набрал %d очков", "Аня", 50))\n--> Игрок Аня набрал 50 очков\nprint(string.format("%.1f%%", 99.456))   --> 99.5%'}],
 ex:[
  C("Что выведет код?",'print(("luau"):upper())',["LUAU","luau","Luau","Ошибку"],0,"upper переводит все буквы в верхний регистр (заглавные). Скобки вокруг \"luau\" нужны, чтобы вызвать метод прямо у текста."),
  C("Что выведет код?",'local s = "Roblox"\nprint(s:sub(1, 3))',["Rob","Ro","obl","blox"],0,"sub(1, 3) берёт символы с 1-го по 3-й включительно: R(1), o(2), b(3) → Rob."),
  C("Что выведет код?",'print(string.rep("ab", 3))',["ababab","ab3","ab ab ab","aaabbb"],0,"rep повторяет строку указанное количество раз и склеивает без пробелов: ab + ab + ab."),
  I("Подставь целое число в шаблон",'string.format("Очки: %___", 50)',"d","Метка %d означает «целое число» (от слова digit — цифра). На её место встанет 50."),
  C("Чему равно s:upper()?",null,["string.upper(s)","s.upper()","upper(s)","string:upper(s)"],0,"Двоеточие — сокращение: s:upper() значит «вызови string.upper и передай s первым аргументом»."),
  C("Что выведет код?",'local parts = ("a,b,c"):split(",")\nprint(#parts)',["3","5","1","2"],0,"split режет строку по запятым и получается массив {\"a\", \"b\", \"c\"}. Длина массива — 3. Сами запятые в результат не попадают.")]},
 {title:"Библиотека math",theory:[
  {h:"Готовые математические функции"},
  "[[math]] — набор полезных функций для чисел. Вызываются через точку: [[math.имя(...)]].",
  {h:"Округление"},
  {c:'math.floor(3.7)    --> 3  (вниз, «пол»)\nmath.ceil(3.2)     --> 4  (вверх, «потолок»)\nmath.round(2.5)    --> 3  (по правилам математики)\nmath.round(2.4)    --> 2'},
  "Запомнить легко: floor — пол (вниз), ceil — потолок (вверх).",
  {h:"Больше, меньше, модуль"},
  {c:'math.max(4, 9, 2)    --> 9   (наибольшее)\nmath.min(4, 9, 2)    --> 2   (наименьшее)\nmath.abs(-7)         --> 7   (модуль: убирает минус)\nmath.sqrt(16)        --> 4   (квадратный корень)'},
  {h:"Случайные числа"},
  "[[math.random(a, b)]] возвращает случайное целое число от a до b включительно. Это основа лутбоксов, шанса крита и случайного спавна.",
  {c:'local dice = math.random(1, 6)        -- бросок кубика: 1…6\nif math.random(1, 100) <= 10 then     -- шанс 10%\n    print("Критический удар!")\nend'},
  {h:"clamp — зажать в рамки"},
  "[[math.clamp(x, min, max)]] не даёт числу выйти за границы. Очень удобно для здоровья:",
  {c:'local hp = 150\nhp = math.clamp(hp, 0, 100)   --> 100 (больше 100 нельзя)\nprint(math.clamp(-20, 0, 100)) --> 0  (меньше 0 нельзя)\nprint(math.clamp(50, 0, 100))  --> 50 (в рамках — не меняется)'},
  {h:"Число π"},
  "[[math.pi]] ≈ 3.14159 — пригодится для вращений и кругов."],
 ex:[
  C("Что вернёт math.floor(3.7)?",null,["3","4","3.7","3.5"],0,"floor всегда округляет вниз, даже если дробная часть большая. 3.7 → 3."),
  C("Что вернёт math.ceil(3.2)?",null,["4","3","3.2","5"],0,"ceil всегда округляет вверх, даже если дробная часть маленькая. 3.2 → 4."),
  C("Что вернёт math.random(1, 6)?",null,["Случайное целое от 1 до 6","Случайное дробное от 1 до 6","Всегда 1","Таблицу чисел"],0,"Как бросок кубика: каждый раз случайное целое число 1, 2, 3, 4, 5 или 6. Обе границы включаются."),
  C("Что вернёт math.max(4, 9, 2)?",null,["9","4","2","15"],0,"max выбирает наибольшее из переданных чисел. Среди 4, 9 и 2 это 9."),
  C("Что вернёт math.clamp(150, 0, 100)?",null,["100","150","0","50"],0,"clamp зажимает число в рамки от 0 до 100. 150 больше верхней границы, поэтому результат — граница, то есть 100."),
  I("Получи 4 из 16","print(math.___(16))","sqrt","Квадратный корень из 16 — это 4, потому что 4 × 4 = 16. Функция называется math.sqrt (square root).")]},
 {title:"Интерполяция и форматирование",theory:[
  {h:"Повторим интерполяцию"},
  "Самый удобный способ собрать текст с переменными — обратные кавычки и [[{ }]]. Внутри фигурных скобок можно писать не только переменные, но и любые выражения.",
  {c:'local name, lvl = "Аня", 7\n\nprint(`{name} — уровень {lvl}`)         --> Аня — уровень 7\nprint(`Через год: {lvl + 1}`)            --> Через год: 8\nprint(`Имя большими: {name:upper()}`)    --> Имя большими: АНЯ'},
  {tip:"Строку local name, lvl = \"Аня\", 7 можно читать как «name = Аня, lvl = 7»: так объявляют две переменные сразу."},
  {h:"Когда нужен string.format"},
  "Интерполяция не умеет округлять. Если нужно красиво показать дробное число, используй [[string.format]]:",
  {c:'local accuracy = 87.6543\nprint(string.format("Точность: %.1f%%", accuracy))\n--> Точность: 87.7%\n-- %.1f — число с 1 знаком после точки\n-- %%   — сам знак процента'},
  {c:'-- таймер с нулями впереди\nlocal sec = 65\nprint(string.format("%02d:%02d", sec // 60, sec % 60))\n--> 01:05\n-- %02d — целое минимум из 2 цифр, недостающие заполняются нулём'},
  {h:"Перевод между текстом и числом"},
  {c:'print(tostring(12) .. "!")   --> 12!\nprint(tonumber("42") * 2)    --> 84\nprint(tonumber("abc"))       --> nil (это не число)'},
  "Проверка [[if tonumber(text) then]] — простой способ узнать, ввёл ли игрок число."],
 ex:[
  C("Какие кавычки нужны для интерполяции?",null,["Обратные `","Двойные \"","Одинарные '","Квадратные [[ ]]"],0,"Только в обратных кавычках ` (клавиша Ё) выражения в {} заменяются значениями."),
  C("Что выведет код?",'local name = "Аня"\nlocal lvl = 7\nprint(`{name} — уровень {lvl}`)',["Аня — уровень 7","{name} — уровень {lvl}","name — уровень lvl","Ошибку"],0,"Каждое {…} заменяется значением переменной: {name} → Аня, {lvl} → 7."),
  C("Что выведет код?","print(`{2 + 3}`)",["5","2 + 3","{5}","23"],0,"Внутри {} выражение сначала вычисляется: 2 + 3 = 5, и в текст вставляется результат."),
  C("Что вернёт string.format(\"%.2f\", 3.14159)?",null,["3.14","3.14159","3","3.1"],0,"%.2f значит «дробное число, ровно 2 знака после точки». 3.14159 округляется до 3.14."),
  C("Что вернёт tonumber(\"abc\")?",null,["nil","0","Ошибку","\"abc\""],0,"\"abc\" нельзя превратить в число. tonumber в таком случае не ломает скрипт, а возвращает nil."),
  I("Склей число с восклицательным знаком",'print(___(12) .. "!")',"tostring","tostring превращает число 12 в текст \"12\". (Оператор .. справился бы и сам, но явное преобразование делает код понятнее.)")]}
 ]},
{title:"Типы в Luau",desc:"Аннотации, --!strict, свои типы",
 practice:{min:30,tasks:["Создай новый Script и первой строкой напиши --!strict.","Объяви переменные с типами: local coins: number = 0, local name: string = \"Миша\".","Перепиши инвентарь из раздела «Таблицы» с типами: local inventory: {string} = {…} и local prices: {[string]: number} = {…}.","Опиши type PlayerData = { name: string, coins: number } и создай переменную этого типа.","Нарочно запиши текст в переменную типа number и посмотри на красное подчёркивание. Наведи на него мышь и прочитай подсказку."]},
 lessons:[
 {title:"Аннотации типов",theory:[
  {h:"Зачем указывать типы"},
  "Представь, что ты случайно записал в переменную coins текст \"много\" вместо числа. Игра упадёт, только когда дойдёт до этой строки, может быть, через час игры. Типы позволяют заметить такую ошибку сразу, прямо в редакторе.",
  {h:"Как писать типы"},
  "Тип указывается после имени через двоеточие:",
  {c:'local hp: number = 100\nlocal name: string = "Миша"\nlocal isVip: boolean = false'},
  "Читается так: «hp — это number, и сейчас он равен 100».",
  {h:"Типы в функциях"},
  "Можно указать тип каждого параметра и тип результата (после скобок):",
  {c:'local function add(a: number, b: number): number\n    return a + b\nend\n\nadd(2, 3)        -- всё хорошо\nadd(2, "три")    -- редактор подчеркнёт: "три" — не number'},
