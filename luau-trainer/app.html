<title>Тропа Luau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow app column (like a phone app), sticky stat bar on top, tab bar at the bottom, lessons open as a full-screen layer. */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F5F7FC; --line:#DCE2EF;
  --ink:#162033; --muted:#5B6782;
  --accent:#3454E8; --accent-deep:#2238B3; --accent-soft:#E3E9FF;
  --good:#1F9D57; --good-deep:#157541; --good-soft:#DDF5E7;
  --bad:#D93C47; --bad-deep:#A52833; --bad-soft:#FCE3E5;
  --gold:#E8A200; --gold-deep:#B27C00; --gold-soft:#FFF1CC;
  --locked:#C9D0DF; --locked-deep:#A9B2C6;
  --code-bg:#1B2236; --code-ink:#E6EAF5; --code-kw:#FF9E64; --code-str:#9ECE6A; --code-num:#E0AF68; --code-com:#7C86A6; --code-fn:#7DCFFF;
  --f-display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#171E31; --surface-2:#1D2540; --line:#2A3452;
  --ink:#E8ECF6; --muted:#98A3C0;
  --accent:#6F87FF; --accent-deep:#4258D6; --accent-soft:#232E5A;
  --good:#37C878; --good-deep:#22924F; --good-soft:#163A2A;
  --bad:#FF6B73; --bad-deep:#C2414A; --bad-soft:#41202A;
  --gold:#FFC23D; --gold-deep:#C38D10; --gold-soft:#3B3017;
  --locked:#36405E; --locked-deep:#262E47;
  --code-bg:#0A0E1A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E31; --surface-2:#1D2540; --line:#2A3452;
  --ink:#E8ECF6; --muted:#98A3C0;
  --accent:#6F87FF; --accent-deep:#4258D6; --accent-soft:#232E5A;
  --good:#37C878; --good-deep:#22924F; --good-soft:#163A2A;
  --bad:#FF6B73; --bad-deep:#C2414A; --bad-soft:#41202A;
  --gold:#FFC23D; --gold-deep:#C38D10; --gold-soft:#3B3017;
  --locked:#36405E; --locked-deep:#262E47;
  --code-bg:#0A0E1A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
code,.mono{font-family:var(--f-mono)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:13px;transform:rotate(-8deg)}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.stat svg{width:22px;height:22px}
.s-streak{color:var(--gold)} .s-xp{color:var(--accent)} .s-heart{color:var(--bad)}
.s-streak.off{color:var(--muted)}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{padding-block:20px;display:flex;flex-direction:column;gap:20px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.nav button{background:none;border:2px solid transparent;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}

/* chunky buttons */
.btn{border:none;border-radius:14px;padding:13px 20px;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-deep);color:var(--muted);cursor:not-allowed}
.btn.good{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-deep);color:#2a1d00}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{padding:9px 14px;font-size:13px}

/* today card */
.today{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:16px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.today h2{font-size:16px}
.today p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* unit band */
.unit{display:flex;flex-direction:column;gap:18px}
.band{border-radius:var(--r);padding:16px 18px;color:#fff;background:var(--accent);box-shadow:0 4px 0 var(--accent-deep);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.band.locked{background:var(--locked);box-shadow:0 4px 0 var(--locked-deep);color:var(--ink)}
.band.complete{background:var(--good);box-shadow:0 4px 0 var(--good-deep)}
.band .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.band h2{font-size:19px;margin-top:2px}
.band p{margin:4px 0 0;font-size:14px;opacity:.92}
.band .acts{display:flex;flex-direction:column;gap:8px;flex:none}
.band-btn{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:inherit;border-radius:12px;padding:6px 10px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.band.locked .band-btn{background:var(--surface);border-color:var(--line)}

.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:6px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.node{width:72px;height:66px;border-radius:50%;border:none;display:grid;place-items:center;background:var(--accent);box-shadow:0 6px 0 var(--accent-deep);color:#fff;transition:transform .06s,box-shadow .06s}
.node svg{width:30px;height:30px}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep)}
.node.done{background:var(--gold);box-shadow:0 6px 0 var(--gold-deep);color:#3a2800}
.node.locked{background:var(--locked);box-shadow:0 6px 0 var(--locked-deep);color:var(--muted)}
.node.test{border-radius:22px}
.node.test.done{background:var(--good);box-shadow:0 6px 0 var(--good-deep);color:#fff}
.node.practice{width:60px;height:56px;background:var(--surface);color:var(--accent);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.node.practice.done{color:var(--good);border-color:var(--good)}
.node-label{font-size:13px;font-weight:600;color:var(--muted);text-align:center;max-width:180px;line-height:1.3}
.node-wrap.current .node{animation:bob 1.6s ease-in-out infinite}
.start-tag{position:absolute;top:-34px;background:var(--surface);border:2px solid var(--line);color:var(--accent);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:10px;white-space:nowrap}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node-wrap.current{margin-top:26px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.node-wrap.current .node{animation:none}*{transition:none!important}}

.final{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.final h2{font-size:18px}
.final p{margin:0;color:var(--muted)}

/* cards & sections */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:18px}
.card h3{font-size:15px}
.card p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.h-page{font-size:24px}
.lead{margin:0;color:var(--muted);max-width:60ch}

/* plan */
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl label{font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.ctrl output{font-family:var(--f-display);font-weight:700;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.big-est{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.est .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.est .v{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.est .d{font-size:13px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n{white-space:nowrap;font-weight:600}
tr.hl td{background:var(--accent-soft)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.st svg{width:28px;height:28px;flex:none}
.st b{font-family:var(--f-display);font-size:19px;display:block;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.week i{width:100%;max-width:30px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.week i.met{background:var(--good)}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.sheet h2{font-size:20px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.checklist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.checklist li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.checklist input{margin-top:4px;width:18px;height:18px;accent-color:var(--good);flex:none}

/* lesson layer */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.x{background:none;border:none;color:var(--muted);padding:4px;display:grid;place-items:center;border-radius:8px}
.x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.l-body{flex:1;overflow-y:auto}
.l-body .wrap{padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
.kind{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.q{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3}
.l-foot{border-top:2px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-foot .wrap{padding-block:14px;display:flex;flex-direction:column;gap:12px}
.l-foot.ok{background:var(--good-soft);border-color:var(--good)}
.l-foot.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:4px}
.fb h3{font-size:18px;display:flex;align-items:center;gap:8px}
.l-foot.ok .fb h3{color:var(--good)} .l-foot.no .fb h3{color:var(--bad)}
.fb p{margin:0;font-size:15px}
.fb .ans{font-family:var(--f-mono);font-weight:600;white-space:pre-wrap;word-break:break-word}

pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:14px 16px;margin:0;overflow-x:auto;font-family:var(--f-mono);font-size:14px;line-height:1.6;tab-size:4}
.k{color:var(--code-kw);font-weight:600} .s{color:var(--code-str)} .nm{color:var(--code-num)} .cm{color:var(--code-com);font-style:italic} .fn{color:var(--code-fn)}
pre.code input.blank{font-family:var(--f-mono);font-size:14px;background:rgba(255,255,255,.1);color:#fff;border:none;border-bottom:2px solid var(--code-fn);border-radius:4px 4px 0 0;padding:1px 6px;width:9ch;min-width:5ch}
code.in{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.9em}

.theory{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.theory p{margin:0;max-width:65ch}
.tip{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;gap:10px}
.tip b{color:var(--gold-deep)}
:root[data-theme="dark"] .tip b{color:var(--gold)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;box-shadow:0 3px 0 var(--line);display:flex;gap:12px;align-items:flex-start;font-size:16px}
.opt .num{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt .t{white-space:pre-wrap;word-break:break-word;min-width:0}
.opt.mono .t{font-family:var(--f-mono);font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt[aria-pressed="true"] .num{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}

.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.chip{font-family:var(--f-mono);font-size:15px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 var(--line)}
.chip.used{visibility:hidden}
.chip:disabled{cursor:default}

.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:24px}
.result h2{font-size:26px}
.medal{width:120px;height:120px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:14px;border:2px solid var(--gold);overflow:hidden;background:var(--surface)}
.tile .k{display:block;background:var(--gold);color:#2a1d00;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.tile .v{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;padding:10px 4px;font-variant-numeric:tabular-nums}
.tile.b{border-color:var(--accent)} .tile.b .k{background:var(--accent);color:#fff}
.tile.g{border-color:var(--good)} .tile.g .k{background:var(--good);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;font-size:14px;max-width:90vw;text-align:center}
.ref-unit{display:flex;flex-direction:column;gap:10px}
.ref-unit h3{font-size:15px;margin-top:6px}
@media (max-width:420px){.band{flex-direction:column}.band .acts{flex-direction:row}.q{font-size:18px}.stat{font-size:14px}.brand span.full{display:none}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><div class="brand-mark">lu</div><span class="full">Тропа Luau</span></div>
  <div class="stat s-streak" id="st-streak" title="Серия дней"></div>
  <div class="stat s-xp" id="st-xp" title="Опыт (XP)"></div>
  <div class="stat s-heart" id="st-heart" title="Сердца"></div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="nav" aria-label="Разделы"><div class="wrap">
  <button data-tab="path" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Обучение</button>
  <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>Тренировка</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>План</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
</div></nav>

<div id="layer-root"></div>
<div id="sheet-root"></div>

<script>
/* ================= КУРС ================= */
const C=(q,code,o,a,e)=>({t:'c',q,code,o,a,e});
const I=(q,code,a,e)=>({t:'i',q,code,a:[].concat(a),e});
const O=(q,p,x,e)=>({t:'o',q,p,x:x||[],e});

const COURSE=[
{title:"Первые шаги",desc:"print, комментарии, переменные и типы данных",

const TEST_N=10, FINAL_N=30, PASS=0.8, MAX_HEARTS=5, HEART_REGEN_MIN=20;

/* ================= СОСТОЯНИЕ ================= */
const KEY='luau-tropa-v1';
const fresh=()=>({done:{},tests:{},practice:{},final:0,xp:0,hearts:MAX_HEARTS,heartTs:Date.now(),streak:0,lastDay:null,days:{},mistakes:[],goal:45,dpw:7,sound:true,answered:0,correct:0});
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
function regenHearts(){
  if(S.hearts>=MAX_HEARTS){S.heartTs=Date.now();return;}
  const gained=Math.floor((Date.now()-S.heartTs)/(HEART_REGEN_MIN*6e4));
  if(gained>0){S.hearts=Math.min(MAX_HEARTS,S.hearts+gained);S.heartTs+=gained*HEART_REGEN_MIN*6e4;if(S.hearts>=MAX_HEARTS)S.heartTs=Date.now();save();}
}
function streakNow(){ if(!S.lastDay)return 0; const d=dayDiff(S.lastDay,today()); return d<=1?S.streak:0; }
function markActivity(minutes){
  const t=today();
  if(S.lastDay!==t){ S.streak=(S.lastDay&&dayDiff(S.lastDay,t)===1)?S.streak+1:1; S.lastDay=t; }
  S.days[t]=(S.days[t]||0)+minutes;
}

/* ================= ЛОГИКА ПРОГРЕССА ================= */
const lk=(u,l)=>u+'-'+l;
const passed=u=>(S.tests[u]||0)>=Math.ceil(TEST_N*PASS);
const unitOpen=u=>u===0||passed(u-1);
const lessonOpen=(u,l)=>unitOpen(u)&&(l===0||!!S.done[lk(u,l-1)]||passed(u));
const lessonsDone=u=>COURSE[u].lessons.every((_,l)=>S.done[lk(u,l)]);
const firstLocked=()=>{for(let u=0;u<COURSE.length;u++)if(!unitOpen(u))return u;return -1;};
const allPassed=()=>COURSE.every((_,u)=>passed(u));
function current(){
  for(let u=0;u<COURSE.length;u++){
    if(!unitOpen(u))return null;
    for(let l=0;l<COURSE[u].lessons.length;l++) if(!S.done[lk(u,l)]&&!passed(u)) return {u,l};
    if(!passed(u))return {u,test:true};
  }
  return allPassed()&&S.final<Math.ceil(FINAL_N*PASS)?{final:true}:null;
}
const exById=id=>{const [u,l,i]=id.split('.').map(Number);return COURSE[u].lessons[l].ex[i];};
const totalLessons=COURSE.reduce((a,u)=>a+u.lessons.length,0);
const totalEx=COURSE.reduce((a,u)=>a+u.lessons.reduce((b,l)=>b+l.ex.length,0),0);

/* ================= УТИЛИТЫ ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' мин';const h=Math.floor(m/60),r=m%60;return h+' ч'+(r?' '+r+' мин':'');};
const fmtHours=m=>{const h=m/60;return (h<10?h.toFixed(1).replace('.',','):Math.round(h))+' ч';};
const KW=new Set('and break continue do else elseif end false for function if in local nil not or repeat return then true until while type export'.split(' '));
const BI=new Set('print warn error pcall assert require typeof type tostring tonumber setmetatable getmetatable pairs ipairs game workspace script task math string table Instance Vector3 CFrame Color3 TweenInfo Enum'.split(' '));
function hl(src){
  let out='',i=0;const n=src.length;
  while(i<n){
    const ch=src[i],rest=src.slice(i);
    let m;
    if(rest.startsWith('--[[')){const e=src.indexOf(']]',i+4);const j=e<0?n:e+2;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(rest.startsWith('--')){const e=src.indexOf('\n',i);const j=e<0?n:e;out+='<span class="cm">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if(ch==='"'||ch==="'"||ch==='`'){let j=i+1;while(j<n&&src[j]!==ch&&src[j]!=='\n'){if(src[j]==='\\')j++;j++;}j=Math.min(n,j+1);out+='<span class="s">'+esc(src.slice(i,j))+'</span>';i=j;continue;}
    if((m=rest.match(/^\d+(\.\d+)?/))){out+='<span class="nm">'+m[0]+'</span>';i+=m[0].length;continue;}
    if((m=rest.match(/^[A-Za-z_][A-Za-z0-9_]*/))){const w=m[0];out+=KW.has(w)?'<span class="k">'+w+'</span>':BI.has(w)?'<span class="fn">'+w+'</span>':w;i+=w.length;continue;}
    out+=esc(ch);i++;
  }
  return out;
}
const inl=s=>esc(s).replace(/\[\[(.+?)\]\]/g,(_,c)=>'<code class="in">'+c+'</code>');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* звук */
let AC=null;
function beep(ok){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const notes=ok?[660,880]:[300,220];
    notes.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(0.0001,AC.currentTime+k*.09);g.gain.exponentialRampToValueAtTime(ok?.18:.07,AC.currentTime+k*.09+.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+k*.09+.16);o.connect(g).connect(AC.destination);o.start(AC.currentTime+k*.09);o.stop(AC.currentTime+k*.09+.18);});
  }catch(e){}
}

 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>'
};

/* ================= ВЕРХНЯЯ ПАНЕЛЬ ================= */
function renderTop(){
  regenHearts();
  const st=streakNow();
  $('#st-streak').className='stat s-streak'+(S.lastDay===today()?'':' off');
  $('#st-streak').innerHTML=IC.flame+st;
  $('#st-xp').innerHTML=IC.bolt+S.xp;
  $('#st-heart').innerHTML=IC.heart+S.hearts;
}

/* ================= ВКЛАДКИ ================= */
let TAB='path';
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{TAB=b.dataset.tab;render();window.scrollTo(0,0);}));
function render(){
  renderTop();
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.tab===TAB)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const v=$('#view');
  v.innerHTML=TAB==='path'?viewPath():TAB==='plan'?viewPlan():TAB==='practice'?viewPractice():viewProfile();
  bindView();
}

function ringSvg(frac,color){
  const r=26,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac));
  return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="700" font-size="14" fill="var(--ink)">${Math.round(f*100)}%</text></svg>`;
}

function viewPath(){
  const cur=current();
  const tmin=S.days[today()]||0;
  let h=`<section class="today">${ringSvg(tmin/S.goal,tmin>=S.goal?'var(--good)':'var(--accent)')}<div><h2>${tmin>=S.goal?'Цель на сегодня выполнена':'Цель на сегодня: '+S.goal+' мин'}</h2><p>Сегодня: ${fmtMin(tmin)} · пройдено уроков: ${Object.keys(S.done).length} из ${totalLessons}</p></div></section>`;
  const fl=firstLocked();
  COURSE.forEach((U,u)=>{
    const open=unitOpen(u),comp=passed(u);
    h+=`<section class="unit"><div class="band ${!open?'locked':comp?'complete':''}"><div><div class="eyebrow">Раздел ${u+1}</div><h2>${esc(U.title)}</h2><p>${esc(U.desc)}</p></div><div class="acts"><button class="band-btn" data-ref="${u}">${'Справка'}</button>${(!comp&&(open&&!lessonsDone(u)||u===fl))?`<button class="band-btn" data-test="${u}">Тест досрочно</button>`:''}</div></div><div class="path">`;
    const offs=[0,-70,-100,-60,0,60];
    U.lessons.forEach((L,l)=>{
      const done=!!S.done[lk(u,l)],can=lessonOpen(u,l),isCur=cur&&cur.u===u&&cur.l===l;
      const x=offs[(l)%offs.length];
      h+=`<div class="node-wrap ${isCur?'current':''}" style="transform:translateX(${x}px)">${isCur?'<span class="start-tag">Начать</span>':''}<button class="node ${done?'done':can?'':'locked'}" data-lesson="${u}-${l}" aria-label="Урок: ${esc(L.title)}">${done?IC.check:can?IC.star:IC.lock}</button><span class="node-label">${esc(L.title)}</span></div>`;
    });
    const tCur=cur&&cur.u===u&&cur.test;const tOpen=open&&lessonsDone(u);
    h+=`<div class="node-wrap ${tCur?'current':''}" style="transform:translateX(30px)">${tCur?'<span class="start-tag">Тест</span>':''}<button class="node test ${comp?'done':tOpen?'':'locked'}" data-test="${u}" aria-label="Тест раздела">${IC.trophy}</button><span class="node-label">Тест раздела${S.tests[u]!=null?' · лучший '+S.tests[u]+'/'+TEST_N:''}</span></div>`;
    h+=`<div class="node-wrap" style="transform:translateX(-40px)"><button class="node practice ${S.practice[u]?'done':''}" data-prac="${u}" aria-label="Практика в Studio">${S.practice[u]?IC.check:IC.hammer}</button><span class="node-label">Практика в Studio · ${U.practice.min} мин</span></div>`;
    h+=`</div></section>`;
  });
  const fp=S.final>=Math.ceil(FINAL_N*PASS);
  h+=`<section class="final"><div class="kind">${IC.trophy} Итоговый экзамен</div><h2>${fp?'Экзамен сдан: '+S.final+'/'+FINAL_N:'Итоговый экзамен по Luau'}</h2><p>${FINAL_N} вопросов из всех разделов. Для зачёта нужно ${Math.ceil(FINAL_N*PASS)} правильных. Открывается после тестов всех разделов.</p><button class="btn ${allPassed()?'gold':''}" data-final ${allPassed()?'':'disabled'}>${fp?'Пересдать':'Начать экзамен'}</button></section>`;
  return h;
}

/* ===== План / расчёт времени ===== */
function remainingMinutes(){
  let m=0;
  COURSE.forEach((U,u)=>{
    U.lessons.forEach((_,l)=>{if(!S.done[lk(u,l)]&&!passed(u))m+=EST.lesson*(1+EST.review);});
    if(!passed(u))m+=EST.test*(1+EST.review);
    if(!S.practice[u])m+=U.practice.min;
  });
  if(S.final<Math.ceil(FINAL_N*PASS))m+=EST.final;
  return m;
}
function totalMinutes(){
  const lessons=totalLessons*EST.lesson*(1+EST.review), tests=COURSE.length*EST.test*(1+EST.review), prac=COURSE.reduce((a,U)=>a+U.practice.min,0);
  return {lessons,tests,prac,final:EST.final,sum:lessons+tests+prac+EST.final};
}
const daysFor=(min,perDay,dpw)=>Math.ceil(min/perDay)*7/dpw;
function fmtDays(d){d=Math.ceil(d);if(d<14)return d+' '+plural(d,'день','дня','дней');const w=Math.round(d/7*2)/2;return (Number.isInteger(w)?w:w.toFixed(1).replace('.',','))+' нед.';}
function fmtDaysLong(d){d=Math.ceil(d);if(d<60)return fmtDays(d);const mo=Math.round(d/30.4*2)/2;return (Number.isInteger(mo)?mo:mo.toFixed(1).replace('.',','))+' мес.';}
function finishDate(d){const dt=new Date();dt.setDate(dt.getDate()+Math.ceil(d));return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function viewPlan(){
  const T=totalMinutes(),R=remainingMinutes();
  const doneFrac=1-R/T.sum;
  const stages=[
    {name:"Синтаксис Luau",note:"Разделы 1–8: можешь читать и писать любые скрипты",min:COURSE.slice(0,8).reduce((a,U)=>a+U.lessons.length*EST.lesson*(1+EST.review)+EST.test*(1+EST.review)+U.practice.min,0)},
    {name:"Весь курс",note:"Разделы 1–12, практика и итоговый экзамен",min:T.sum},
    {name:"Первая своя игра",note:"Курс + ~30 ч на свой проект (обби, симулятор, тайкун)",min:T.sum+EST.project},
    {name:"Уверенный скриптер",note:"Курс + ~100 ч практики: системы, DataStore, UI",min:T.sum+EST.confident}
  ];
  const perDay=S.goal,dpw=S.dpw;
  const rows=stages.map(s=>`<tr><td><b>${s.name}</b><br><span class="muted small">${s.note}</span></td><td class="n">${fmtHours(s.min)}</td><td class="n">${fmtDaysLong(daysFor(s.min,30,dpw))}</td><td class="n">${fmtDaysLong(daysFor(s.min,60,dpw))}</td></tr>`).join('');
  const days=Object.keys(S.days).length,spent=Object.values(S.days).reduce((a,b)=>a+b,0);
  const pace=days?spent/days:0;
  return `<div><h1 class="h-page">План обучения</h1></div>
  <p class="lead">Сколько времени займёт путь, если заниматься 30–60 минут в день. Расчёт обновляется по мере прохождения.</p>
  <section class="card">
    <div class="ctrl"><label for="goal">Минут в день <output id="goal-out">${perDay} мин</output></label><input type="range" id="goal" min="30" max="60" step="5" value="${perDay}"></div>
    <div class="ctrl"><label>Дней в неделю</label><div class="seg" id="dpw">${[3,5,6,7].map(n=>`<button aria-pressed="${n===dpw}" data-dpw="${n}">${n}</button>`).join('')}</div></div>
    <div class="big-est">
      <div class="est"><span class="k">Осталось курса</span><span class="v">${fmtDaysLong(daysFor(R,perDay,dpw))}</span><span class="d">${fmtHours(R)} занятий</span></div>
      <div class="est"><span class="k">Финиш примерно</span><span class="v" style="font-size:17px">${finishDate(daysFor(R,perDay,dpw))}</span><span class="d">при ${perDay} мин × ${dpw} дн./нед.</span></div>
    </div>
    <div class="bar" aria-label="Пройдено курса"><i style="width:${Math.max(2,doneFrac*100).toFixed(1)}%"></i></div>
    <p class="small muted">Пройдено ${Math.round(doneFrac*100)}% курса по времени.</p>
  </section>
  <section class="card">
    <h2>Этапы и сроки</h2>
    <div class="tbl-wrap"><table><thead><tr><th>Этап</th><th>Часов</th><th>30 мин/день</th><th>60 мин/день</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">Сроки в таблице — с нуля, при ${dpw} ${plural(dpw,'дне','днях','днях')} занятий в неделю.</p>
  </section>
  <section class="card">
    <h2>Из чего складывается курс</h2>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>${totalLessons} уроков × ~${EST.lesson} мин (теория + ${Math.round(totalEx/totalLessons)} заданий)</td><td class="n">${fmtMin(totalLessons*EST.lesson)}</td></tr>
      <tr><td>${COURSE.length} тестов разделов × ~${EST.test} мин</td><td class="n">${fmtMin(COURSE.length*EST.test)}</td></tr>
      <tr><td>Повторение ошибок (+${EST.review*100}%)</td><td class="n">${fmtMin((T.lessons+T.tests)-(totalLessons*EST.lesson+COURSE.length*EST.test))}</td></tr>
      <tr><td>Практика в Roblox Studio (${COURSE.length} заданий)</td><td class="n">${fmtMin(T.prac)}</td></tr>
      <tr><td>Итоговый экзамен</td><td class="n">${fmtMin(EST.final)}</td></tr>
      <tr><td><b>Итого</b></td><td class="n"><b>${fmtHours(T.sum)}</b></td></tr>
    </tbody></table></div>
  </section>
  <section class="card">
    <h2>Твой реальный темп</h2>
    ${spent>=20?`<p>Ты занимался ${days} ${plural(days,'день','дня','дней')}, в среднем ${fmtMin(pace)} в день. С таким темпом курс закончится через <b>${fmtDaysLong(Math.ceil(R/Math.max(pace,5)))}</b> (если заниматься каждый день).</p>`:`<p class="muted">Позанимайся хотя бы 20 минут — и здесь появится прогноз по твоему настоящему темпу.</p>`}
  </section>
  <section class="card">
    <h2>Как учиться быстрее</h2>
    <ul class="plain">
      <li>Каждый день лучше, чем 3 часа раз в неделю: серия дней помогает запоминать.</li>
      <li>После каждого раздела делай практику в Studio. Код, набранный руками, запоминается в разы лучше.</li>
      <li>Начинай занятие с «Тренировки»: 5 минут на свои ошибки.</li>
      <li>Если уже знаешь тему — сдай тест раздела досрочно и сэкономь время.</li>
    </ul>
  </section>`;
}

/* ===== Тренировка ===== */
function viewPractice(){
  const n=S.mistakes.length;
  const doneIds=[];COURSE.forEach((U,u)=>U.lessons.forEach((L,l)=>{if(S.done[lk(u,l)])L.ex.forEach((_,i)=>doneIds.push(u+'.'+l+'.'+i));}));
  return `<div><h1 class="h-page">Тренировка</h1></div>
  <p class="lead">Повторение того, в чём ты ошибался. Каждая тренировка восстанавливает одно сердце.</p>
  <section class="card"><div class="kind">${IC.target} Работа над ошибками</div><h2>${n?n+' '+plural(n,'задание','задания','заданий')+' на повторение':'Ошибок пока нет'}</h2><p class="muted">${n?'Правильный ответ убирает задание из списка.':'Когда ошибёшься в уроке, задание попадёт сюда.'}</p><button class="btn" data-review="mistakes" ${n?'':'disabled'}>Повторить ошибки</button></section>

  <section class="card"><div class="kind">${IC.book} Справочник</div><h2>Вся теория курса</h2><p class="muted">Короткие конспекты всех уроков с примерами кода.</p><div class="seg">${COURSE.map((U,u)=>`<button data-ref="${u}">${u+1}. ${esc(U.title)}</button>`).join('')}</div></section>`;
}

/* ===== Профиль ===== */
function viewProfile(){
  const acc=S.answered?Math.round(S.correct/S.answered*100):0;
  const spent=Object.values(S.days).reduce((a,b)=>a+b,0);
  const wk=[];for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');wk.push({lab:d.toLocaleDateString('ru-RU',{weekday:'short'}),m:S.days[key]||0});}
  const mx=Math.max(S.goal,...wk.map(w=>w.m));
  return `<div><h1 class="h-page">Профиль</h1></div>
  <div class="stats">
    <div class="st" style="color:var(--gold)">${IC.flame}<div><b style="color:var(--ink)">${streakNow()}</b><span>${plural(streakNow(),'день','дня','дней')} подряд</span></div></div>
    <div class="st" style="color:var(--accent)">${IC.bolt}<div><b style="color:var(--ink)">${S.xp}</b><span>опыта (XP)</span></div></div>
    <div class="st" style="color:var(--good)">${IC.check}<div><b style="color:var(--ink)">${Object.keys(S.done).length}/${totalLessons}</b><span>уроков</span></div></div>
    <div class="st" style="color:var(--accent)">${IC.clock}<div><b style="color:var(--ink)">${fmtMin(spent)}</b><span>всего занятий</span></div></div>
    <div class="st" style="color:var(--gold)">${IC.trophy}<div><b style="color:var(--ink)">${COURSE.filter((_,u)=>passed(u)).length}/${COURSE.length}</b><span>тестов сдано</span></div></div>
    <div class="st" style="color:var(--bad)">${IC.target}<div><b style="color:var(--ink)">${acc}%</b><span>точность ответов</span></div></div>
  </div>
  <section class="card"><h2>Последние 7 дней</h2><div class="week">${wk.map(w=>`<div><span>${w.m?Math.round(w.m):''}</span><i class="${w.m>=S.goal?'met':''}" style="height:${(w.m/mx*80).toFixed(0)}%"></i><span>${w.lab}</span></div>`).join('')}</div><p class="small muted">Зелёный столбик — дневная цель (${S.goal} мин) выполнена.</p></section>
  <section class="card"><h2>Настройки</h2>
    <div class="ctrl"><label>Звуки</label><div class="seg"><button data-sound="1" aria-pressed="${S.sound}">Включены</button><button data-sound="0" aria-pressed="${!S.sound}">Выключены</button></div></div>
    <div class="ctrl"><label>Тема</label><div class="seg">${[['','Как в системе'],['light','Светлая'],['dark','Тёмная']].map(([k,t])=>`<button data-theme-set="${k}" aria-pressed="${(document.documentElement.dataset.theme||'')===k}">${t}</button>`).join('')}</div></div>
    <p class="small muted">Прогресс хранится в этом браузере.</p>
    <div><button class="btn ghost sm" id="reset">Сбросить прогресс</button></div>
  </section>`;
}

/* ===== обработчики вида ===== */
function bindView(){
  const v=$('#view');
  v.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{const [u,l]=b.dataset.lesson.split('-').map(Number);openLessonSheet(u,l);});
  v.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>openTestSheet(+b.dataset.test));
  v.querySelectorAll('[data-prac]').forEach(b=>b.onclick=()=>openPracticeSheet(+b.dataset.prac));
  v.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>openRefSheet(+b.dataset.ref));
  const f=v.querySelector('[data-final]');if(f)f.onclick=()=>startSession('final');
  v.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>startSession(b.dataset.review==='mistakes'?'mistakes':'random'));
  const g=v.querySelector('#goal');if(g){g.oninput=()=>{S.goal=+g.value;save();const y=window.scrollY;render();window.scrollTo(0,y);const ng=$('#goal');if(ng)ng.focus();};}
  v.querySelectorAll('[data-dpw]').forEach(b=>b.onclick=()=>{S.dpw=+b.dataset.dpw;save();const y=window.scrollY;render();window.scrollTo(0,y);});
  v.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{S.sound=b.dataset.sound==='1';save();render();});
  v.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.themeSet;if(k)document.documentElement.dataset.theme=k;else delete document.documentElement.dataset.theme;try{localStorage.setItem(KEY+'-theme',k);}catch(e){}render();});
  const r=v.querySelector('#reset');if(r)r.onclick=()=>sheet(`<h2>Сбросить весь прогресс?</h2><p class="muted">Уроки, тесты, XP и серия дней будут удалены. Это нельзя отменить.</p><div class="row"><button class="btn ghost" data-close>Отмена</button><button class="btn bad" id="do-reset">Сбросить</button></div>`,el=>{el.querySelector('#do-reset').onclick=()=>{S=fresh();save();closeSheet();render();toast('Прогресс сброшен');};});
}

/* ================= ЛИСТЫ (модальные) ================= */
function sheet(html,bind){
  const root=$('#sheet-root');
  root.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc=root.querySelector('.scrim');
  sc.addEventListener('click',e=>{if(e.target===sc)closeSheet();});
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  if(bind)bind(root.querySelector('.sheet'));
  const fb=root.querySelector('.btn:not([disabled])');if(fb)fb.focus();
}
function closeSheet(){$('#sheet-root').innerHTML='';}
function openLessonSheet(u,l){
  const L=COURSE[u].lessons[l],can=lessonOpen(u,l),done=S.done[lk(u,l)];
  regenHearts();
  sheet(`<div class="kind">Раздел ${u+1} · урок ${l+1} из ${COURSE[u].lessons.length}</div><h2>${esc(L.title)}</h2>
  <p class="muted">${can?`Теория и ${L.ex.length} заданий · ~${EST.lesson} мин · +${done?5:10} XP`:'Сначала пройди предыдущий урок.'}</p>
  ${can&&S.hearts<=0?`<p style="color:var(--bad)">Сердца закончились. Новое появится через ${HEART_REGEN_MIN-Math.floor((Date.now()-S.heartTs)/6e4)} мин, или пройди тренировку.</p>`:''}
  <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn" id="go" ${can&&S.hearts>0?'':'disabled'}>${done?'Повторить':'Начать'}</button></div>`,
  el=>{const g=el.querySelector('#go');if(g)g.onclick=()=>{closeSheet();startSession('lesson',u,l);};});
}
function openTestSheet(u){
  const open=unitOpen(u)&&lessonsDone(u),early=!lessonsDone(u)&&(unitOpen(u)||u===firstLocked());
  const can=open||early||passed(u);
  sheet(`<div class="kind">${IC.trophy} Тест раздела ${u+1}</div><h2>${esc(COURSE[u].title)}</h2>
  <p class="muted">${can?`${TEST_N} вопросов из всех уроков раздела. Для зачёта нужно ${Math.ceil(TEST_N*PASS)} правильных. Сердца не тратятся.${early?' <b>Досрочно:</b> при успехе все уроки раздела засчитаются.':''}`:'Тест откроется, когда ты пройдёшь уроки этого раздела.'}</p>
  ${S.tests[u]!=null?`<p>Лучший результат: <b>${S.tests[u]}/${TEST_N}</b></p>`:''}
  <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn" id="go" ${can?'':'disabled'}>Начать тест</button></div>`,
  el=>{const g=el.querySelector('#go');if(g)g.onclick=()=>{closeSheet();startSession('test',u);};});
}
function openPracticeSheet(u){
  const P=COURSE[u].practice;
  sheet(`<div class="kind">${IC.hammer} Практика в Roblox Studio · ~${P.min} мин</div><h2>${esc(COURSE[u].title)}</h2>
  <p class="muted">Сделай это в Studio. Отметь пункты, а когда закончишь — нажми «Готово». Время зачтётся в дневную цель.</p>
  <ul class="checklist">${P.tasks.map((t,i)=>`<li><input type="checkbox" id="pt-${u}-${i}" ${S.practice[u]?'checked':''}><label for="pt-${u}-${i}">${esc(t)}</label></li>`).join('')}</ul>
  <div class="row"><button class="btn ghost" data-close>Закрыть</button><button class="btn good" id="go" ${S.practice[u]?'disabled':''}>${S.practice[u]?'Уже выполнено':'Готово · +'+P.min+' мин'}</button></div>`,
  el=>{const g=el.querySelector('#go');if(g&&!S.practice[u])g.onclick=()=>{S.practice[u]=true;S.xp+=15;markActivity(P.min);save();closeSheet();render();toast('Практика засчитана: +15 XP, +'+P.min+' мин');};});
}
function openRefSheet(u){
  const U=COURSE[u];
  sheet(`<div class="kind">${IC.book} Справка · раздел ${u+1}</div><h2>${esc(U.title)}</h2>${U.lessons.map(L=>`<div class="ref-unit"><h3>${esc(L.title)}</h3>${theoryHtml(L.theory)}</div>`).join('')}<button class="btn wide" data-close>Закрыть</button>`);
}
function theoryHtml(T){
  return T.map(x=>typeof x==='string'?`<p>${inl(x)}</p>`:x.c?`<pre class="code">${hl(x.c)}</pre>`:`<div class="tip"><b>Совет</b><span>${inl(x.tip)}</span></div>`).join('');
}

/* ================= СЕССИЯ (урок/тест) ================= */
let SS=null;
function startSession(kind,u,l){
  regenHearts();
  let ids=[];
  if(kind==='lesson'){ids=COURSE[u].lessons[l].ex.map((_,i)=>u+'.'+l+'.'+i);}
  else if(kind==='test'){const all=[];COURSE[u].lessons.forEach((L,ll)=>L.ex.forEach((_,i)=>all.push(u+'.'+ll+'.'+i)));ids=shuffle(all).slice(0,TEST_N);}
  else if(kind==='final'){const all=[];COURSE.forEach((U,uu)=>U.lessons.forEach((L,ll)=>L.ex.forEach((_,i)=>all.push(uu+'.'+ll+'.'+i))));
    // равномерно по разделам
    const per=shuffle(COURSE.map((_,uu)=>shuffle(all.filter(id=>id.startsWith(uu+'.')))));ids=[];let k=0;while(ids.length<FINAL_N){const p=per[k%per.length];if(p.length)ids.push(p.pop());k++;}ids=shuffle(ids);}
  else if(kind==='mistakes'){ids=shuffle(S.mistakes).slice(0,8);}
  else if(kind==='random'){const all=[];COURSE.forEach((U,uu)=>U.lessons.forEach((L,ll)=>{if(S.done[lk(uu,ll)])L.ex.forEach((_,i)=>all.push(uu+'.'+ll+'.'+i));}));ids=shuffle(all).slice(0,8);}
  if(!ids.length)return;
  SS={kind,u,l,queue:ids.slice(),unique:ids.length,solved:0,correct:0,wrong:0,phase:kind==='lesson'?'theory':'ex',cur:null,checked:false,start:Date.now(),failed:false};
  if(SS.phase==='ex')nextEx();
  drawLayer();
}
const usesHearts=()=>SS.kind==='lesson';
const requeue=()=>SS.kind==='lesson'||SS.kind==='mistakes'||SS.kind==='random';

function nextEx(){
  const id=SS.queue.shift();
  if(!id){finish();return;}
  const ex=exById(id);
  SS.cur={id,ex,order:ex.t==='c'?shuffle(ex.o.map((_,k)=>k)):null,sel:null,
    bank:ex.t==='o'?shuffle([...ex.p,...ex.x].map((t,k)=>({t,k}))):null,line:[],val:''};
  SS.checked=false;SS.lastOk=null;
}

function drawLayer(){
  const root=$('#layer-root');
  if(!SS){root.innerHTML='';document.body.style.overflow='';return;}
  document.body.style.overflow='hidden';
  const pct=SS.phase==='theory'?0:SS.phase==='done'?100:(SS.solved/SS.unique*100);
  const heartHtml=usesHearts()?`<div class="stat s-heart">${IC.heart}${S.hearts}</div>`:'';
  let body='',foot='';
  if(SS.phase==='theory'){
    const L=COURSE[SS.u].lessons[SS.l];
    body=`<div class="kind">${IC.book} Теория · раздел ${SS.u+1}</div><h2 class="q">${esc(L.title)}</h2><div class="theory">${theoryHtml(L.theory)}</div>`;
    foot=`<button class="btn wide" id="act">Перейти к заданиям</button>`;
  }else if(SS.phase==='done'){
    body=resultHtml();
    foot=`<button class="btn wide ${SS.failed?'':'good'}" id="act">Продолжить</button>`;
  }else{
    body=exHtml();
    if(!SS.checked){foot=`<button class="btn wide" id="act" ${canCheck()?'':'disabled'}>Проверить</button>`;}
    else{
      const ex=SS.cur.ex;
      foot=`<div class="fb"><h3>${SS.lastOk?IC.check.replace('<svg','<svg width="24" height="24"')+' Верно!':IC.x.replace('<svg','<svg width="24" height="24"')+' Неверно'}</h3>
      ${SS.lastOk?'':`<p>Правильный ответ: <span class="ans">${esc(answerText(ex))}</span></p>`}
      ${ex.e?`<p>${esc(ex.e)}</p>`:''}</div><button class="btn wide ${SS.lastOk?'good':'bad'}" id="act">Дальше</button>`;
    }
  }
  const kindName={lesson:'',test:'Тест',final:'Экзамен',mistakes:'Ошибки',random:'Повторение'}[SS.kind];
  root.innerHTML=`<div class="layer" role="dialog" aria-modal="true" aria-label="Урок">
   <div class="l-top"><div class="wrap"><button class="x" id="quit" aria-label="Выйти">${IC.x}</button><div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${kindName?`<span class="small muted" style="font-weight:700">${kindName}</span>`:''}${heartHtml}</div></div>
   <div class="l-body"><div class="wrap">${body}</div></div>
   <div class="l-foot ${SS.checked&&SS.phase==='ex'?(SS.lastOk?'ok':'no'):''}"><div class="wrap">${foot}</div></div></div>`;
  bindLayer();
}

function exHtml(){
  const {ex}=SS.cur;
  const label={c:'Выбери ответ',i:'Впиши пропущенное',o:'Собери код'}[ex.t];
  let h=`<div class="kind">${label}</div><div class="q">${esc(ex.q)}</div>`;
  if(ex.t==='c'){
    if(ex.code)h+=`<pre class="code">${hl(ex.code)}</pre>`;
    const mono=!!ex.code||ex.o.some(o=>/[(){}=.:"`]/.test(o)&&!/[а-яё]{4,}\s[а-яё]{4,}/i.test(o));
    h+=`<div class="opts">${SS.cur.order.map((k,pos)=>{
      let cls='opt'+(mono?' mono':'');
      if(SS.checked){if(k===ex.a)cls+=' right';else if(k===SS.cur.sel)cls+=' wrong';}
      return `<button class="${cls}" data-opt="${k}" aria-pressed="${SS.cur.sel===k}" ${SS.checked?'disabled':''}><span class="num">${pos+1}</span><span class="t">${esc(ex.o[k])}</span></button>`;}).join('')}</div>`;
  }else if(ex.t==='i'){
    const parts=ex.code.split('___');
    h+=`<pre class="code">${hl(parts[0])}<input class="blank" id="blank" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Пропущенное слово" value="${esc(SS.cur.val)}" ${SS.checked?'disabled':''} style="width:${Math.max(5,SS.cur.val.length+2,ex.a[0].length+2)}ch">${hl(parts[1]||'')}</pre>`;
    h+=`<p class="small muted">Регистр букв важен: Luau различает print и Print.</p>`;
  }else{
    h+=`<div class="answer-line" id="line">${SS.cur.line.map((k,pos)=>`<button class="chip" data-line="${pos}" ${SS.checked?'disabled':''}>${esc(SS.cur.bank.find(b=>b.k===k).t)}</button>`).join('')}</div>`;
    h+=`<div class="bank">${SS.cur.bank.map(b=>`<button class="chip ${SS.cur.line.includes(b.k)?'used':''}" data-bank="${b.k}" ${SS.checked?'disabled':''}>${esc(b.t)}</button>`).join('')}</div>`;
  }
  return h;
}
function canCheck(){const c=SS.cur;if(!c)return false;const t=c.ex.t;return t==='c'?c.sel!=null:t==='i'?c.val.trim().length>0:c.line.length>0;}
const norm=s=>s.replace(/\s+/g,'');
function isRight(){
  const c=SS.cur,ex=c.ex;
  if(ex.t==='c')return c.sel===ex.a;
  if(ex.t==='i')return ex.a.some(a=>norm(a)===norm(c.val));
  const got=c.line.map(k=>c.bank.find(b=>b.k===k).t);
  return got.length===ex.p.length&&got.every((t,i)=>t===ex.p[i]);
}
function answerText(ex){
  if(ex.t==='c')return ex.o[ex.a];
  if(ex.t==='i')return ex.code.replace('___',ex.a[0]);
  return ex.p.join(' ');
}
function check(){
  if(!canCheck())return;
  const ok=isRight();SS.checked=true;SS.lastOk=ok;
  S.answered++;
  const id=SS.cur.id;
  if(ok){
    S.correct++;SS.correct++;SS.solved++;
    if(SS.kind==='mistakes'||SS.kind==='random'||SS.kind==='lesson'){const ix=S.mistakes.indexOf(id);if(ix>=0&&SS.kind!=='lesson')S.mistakes.splice(ix,1);}
  }else{
    SS.wrong++;
    if(!S.mistakes.includes(id))S.mistakes.push(id);
    if(requeue())SS.queue.push(id);else SS.solved++;
    if(usesHearts()){S.hearts=Math.max(0,S.hearts-1);if(S.hearts<MAX_HEARTS&&S.hearts===MAX_HEARTS-1)S.heartTs=Date.now();}
  }
  beep(ok);save();renderTop();drawLayer();
}
function advance(){
  if(SS.phase==='theory'){SS.phase='ex';nextEx();drawLayer();return;}
  if(SS.phase==='done'){SS=null;drawLayer();render();return;}
  if(usesHearts()&&S.hearts<=0){SS.failed=true;finish();return;}
  nextEx();if(SS.phase!=='done')drawLayer();
}
function finish(){
  const mins=Math.min((Date.now()-SS.start)/6e4,SS.unique*2.5+6);
  SS.minutes=Math.max(1,mins);SS.phase='done';SS.xp=0;
  if(!SS.failed){
    if(SS.kind==='lesson'){const key=lk(SS.u,SS.l);SS.xp=S.done[key]?5:(SS.wrong===0?15:10);S.done[key]=true;}
    else if(SS.kind==='test'){SS.score=SS.correct;const was=passed(SS.u);S.tests[SS.u]=Math.max(S.tests[SS.u]||0,SS.correct);SS.pass=SS.correct>=Math.ceil(TEST_N*PASS);
      if(SS.pass){COURSE[SS.u].lessons.forEach((_,l)=>S.done[lk(SS.u,l)]=true);SS.xp=was?5:25;}else SS.xp=3;}
    else if(SS.kind==='final'){SS.score=SS.correct;S.final=Math.max(S.final,SS.correct);SS.pass=SS.correct>=Math.ceil(FINAL_N*PASS);SS.xp=SS.pass?100:10;}
    else{SS.xp=8;if(S.hearts<MAX_HEARTS){S.hearts++;SS.heartBack=true;}}
  }
  S.xp+=SS.xp;markActivity(SS.minutes);save();renderTop();drawLayer();
}
function resultHtml(){
  const acc=SS.correct+SS.wrong?Math.round(SS.correct/(SS.correct+SS.wrong)*100):100;
  let title,sub,color='var(--gold)';
  if(SS.failed){title='Сердца закончились';sub='Не беда! Повтори ошибки в «Тренировке» — это вернёт сердце, — и попробуй снова.';color='var(--bad)';}
  else if(SS.kind==='lesson'){title=SS.wrong===0?'Идеально!':'Урок пройден!';sub=SS.wrong===0?'Ни одной ошибки — бонус +5 XP.':'Ошибки попали в «Тренировку», повтори их позже.';}
  else if(SS.kind==='test'){title=SS.pass?'Тест сдан!':'Пока не сдан';sub=SS.pass?`Раздел «${COURSE[SS.u].title}» пройден. Следующий открыт.`:`Нужно ${Math.ceil(TEST_N*PASS)} из ${TEST_N}. Загляни в справку раздела и попробуй снова.`;color=SS.pass?'var(--good)':'var(--bad)';}
  else if(SS.kind==='final'){title=SS.pass?'Экзамен сдан!':'Почти получилось';sub=SS.pass?'Ты прошёл весь курс Luau. Время делать свою игру!':`Нужно ${Math.ceil(FINAL_N*PASS)} из ${FINAL_N}. Повтори слабые разделы.`;color=SS.pass?'var(--good)':'var(--bad)';}
  else {title='Тренировка завершена';sub=SS.heartBack?'+1 сердце восстановлено.':'Отличная работа над ошибками.';}
  const scoreTile=(SS.kind==='test'||SS.kind==='final')?`<div class="tile g"><span class="k">Результат</span><span class="v">${SS.score}/${SS.unique}</span></div>`:`<div class="tile g"><span class="k">Точность</span><span class="v">${acc}%</span></div>`;
  return `<div class="result"><svg class="medal" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="${color}"/><circle cx="60" cy="60" r="40" fill="none" stroke="var(--surface)" stroke-width="4" opacity=".55"/><path d="${SS.failed||SS.pass===false?'M44 44l32 32M76 44L44 76':'M40 62l14 14 28-30'}" fill="none" stroke="var(--surface)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <h2>${title}</h2><p class="lead">${sub}</p>
  <div class="tiles"><div class="tile"><span class="k">Опыт</span><span class="v">+${SS.xp}</span></div>${scoreTile}<div class="tile b"><span class="k">Время</span><span class="v">${Math.round(SS.minutes)} мин</span></div></div></div>`;
}
function bindLayer(){
  const root=$('#layer-root');
  root.querySelector('#quit').onclick=()=>{
    if(SS.phase==='done'){advance();return;}
    sheet(`<h2>Выйти из ${SS.kind==='lesson'?'урока':'задания'}?</h2><p class="muted">Прогресс этой попытки не сохранится.</p><div class="row"><button class="btn ghost" id="q-yes">Выйти</button><button class="btn" data-close>Продолжить</button></div>`,el=>{el.querySelector('#q-yes').onclick=()=>{closeSheet();SS=null;drawLayer();render();};});
  };
  const act=root.querySelector('#act');
  if(act)act.onclick=()=>{if(SS.phase==='ex'&&!SS.checked)check();else advance();};
  root.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{SS.cur.sel=+b.dataset.opt;drawLayer();});
  const bl=root.querySelector('#blank');
  if(bl){bl.oninput=()=>{SS.cur.val=bl.value;bl.style.width=Math.max(5,bl.value.length+2,SS.cur.ex.a[0].length+2)+'ch';const a=root.querySelector('#act');if(a)a.disabled=!canCheck();};if(!SS.checked)setTimeout(()=>bl.focus(),30);}
  root.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{const k=+b.dataset.bank;if(!SS.cur.line.includes(k)){SS.cur.line.push(k);drawLayer();}});
  root.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{SS.cur.line.splice(+b.dataset.line,1);drawLayer();});
  if(act&&(SS.checked||SS.phase!=='ex'))act.focus();
}
document.addEventListener('keydown',e=>{
  if(!SS||$('#sheet-root').innerHTML)return;
  if(e.key==='Enter'){const a=$('#act');if(a&&!a.disabled){e.preventDefault();a.click();}}
  else if(SS.phase==='ex'&&!SS.checked&&SS.cur&&SS.cur.ex.t==='c'&&/^[1-4]$/.test(e.key)&&document.activeElement.tagName!=='INPUT'){const k=SS.cur.order[+e.key-1];if(k!=null){SS.cur.sel=k;drawLayer();}}
  else if(e.key==='Escape'){$('#quit').click();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet-root').innerHTML){e.stopPropagation();closeSheet();}},true);

/* старт */
try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
setInterval(()=>{if(!SS)renderTop();},60000);
render();
</script>
