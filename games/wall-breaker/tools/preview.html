<script type="importmap">{ "imports": { "three": "http://wb.local/three.module.js" } }</script>
<style>
  @font-face { font-family: 'Russo One'; src: url(http://wb.local/fonts/russo-one-cyrillic-400-normal.woff2) format('woff2'); unicode-range: U+0400-04FF; }
  @font-face { font-family: 'Russo One'; src: url(http://wb.local/fonts/russo-one-latin-400-normal.woff2) format('woff2'); }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; font-family: 'Russo One', sans-serif; }
  canvas { display: block; }
  #hud, #labels, #fade, #title { position: absolute; inset: 0; pointer-events: none; }
  .stroke { color: #fff; text-shadow: -2px -2px 0 #1a1033, 2px -2px 0 #1a1033, -2px 2px 0 #1a1033, 2px 2px 0 #1a1033, 0 3px 0 #1a1033, 0 4px 6px rgba(0,0,0,.4); }
  /* 2×2 кнопки слева */
  /* 2×2 главные кнопки слева: подпись наложена на низ плитки */

  .tile span { z-index: 2; }

  #wheel .pill { background: linear-gradient(#8a3cff, #4b1ca8); border: 4px solid #1a1033; border-left: none; border-radius: 0 18px 18px 0; padding: 6px 18px 6px 24px; margin-left: -18px; font-size: 21px; line-height: 1.1; text-align: center; box-shadow: inset 0 3px 0 rgba(255,255,255,.25); }
  #wheel .wl { position: relative; width: 96px; height: 96px; z-index: 1; }
  #wheel .wl img { position: absolute; left: 0; top: 0; width: 96px; height: 96px; }
  #wheel .badge { position: absolute; left: 70px; top: -2px; width: 28px; height: 28px; border-radius: 50%; background: #ff2b3a; border: 3px solid #fff; color: #fff; font-size: 18px; text-align: center; line-height: 27px; z-index: 2; }
  /* нижний ряд кнопок */
  #bar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 16px; align-items: flex-end; }
  .bb { display: flex; flex-direction: column; align-items: center; width: 92px; }
  .bb img { width: 70px; height: 70px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  .bb span { font-size: 14px; text-align: center; line-height: 1.05; margin-top: -4px; }
  #jump { position: absolute; right: 40px; bottom: 40px; width: 84px; height: 84px; border-radius: 50%; background: rgba(30,20,60,.35); border: 3px solid rgba(255,255,255,.55); }
  #jump::after { content: ''; position: absolute; left: 27px; top: 22px; border: 15px solid transparent; border-bottom: 22px solid rgba(255,255,255,.85); }
  /* панель уровня */
  #lvl { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: 430px; text-align: center; display: none; }
  #lvl .name { font-size: 26px; }
  #lvl .sub { font-size: 15px; margin-top: 2px; }
  #lvl .bar { margin: 6px auto 0; width: 400px; height: 22px; border-radius: 12px; background: rgba(26,16,51,.55); border: 3px solid #1a1033; overflow: hidden; position: relative; }
  #lvl .fill { height: 100%; background: linear-gradient(#ffe14d, #ff9e1f); width: 0; }
  #lvl .bar b { position: absolute; inset: 0; font-size: 14px; line-height: 22px; font-weight: normal; }
  /* всплывашки */
  .toast { position: absolute; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; font-size: 40px; white-space: nowrap; }
  .toast img { width: 64px; height: 64px; }
  .pop { position: absolute; font-size: 24px; color: #ffe14d; white-space: nowrap; }
  #fade { background: #fff; opacity: 0; }

  .lbl small { display: block; font-size: 12px; color: #ffe9a8; }
  #title { display: none; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(26,16,51,.55), rgba(26,16,51,0) 70%); }
  #title h1 { margin: 0; font-size: 78px; line-height: 1; color: #ffe14d; text-align: center; font-weight: normal;
    text-shadow: -4px -4px 0 #1a1033, 4px -4px 0 #1a1033, -4px 4px 0 #1a1033, 4px 4px 0 #1a1033, 0 8px 0 #1a1033, 0 12px 20px rgba(0,0,0,.5); }

<script type="module">
import * as THREE from 'three';

const W = 1280, H = 720;
const ICON = (n) => `http://wb.local/icons/${n}.png`;

// ---------- утилиты ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (k) => k * k * (3 - 2 * k);
function fmt(n) { if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K'; return String(Math.floor(n)); }

const images = {};
function loadImg(n) { return new Promise((res) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => { images[n] = i; res(); }; i.src = ICON(n); }); }

function canvasTex(w, h, draw, pixel = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (pixel) { t.magFilter = THREE.NearestFilter; }
  t.anisotropy = 4;
  return t;
}
function rep(tex, rx, ry) { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t; }

// пиксельная текстура по палитре + функция рисования
function pixTex(seed, base, draw, size = 32) {
  const r = rng(seed);
  return canvasTex(size, size, (g, w, h) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { g.fillStyle = base[Math.floor(r() * base.length)]; g.fillRect(x, y, 1, 1); }
    if (draw) draw(g, r, w, h);
  });
}

// ---------- текстуры ----------
const TX = {};
function buildTextures() {
  TX.brick = pixTex(1, ['#c9652f', '#c05d2b', '#d2703a'], (g, r) => {
    for (let row = 0; row < 8; row++) {
      g.fillStyle = '#7d3a20'; g.fillRect(0, row * 4 + 3, 32, 1);
      const off = row % 2 ? 4 : 0;
      for (let x = off; x < 32; x += 8) g.fillRect(x, row * 4, 1, 3);
      for (let x = off; x < 32; x += 8) { g.fillStyle = ['#e0844a', '#b5532a', '#c9652f'][Math.floor(r() * 3)]; g.fillRect(x + 1, row * 4, 6, 1); }
    }
  });
  TX.grass = pixTex(2, ['#4ccb3a', '#43b934', '#58d646', '#3fae30']);
  TX.grassSide = pixTex(3, ['#8a5a32', '#7d5030', '#946238'], (g, r) => {
    for (let x = 0; x < 32; x++) { const d = 8 + Math.floor(r() * 5); g.fillStyle = '#4ccb3a'; g.fillRect(x, 0, 1, d); g.fillStyle = '#3fae30'; g.fillRect(x, d - 1, 1, 1); }
  });
  TX.floor = pixTex(4, ['#8e80d4', '#887acd', '#9486da'], (g, r) => {
    for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) {
      const x = tx * 8, y = ty * 8;
      g.fillStyle = '#6a5bb2'; g.fillRect(x, y + 7, 8, 1); g.fillRect(x + 7, y, 1, 8);
      g.fillStyle = '#a99cec'; g.fillRect(x, y, 7, 1); g.fillRect(x, y, 1, 7);
      if (r() < .4) { g.fillStyle = '#7d6fc6'; g.fillRect(x + 2 + Math.floor(r() * 3), y + 2 + Math.floor(r() * 3), 2, 1); }
    }
  });
  TX.darkFloor = pixTex(5, ['#5a4f86', '#544a7f', '#5f548d'], (g) => {
    for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) { g.fillStyle = '#3e3566'; g.fillRect(tx * 8, ty * 8 + 7, 8, 1); g.fillRect(tx * 8 + 7, ty * 8, 1, 8); }
  });
  TX.stoneBrick = pixTex(6, ['#8f939d', '#868a94', '#979ba5'], (g) => {
    for (let row = 0; row < 4; row++) { g.fillStyle = '#5f636d'; g.fillRect(0, row * 8 + 7, 32, 1); const off = row % 2 ? 8 : 0; for (let x = off; x < 32; x += 16) g.fillRect(x, row * 8, 1, 7); }
  });
  TX.wood = pixTex(7, ['#a86c3a', '#9d6333', '#b07440'], (g, r) => {
    for (let row = 0; row < 4; row++) { g.fillStyle = '#5e3a1e'; g.fillRect(0, row * 8 + 7, 32, 1); const off = Math.floor(r() * 24); g.fillRect(off, row * 8, 1, 7);
      for (let i = 0; i < 6; i++) { g.fillStyle = '#8d5a30'; g.fillRect(Math.floor(r() * 30), row * 8 + 1 + Math.floor(r() * 5), 3, 1); } }
  });
  TX.dirt = pixTex(8, ['#7a5233', '#6d482c', '#86603c', '#5f3f26']);

  // материалы стен уровней
  const crackEm = (seed, col) => canvasTex(32, 32, (g) => { const r = rng(seed); g.fillStyle = '#000'; g.fillRect(0, 0, 32, 32); g.fillStyle = col;
    for (let k = 0; k < 6; k++) { let x = Math.floor(r() * 32), y = Math.floor(r() * 32); for (let s = 0; s < 9; s++) { g.fillRect(x, y, 1, 1); x += Math.floor(r() * 3) - 1; y += Math.floor(r() * 3) - 1; } } });
  const plates = (border, rivet) => (g) => { for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) { const x = tx * 16, y = ty * 16; g.fillStyle = border; g.fillRect(x, y + 15, 16, 1); g.fillRect(x + 15, y, 1, 16);
      g.fillStyle = rivet; [[2, 2], [12, 2], [2, 12], [12, 12]].forEach(([a, b]) => g.fillRect(x + a, y + b, 2, 2)); } };
  TX.levels = [
    { name: 'Сено', map: pixTex(11, ['#e8c341', '#f0cf52', '#dcb436'], (g, r) => { for (let i = 0; i < 90; i++) { g.fillStyle = r() < .5 ? '#c99a24' : '#fbe58a'; g.fillRect(Math.floor(r() * 32), Math.floor(r() * 32), 3 + Math.floor(r() * 4), 1); }
        g.fillStyle = '#9c6a1a'; g.fillRect(0, 7, 32, 2); g.fillRect(0, 23, 32, 2); }) },
    { name: 'Дерево', map: TX.wood },
    { name: 'Уголь', map: pixTex(13, ['#4a4c55', '#43454e', '#50525c'], (g, r) => { for (let i = 0; i < 14; i++) { g.fillStyle = '#16171c'; const x = Math.floor(r() * 30), y = Math.floor(r() * 30); g.fillRect(x, y, 2 + Math.floor(r() * 2), 2); } }) },
    { name: 'Камень', map: TX.stoneBrick },
    { name: 'Медь', map: pixTex(15, ['#d9773a', '#cf6e33', '#e08040'], (g, r) => { plates('#9c4a1f', '#ffcf9a')(g); for (let i = 0; i < 18; i++) { g.fillStyle = '#4fb8a0'; g.fillRect(Math.floor(r() * 32), Math.floor(r() * 32), 1 + Math.floor(r() * 2), 1); } }) },
    { name: 'Железо', map: pixTex(16, ['#d5d9e2', '#cdd1db', '#dde1ea'], plates('#8d93a3', '#ffffff')) },
    { name: 'Золото', map: pixTex(17, ['#ffcf3a', '#ffc72e', '#ffd84d'], (g) => { plates('#d99a12', '#fff19a')(g); g.fillStyle = '#fff19a'; g.fillRect(3, 4, 6, 1); g.fillRect(19, 20, 6, 1); }), emissive: 0x332200 },
    { name: 'Обсидиан', map: pixTex(18, ['#1d1030', '#22133a', '#170c27', '#2a1748']), em: crackEm(181, '#b05cff'), emColor: 0xb05cff },
    { name: 'Алмаз', map: pixTex(19, ['#5fe3f0', '#55d8ea', '#6aeaf5'], (g, r) => { for (let i = 0; i < 16; i++) { g.fillStyle = r() < .5 ? '#c8ffff' : '#2bb5d6'; const x = Math.floor(r() * 30), y = Math.floor(r() * 30); g.fillRect(x, y, 2, 2); } plates('#2bb5d6', '#e8ffff')(g); }), emissive: 0x0a3a44 },
    { name: 'Незерит', map: pixTex(20, ['#3a2e30', '#43363a', '#33282a', '#4a3b3d']), em: crackEm(201, '#ff5a1f'), emColor: 0xff6a2a },
  ];
  TX.portal = canvasTex(64, 128, (g) => { const gr = g.createRadialGradient(32, 80, 2, 32, 80, 70); gr.addColorStop(0, '#ffffff'); gr.addColorStop(.25, '#ff9cf5'); gr.addColorStop(.6, '#b44dff'); gr.addColorStop(1, '#4b1ca8'); g.fillStyle = gr; g.fillRect(0, 0, 64, 128); }, false);
}

// ---------- материалы ----------
const matCache = {};
function std(color, opts = {}) { return new THREE.MeshStandardMaterial({ color, roughness: .85, metalness: 0, ...opts }); }
function texMat(tex, rx, ry, opts = {}) { return new THREE.MeshStandardMaterial({ map: rep(tex, rx, ry), roughness: .9, ...opts }); }
function glow(color, intensity = 2) { return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: intensity, roughness: .4 }); }

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
// коробка с текстурой, повтор по размерам (1 тайл = s стадов)
function tbox(w, h, d, tex, s, x, y, z, parent = scene, opts = {}) {
  const mats = [texMat(tex, d / s, h / s, opts), texMat(tex, d / s, h / s, opts), texMat(tex, w / s, d / s, opts), texMat(tex, w / s, d / s, opts), texMat(tex, w / s, h / s, opts), texMat(tex, w / s, h / s, opts)];
  return box(w, h, d, mats, x, y, z, parent);
}
// блок с травой сверху
function grassBlock(w, h, d, x, y, z) {
  const side = texMat(TX.brick, w / 4, h / 4);
  const g = new THREE.Group(); scene.add(g);
  tbox(w, h, d, TX.brick, 4, x, y, z, g);
  const topSideX = texMat(TX.grassSide, d / 4, 1), topSideZ = texMat(TX.grassSide, w / 4, 1), top = texMat(TX.grass, w / 4, d / 4);
  box(w + .4, 1.6, d + .4, [topSideX, topSideX, top, top, topSideZ, topSideZ], x, y + h / 2 + .8, z, g);
  return g;
}

// ---------- надписи ----------
function textTex(w, h, draw) { return canvasTex(w, h, draw, false); }
function strokeText(g, txt, x, y, size, fill = '#fff', stroke = '#1a1033', align = 'center') {
  g.font = `${size}px "Russo One"`; g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = size * .22; g.strokeStyle = stroke; g.strokeText(txt, x, y); g.fillStyle = fill; g.fillText(txt, x, y);
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// табличка: деревянная доска с иконкой и текстом
function sign({ w, h, title, sub, icon, bg = '#4b2a9e', border = '#ffe14d', titleColor = '#fff', size = 1 }) {
  const PW = 512, PH = Math.round(512 * h / w);
  const tex = textTex(PW, PH, (g) => {
    roundRect(g, 6, 6, PW - 12, PH - 12, 36); g.fillStyle = bg; g.fill(); g.lineWidth = 12; g.strokeStyle = '#1a1033'; g.stroke();
    roundRect(g, 18, 18, PW - 36, PH - 36, 28); g.lineWidth = 6; g.strokeStyle = border; g.stroke();
    const hasIcon = icon && images[icon];
    const iconS = Math.min(PH - 60, 150) * size;
    let tx = PW / 2;
    if (hasIcon) { g.drawImage(images[icon], 34, PH / 2 - iconS / 2 - (sub ? 0 : 0), iconS, iconS); tx = 34 + iconS + (PW - 34 - iconS) / 2 - 10; }
    const ts = Math.min(78 * size, (PW - (hasIcon ? iconS + 70 : 60)) / Math.max(4, title.length) * 1.75);
    strokeText(g, title, tx, sub ? PH / 2 - ts * .35 : PH / 2, ts, titleColor);
    if (sub) strokeText(g, sub, tx, PH / 2 + ts * .55, ts * .5, '#ffe9a8');
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: .7, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: .35 }));
  const back = new THREE.Mesh(new THREE.BoxGeometry(w + .4, h + .4, .5), std(0x2a1a4a));
  back.position.z = -.3; m.add(back); back.castShadow = true;
  // двусторонняя табличка: надпись видна и сзади
  const m2 = new THREE.Mesh(m.geometry, m.material); m2.rotation.y = Math.PI; m2.position.z = -.6; m.add(m2);
  return m;
}
function sprite(draw, w, h, sw, sh) {

function spawnDebris(L, k) {
  const m = layers[L][k]; const r = rng(L * 100 + k + 1); const out = [];
  const mat = Array.isArray(m.material) ? m.material[4] : m.material;
  for (let i = 0; i < 18; i++) {
    const s = .6 + r() * .9; const d = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), mat); d.castShadow = true; scene.add(d);
    d.userData = { p0: new THREE.Vector3((r() - .5) * 18, 1 + r() * 13, m.position.z + (r() - .5)), v: new THREE.Vector3((r() - .5) * 10, 4 + r() * 8, 6 + r() * 10), rot: new THREE.Vector3(r() * 6, r() * 6, r() * 6) };
    d.visible = false; out.push(d);
  }
  return out;
}

// ---------- таймлайн видео ----------
const BREAK_T0 = 11.0, BREAK_DT = .62;
const breakTimes = Array.from({ length: 10 }, (_, k) => BREAK_T0 + .5 + k * BREAK_DT);
let debrisSets;

const cam = { p: new THREE.Vector3(), t: new THREE.Vector3() };
function catmull(keys, t) { // keys: [time, [x,y,z]]
  if (t <= keys[0][0]) return new THREE.Vector3(...keys[0][1]);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a] = keys[i], [t1, b] = keys[i + 1];
    if (t <= t1) { const k = ease((t - t0) / (t1 - t0)); return new THREE.Vector3(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)); }
  }
  return new THREE.Vector3(...keys[keys.length - 1][1]);
}

function setScene(t, still) {
  // яйца крутятся
  scene.traverse((o) => { if (o.userData && o.userData.spin != null) { o.rotation.y = t * .8 + o.userData.spin; o.position.y = 5.2 + Math.sin(t * 2 + o.userData.spin) * .35; } });
  trophyObjs.forEach((o, i) => { o.tro.position.y = o.baseY + Math.sin(t * 2.5 + i) * .3; });
  scene.children.forEach((o) => { if (o.userData.spinPick != null) o.rotation.y = -Math.PI / 2 + Math.sin(t * 1.5 + o.userData.spinPick) * .35; });
  petObj.rotation.y = 0;

  let wins = 7, strength = 3190, layerDone = 0, toasts = '', showLvl = false, fade = 0, title = false, hudOn = true;
  const L1 = layers[0], lvlZ0 = LVL0;

  // --- позиция игрока ---
  let px = 0, pz = 30, walk = 0, swing = null, faceY = Math.PI;
  if (t < 6) { px = -2; pz = 30; walk = 0; }
  else if (t < 10.4) { const k = (t - 6) / 4.4; pz = lerp(30, -HD + 2, k); px = 0; walk = t * 9; }
  else {
    // уровень 1
    for (let k = 0; k < 10; k++) if (t >= breakTimes[k]) layerDone = k + 1;
    const frontZ = (k) => L1[Math.min(k, 9)].position.z + 3.2;
    if (t < BREAK_T0) { pz = lerp(lvlZ0 - 2, frontZ(0), clamp((t - 10.4) / .6)); walk = t * 9; }
    else if (layerDone < 10) {
      const since = t - (layerDone ? breakTimes[layerDone - 1] : BREAK_T0);
      pz = lerp(layerDone ? frontZ(layerDone - 1) : frontZ(0), frontZ(layerDone), clamp(since / .25)); swing = t * 22;
      if (since < .25) { walk = t * 9; swing = null; }
    } else if (t < 17.5) { const k = clamp((t - breakTimes[9]) / (17.5 - breakTimes[9])); pz = lerp(frontZ(9), lvlZ0 - 50, k); px = lerp(0, 9, ease(clamp((k - .5) * 2))); walk = t * 9; }
    else if (t < 19) { const k = clamp((t - 17.5) / 1.2); pz = lvlZ0 - 50 + 4 * ease(k) - 4 * 0; px = lerp(9, 17.5, ease(k)); faceY = -Math.PI / 2; walk = k < 1 ? t * 9 : 0; }
    else { pz = lvlZ0 - 50; px = 17.5; faceY = -Math.PI / 2; }
    if (t < 19 && t >= 17.5) faceY = Math.PI - Math.PI / 2 * ease(clamp((t - 17.5) / 1.2));
    strength = 3190 + layerDone * 412;
    showLvl = t < 17.5;
  }
  player.position.set(px, 0, pz); player.rotation.y = faceY; pose(player, walk, swing);
  petObj.position.set(px - 3.2, 1.9 + Math.sin(t * 4) * .3, pz + 3); petObj.rotation.y = faceY;

  // --- слои ---
  if (!debrisSets) debrisSets = L1.map((_, k) => spawnDebris(0, k));
  L1.forEach((m, k) => {
    const tb = breakTimes[k]; const broken = t >= tb && t >= 10.4;
    const shake = (!broken && k === layerDone && t > BREAK_T0) ? Math.sin(t * 70) * .08 : 0;
    m.visible = !broken; m.position.x = shake; m.userData.num.visible = k === layerDone;
    debrisSets[k].forEach((d) => { const dt = t - tb; d.visible = broken && dt < 1.6 && t < 18; if (d.visible) { const u = d.userData; d.position.set(u.p0.x + u.v.x * dt * .6, Math.max(.3, u.p0.y + u.v.y * dt - 14 * dt * dt), u.p0.z + u.v.z * dt); d.rotation.set(u.rot.x * dt, u.rot.y * dt, u.rot.z * dt); } });
  });
  // всплывашки силы и руды
  if (t > BREAK_T0 && layerDone < 10 && t < 17) {
    const ph = (t * 22) % (Math.PI * 2); const k = ((t - BREAK_T0) * 22 / (Math.PI * 2)) % 1;
    toasts += `<div class="pop stroke" style="left:${560 + Math.sin(t * 3) * 40}px;top:${330 - k * 70}px;opacity:${1 - k}">+${fmt(37 * (1 + layerDone))} силы</div>`;
  }
  const oreT = breakTimes[4];
  if (t > oreT && t < oreT + 1.6) { const k = (t - oreT) / 1.6; toasts += toast('Выпала руда: Уголь!', 'ore_coal', 70 - k * 6, k < .8 ? 1 : (1 - k) * 5, .8); }
  const winT = 19.2;
  if (t >= winT) wins = 8;
  if (t > winT && t < 21.2) { const k = (t - winT) / 2; toasts += toast('+1 Победа!', 'stat_wins', 28 - k * 8, k < .75 ? 1 : (1 - k) * 4, 1 + .2 * Math.max(0, 1 - k * 6)); }
  if (t > 19.7 && t < 21.2) toasts += `<div class="toast stroke" style="top:40%;font-size:20px;opacity:${clamp((21.2 - t) * 2)}">с бонусом ×3 — сразу +3 победы</div>`;

  // --- камера ---
  let cp, ct;
  if (t < 6.2) {
    cp = catmull([[0, [-10, 150, 104]], [3, [40, 116, 110]], [6.2, [-22, 30, 54]]], t);
    ct = catmull([[0, [-10, 0, -12]], [3, [-12, 0, -6]], [6.2, [0, 4, -8]]], t);
  } else if (t < 10.4) {
    const k = clamp((t - 6.2) / 1.2); const base = new THREE.Vector3(9, 11, pz + 20), tgt = new THREE.Vector3(0, 6, pz - 14);
    cp = new THREE.Vector3(-22, 30, 48).lerp(base, ease(k)); ct = new THREE.Vector3(0, 4, -8).lerp(tgt, ease(k));
  } else if (t < 17.6) {
    cp = new THREE.Vector3(9.5, 10, pz + 15); ct = new THREE.Vector3(-1, 6, pz - 10);
  } else if (t < 21.5) {
    const k = ease(clamp((t - 17.6) / 1.4)); cp = new THREE.Vector3(lerp(9.5, -4, k), lerp(10, 9, k), lerp(lvlZ0 - 48 + 15, lvlZ0 - 50 + 8, k)); ct = new THREE.Vector3(lerp(-1, 19, k), lerp(6, 4.5, k), lerp(lvlZ0 - 58, lvlZ0 - 50, k));
  } else {
    const k = ease(clamp((t - 21.5) / 3.5)); cp = new THREE.Vector3(lerp(-4, 34, k), lerp(9, 120, k), lerp(lvlZ0 - 42, lvlZ0 + 10, k)); ct = new THREE.Vector3(lerp(19, 0, k), lerp(4.5, 0, k), lerp(lvlZ0 - 50, lvlZ0 - 250, k));
  }
  camera.position.copy(cp); camera.lookAt(ct); camera.fov = 55; camera.updateProjectionMatrix();
  levelSigns.forEach((s) => s.visible = t > 22);
  if (t > 25.4) { title = true; hudOn = false; }


  return { t, wins, strength, layerDone, toasts, showLvl, fade, title, hudOn, focus: t < 10.4 ? new THREE.Vector3(0, 0, 0) : new THREE.Vector3(px, 0, pz - 10) };
}

  document.querySelectorAll('#bar .bb img').forEach((im, i) => {
    let tr = `translateY(${-4 * Math.sin(t * 2.6 + i * .9)}px)`;
    if (i === 2 && (t % 2.4) < .6) tr += ` rotate(${12 * Math.sin(t * 28)}deg)`;
    if (i === 4) tr += ` rotate(${(t * 40) % 360}deg)`;
    if (i === 1) tr += ` scale(${1 + .06 * Math.max(0, Math.sin(t * 4))})`;
    im.style.transform = tr;
  });
  const st = document.querySelectorAll('#stats img');
  st[0].style.transform = `rotate(${-14 * Math.max(0, Math.sin(t * 5))}deg)`; st[0].style.transformOrigin = '30% 80%';
  st[1].style.transform = `rotate(${8 * Math.sin(t * 1.8)}deg)`;
  st[2].style.transform = `scale(${1 + .08 * Math.max(0, Math.sin(t * 3.5))})`;
}

function applyHud(s) {
  hud.style.display = s.hudOn ? 'block' : 'none';
  animHud(s.t || 0);
  $('sWins').textContent = s.wins.toLocaleString('en-US'); $('sStr').textContent = Math.floor(s.strength).toLocaleString('en-US');
  $('lvl').style.display = s.showLvl ? 'block' : 'none';
  $('lvlFill').style.width = s.layerDone * 10 + '%'; $('lvlBar').textContent = s.layerDone >= 10 ? 'Стена пройдена!' : `Слой ${s.layerDone} / 10`;
  $('toasts').innerHTML = s.toasts || '';
  $('fade').style.opacity = s.fade || 0;
  $('title').style.display = s.title ? 'flex' : 'none';
}

function setSun(focus, span = 70) {
  sun.position.set(focus.x + 50, 110, focus.z + 40); sun.target.position.copy(focus); sun.target.updateMatrixWorld();
  const c = sun.shadow.camera; c.left = -span; c.right = span; c.top = span; c.bottom = -span; c.updateProjectionMatrix();
}

// ---------- кадры-скриншоты ----------
const STILLS = {
  hub: { t: 2, cam: [-10, 150, 104], tgt: [-10, 0, -8] },
  hub_front: { t: 2, cam: [0, 26, 60], tgt: [0, 5, -40] },
  shop: { t: 2, cam: [14, 20, 34], tgt: [54, 4, -2] },
  pits: { t: 2, cam: [8, 58, 62], tgt: [-52, -2, -8] },
  eggs: { t: 2, cam: [12, 15, 36], tgt: [0, 5, 56] },
  trader: { t: 2, cam: [26, 14, -32], tgt: [54, 5, -54] },
  level: { t: 14.2 },
  reward: { t: 19.6 },
  levels: { t: 25 },
};

window.renderAt = (t, still = null, hudT = null) => {
  let s;
  if (still === 'plan') {
    s = setScene(2); s.hudOn = false; s.toasts = ''; levelSigns.forEach((x) => x.visible = false);
    player.position.set(0, 0, 10); pose(player, 0, null); petObj.position.set(-3, 2, 13);
    setSun(new THREE.Vector3(0, 0, -20), 90);
    renderer.render(scene, ortho); applyHud(s);
    // подписи зон
    const L = [[0, 26, -58, 'Вход в уровни', 'центральная ось'], [0, 6, 52, 'Яйца питомцев', 'напротив входа'], [52, 12, 0, 'Магазин кирок', '3 ряда-ступени'],
      [-51, 2, 0, 'Ямы: 2 ряда напротив', 'дорожка посередине'], [52, 10, -56, 'Торговец рудами', 'угол'], [0, 1, 4, 'Свободный проход', ''], [-4, 4, -94, 'Уровень 1 · Сено', '10 слоёв'], [30, 2, -120, 'Ниша награды', '+1 / +3 победы'], [0, 4, -142, '→ Уровень 2', '']];
    $('labels').innerHTML = L.map(([x, y, z, a, b]) => { const v = new THREE.Vector3(x, y, z).project(ortho); return `<div class="lbl" style="left:${(v.x + 1) / 2 * W}px;top:${(1 - v.y) / 2 * H}px">${a}${b ? `<small>${b}</small>` : ''}</div>`; }).join('');
    return;
  }
  $('labels').innerHTML = '';
  if (still) {
    const st = STILLS[still]; s = setScene(st.t);
    if (st.cam) { camera.position.set(...st.cam); camera.lookAt(...st.tgt); s.focus = new THREE.Vector3(...st.tgt); }
    if (still === 'levels') { s.title = false; s.hudOn = false; }
    if (hudT != null) s.t = hudT;
    s.fade = 0;
  } else s = setScene(t);
  setSun(s.focus, t > 21 && !still ? 120 : 70);
  if (still === 'levels' || (!still && t > 21.5)) setSun(new THREE.Vector3(0, 0, LVL0 - 200), 260);
  renderer.render(scene, camera); applyHud(s);
};

async function init() {
  await document.fonts.load('40px "Russo One"');
  await Promise.all(['btn_levels', 'btn_pets', 'btn_trade', 'btn_lobby', 'btn_lock', 'stat_strength', 'stat_wins', 'pass_wins_x3', 'ore_coal', 'ore_gold', 'ore_ruby'].map(loadImg));
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  document.body.prepend(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = canvasTex(4, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#5aa8ff'); gr.addColorStop(.6, '#a9d8ff'); gr.addColorStop(1, '#e8f6ff'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); }, false);
  scene.fog = new THREE.Fog(0xcfeaff, 300, 1100);
  camera = new THREE.PerspectiveCamera(55, W / H, .5, 2000);
  const oh = 84; ortho = new THREE.OrthographicCamera(-oh * W / H, oh * W / H, oh, -oh, 1, 600);
  ortho.position.set(-10, 300, -70); ortho.up.set(-1, 0, 0); ortho.lookAt(-10, 0, -70);
  scene.add(new THREE.HemisphereLight(0xdff0ff, 0x6a4a9a, 1.25));
  sun = new THREE.DirectionalLight(0xfff1d6, 2.1); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0005; sun.shadow.camera.near = 1; sun.shadow.camera.far = 400; scene.add(sun, sun.target);
  buildTextures(); buildHub(); buildLevels();
  player = avatar(); scene.add(player); petObj = pet(); scene.add(petObj);
  window.__ready = true;
}
init();
</script>
